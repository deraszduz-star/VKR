<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <defs>
    <marker id="arr326" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  <style>
    .ttl{font-family:'Times New Roman',serif;font-size:15px;font-weight:bold;text-anchor:middle}
    .lbl{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle}
    .lblb{font-family:'Times New Roman',serif;font-size:12px;text-anchor:middle;font-weight:bold}
    .src{font-family:'Times New Roman',serif;font-size:13px;text-anchor:middle;font-style:italic}
    .ar{stroke:#000;stroke-width:1.5;fill:none}
    .strike{fill:#eee;stroke:#999;stroke-width:1;stroke-dasharray:3,2}
    .strikeT{font-family:'Times New Roman',serif;font-size:10px;text-anchor:middle;fill:#888}
    .fix{fill:#D5F5D9;stroke:#0a7d2a;stroke-width:1.3}
    .fixCrit{fill:#D5F5D9;stroke:#0a7d2a;stroke-width:2}
    .fixT{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle;fill:#0a4d18}
  </style>

  <rect width="1400" height="720" fill="white"/>
  <text x="700" y="28" class="ttl">Рис. 3.2.6. EPC-модель «Исполнение запросов граждан в архиве» (TO BE): устранённые узкие места</text>

  <text x="200" y="62" class="lblb">Узкое место AS IS</text>
  <text x="700" y="62" class="lblb">Решение TO BE</text>
  <text x="1140" y="62" class="lblb">Эффект</text>

  <!-- ROW 1: критическое — физический поиск -->
  <rect x="60" y="80" width="280" height="80" fill="#FFD6D6" stroke="#C00000" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="200" y="100" class="strikeT" font-weight="bold" fill="#C00000">⚠⚠ КРИТИЧЕСКОЕ:</text>
  <text x="200" y="118" class="strikeT" fill="#C00000">Физический поиск дела в</text>
  <text x="200" y="134" class="strikeT" fill="#C00000">хранилище 170 000+ ед.</text>
  <text x="200" y="150" class="strikeT" fill="#C00000">15 мин/запрос (68 %)</text>

  <line x1="340" y1="120" x2="430" y2="120" class="ar" marker-end="url(#arr326)"/>

  <rect x="430" y="80" width="320" height="80" class="fixCrit"/>
  <text x="590" y="100" class="fixT" font-weight="bold">Электронный поиск по базе</text>
  <text x="590" y="118" class="fixT">с оптическим распознаванием</text>
  <text x="590" y="134" class="fixT">символов; SSD-хранилище;</text>
  <text x="590" y="150" class="fixT">структурированный каталог</text>

  <line x1="750" y1="120" x2="970" y2="120" class="ar" marker-end="url(#arr326)"/>

  <rect x="970" y="80" width="340" height="80" fill="#d4edda" stroke="#0a7d2a" stroke-width="1.5"/>
  <text x="1140" y="102" class="fixT" font-weight="bold">15 мин → 2 мин (−87 %)</text>
  <text x="1140" y="120" class="fixT">время доступа к файлу</text>
  <text x="1140" y="136" class="fixT">≤ 2 сек на SSD;</text>
  <text x="1140" y="152" class="fixT">точность OCR ≥ 98 %</text>

  <!-- ROW 2 -->
  <rect x="60" y="180" width="280" height="60" class="strike"/>
  <text x="200" y="200" class="strikeT" font-weight="bold">Только 12 % фонда оцифровано</text>
  <text x="200" y="216" class="strikeT">(за 2014–2025); 0 % за 1960–2014</text>
  <text x="200" y="232" class="strikeT">— исключительно бумажный поиск</text>

  <line x1="340" y1="210" x2="430" y2="210" class="ar" marker-end="url(#arr326)"/>

  <rect x="430" y="180" width="320" height="60" class="fix"/>
  <text x="590" y="200" class="fixT" font-weight="bold">Пилотный проект: сканирование</text>
  <text x="590" y="216" class="fixT">30 000 ед. за 27 дней с привлечением</text>
  <text x="590" y="232" class="fixT">студентов-практикантов + OCR</text>

  <line x1="750" y1="210" x2="970" y2="210" class="ar" marker-end="url(#arr326)"/>

  <rect x="970" y="180" width="340" height="60" fill="#fff7e6" stroke="#888"/>
  <text x="1140" y="200" class="lbl" font-weight="bold">100 % целевого массива</text>
  <text x="1140" y="218" class="lbl">в электронном виде;</text>
  <text x="1140" y="234" class="lbl">+88 п.п. к уровню оцифровки</text>

  <!-- ROW 3 -->
  <rect x="60" y="260" width="280" height="60" class="strike"/>
  <text x="200" y="280" class="strikeT" font-weight="bold">Риск утраты документов</text>
  <text x="200" y="296" class="strikeT">(нет резервных копий бумажных</text>
  <text x="200" y="312" class="strikeT">оригиналов; перемещения)</text>

  <line x1="340" y1="290" x2="430" y2="290" class="ar" marker-end="url(#arr326)"/>

  <rect x="430" y="260" width="320" height="60" class="fix"/>
  <text x="590" y="280" class="fixT" font-weight="bold">Резервное копирование на SSD;</text>
  <text x="590" y="296" class="fixT">зеркалирование данных;</text>
  <text x="590" y="312" class="fixT">бумажные оригиналы — для юридич. валид.</text>

  <line x1="750" y1="290" x2="970" y2="290" class="ar" marker-end="url(#arr326)"/>

  <rect x="970" y="260" width="340" height="60" fill="#fff7e6" stroke="#888"/>
  <text x="1140" y="280" class="lbl" font-weight="bold">Устранение системного риска</text>
  <text x="1140" y="298" class="lbl">утраты данных;</text>
  <text x="1140" y="314" class="lbl">сохранение оригиналов</text>

  <!-- ROW 4 -->
  <rect x="60" y="340" width="280" height="60" class="strike"/>
  <text x="200" y="360" class="strikeT" font-weight="bold">Ручная выписка данных</text>
  <text x="200" y="376" class="strikeT">из бумажного дела;</text>
  <text x="200" y="392" class="strikeT">отсутствие электронного копирования</text>

  <line x1="340" y1="370" x2="430" y2="370" class="ar" marker-end="url(#arr326)"/>

  <rect x="430" y="340" width="320" height="60" class="fix"/>
  <text x="590" y="360" class="fixT" font-weight="bold">Копирование из электронной копии;</text>
  <text x="590" y="376" class="fixT">автозаполнение шаблона справки</text>
  <text x="590" y="392" class="fixT">(стандартизация + автоматизация)</text>

  <line x1="750" y1="370" x2="970" y2="370" class="ar" marker-end="url(#arr326)"/>

  <rect x="970" y="340" width="340" height="60" fill="#fff7e6" stroke="#888"/>
  <text x="1140" y="360" class="lbl" font-weight="bold">−30 сек/справка</text>
  <text x="1140" y="378" class="lbl">снижение количества</text>
  <text x="1140" y="394" class="lbl">опечаток и ошибок</text>

  <!-- ROW 5 -->
  <rect x="60" y="420" width="280" height="60" class="strike"/>
  <text x="200" y="440" class="strikeT" font-weight="bold">Перемещения между</text>
  <text x="200" y="456" class="strikeT">стеллажами хранилища</text>
  <text x="200" y="472" class="strikeT">при поиске дела</text>

  <line x1="340" y1="450" x2="430" y2="450" class="ar" marker-end="url(#arr326)"/>

  <rect x="430" y="420" width="320" height="60" class="fix"/>
  <text x="590" y="440" class="fixT" font-weight="bold">Поиск за рабочим столом</text>
  <text x="590" y="456" class="fixT">через электронный каталог</text>
  <text x="590" y="472" class="fixT">(полнотекстовый поиск)</text>

  <line x1="750" y1="450" x2="970" y2="450" class="ar" marker-end="url(#arr326)"/>

  <rect x="970" y="420" width="340" height="60" fill="#fff7e6" stroke="#888"/>
  <text x="1140" y="440" class="lbl" font-weight="bold">−13 мин перемещений</text>
  <text x="1140" y="458" class="lbl">68 % времени → переориентация</text>
  <text x="1140" y="474" class="lbl">на аналитическую работу</text>

  <!-- Итоговый блок -->
  <rect x="80" y="510" width="1240" height="120" fill="#d4edda" stroke="#0a7d2a" stroke-width="2"/>
  <text x="700" y="532" class="lblb">Совокупный эффект EPC TO BE</text>
  <text x="100" y="554" class="lbl" text-anchor="start">• Время выдачи справки: 22 мин → 14 мин (−36 %)   • Время поиска: 15 мин → 2 мин (−87 %)</text>
  <text x="100" y="574" class="lbl" text-anchor="start">• Уровень оцифровки целевого массива: 12 % → 100 %   • Доля НДЦ: 68 % → ~15 %</text>
  <text x="100" y="594" class="lbl" text-anchor="start">• Экономия при сокращении 1 сотрудника: 480 000 руб./год   • Эффективность процессов УДК: 27 342 руб./мес = 328 113 руб./год</text>
  <text x="100" y="614" class="lbl" text-anchor="start">• Совокупная экономия УДК: ~808 000 руб./год; устранение системного риска утраты данных</text>

  <text x="700" y="695" class="src">Источник: составлено автором.</text>
</svg>
