<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1380" viewBox="0 0 1100 1380">
  <defs>
    <marker id="ar326" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    .ttl{font-family:'Times New Roman',serif;font-size:16px;font-weight:bold;text-anchor:middle}
    .lb{font-family:'Times New Roman',serif;font-size:12px;text-anchor:middle}
    .lbb{font-family:'Times New Roman',serif;font-size:14px;text-anchor:middle;font-weight:bold}
    .src{font-family:'Times New Roman',serif;font-size:13px;text-anchor:middle;font-style:italic}
    .ar{stroke:#000;stroke-width:1.3;fill:none}
    .evt{fill:#FCE4D6;stroke:#000;stroke-width:1.3}
    .fn{fill:#E2EFDA;stroke:#000;stroke-width:1.3}
    .gw{fill:#FFFFFF;stroke:#000;stroke-width:1.3}
    .sl{fill:#E8F4FD;stroke:#1F77B4;stroke-width:1.2;stroke-dasharray:4,3}
    .slT{font-family:'Times New Roman',serif;font-size:11px;text-anchor:start;fill:#0B4B7F}
    .slTc{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle;fill:#0B4B7F;font-weight:bold}
  </style>
  <rect width="1100" height="1380" fill="white"/>
  <text x="550" y="26" class="ttl">Рис. 3.2.6. EPC-модель «Исполнение запросов граждан в архиве» (TO BE): устранённые узкие места</text>

  <!-- E1 -->
  <polygon points="245,55 455,55 475,80 455,105 245,105 225,80" class="evt"/>
  <text x="350" y="78" class="lb">Заявка от гражданина</text>
  <text x="350" y="92" class="lb">поступила</text>
  <line x1="350" y1="105" x2="350" y2="135" class="ar" marker-end="url(#ar326)"/>

  <!-- F1: Регистрация в эл. журнале -->
  <rect x="245" y="135" width="210" height="55" rx="10" class="fn"/>
  <text x="350" y="160" class="lb">Регистрация заявки</text>
  <text x="350" y="174" class="lb">в электронном журнале</text>
  <line x1="350" y1="190" x2="350" y2="220" class="ar" marker-end="url(#ar326)"/>

  <!-- E2 -->
  <polygon points="245,220 455,220 475,245 455,270 245,270 225,245" class="evt"/>
  <text x="350" y="252" class="lb">Заявка зарегистрирована</text>
  <line x1="350" y1="270" x2="350" y2="300" class="ar" marker-end="url(#ar326)"/>

  <!-- F2: Электронный поиск -->
  <rect x="245" y="300" width="210" height="55" rx="10" class="fn"/>
  <text x="350" y="325" class="lb">Электронный поиск</text>
  <text x="350" y="339" class="lb">по базе (OCR)</text>
  <line x1="350" y1="355" x2="350" y2="395" class="ar"/>
  <line x1="455" y1="327" x2="510" y2="327" class="ar"/>
  <rect x="510" y="290" width="320" height="65" fill="#D6F0FF" stroke="#1F77B4" stroke-width="1.6" stroke-dasharray="4,3"/>
  <text x="670" y="308" class="slTc">УСТРАНЕНО КРИТИЧЕСКОЕ УЗКОЕ МЕСТО</text>
  <text x="520" y="325" class="slT">Полнотекстовый поиск OCR по 30 000 ед.;</text>
  <text x="520" y="340" class="slT">точность ≥ 98 %; SSD-хранилище.</text>
  <text x="520" y="353" class="slTc" text-anchor="start">Эффект: с 15 мин до 2 мин (−87 %)</text>

  <!-- XOR after function -->
  <circle cx="350" cy="420" r="22" class="gw"/>
  <text x="350" y="428" class="lbb">×</text>
  <text x="395" y="425" class="lb" text-anchor="start">XOR</text>

  <line x1="350" y1="442" x2="350" y2="455" class="ar"/>
  <line x1="180" y1="455" x2="520" y2="455" class="ar"/>
  <line x1="180" y1="455" x2="180" y2="485" class="ar" marker-end="url(#ar326)"/>
  <line x1="520" y1="455" x2="520" y2="485" class="ar" marker-end="url(#ar326)"/>
  <text x="220" y="450" class="lb">не найдено в базе</text>
  <text x="585" y="450" class="lb">найдено</text>

  <!-- Left branch: физический поиск (для не вошедших в пилот) -->
  <polygon points="95,485 265,485 285,510 265,535 95,535 75,510" class="evt"/>
  <text x="180" y="517" class="lb">Документ — вне пилота</text>
  <line x1="180" y1="535" x2="180" y2="565" class="ar" marker-end="url(#ar326)"/>
  <rect x="80" y="565" width="200" height="55" rx="10" class="fn"/>
  <text x="180" y="590" class="lb">Физический поиск</text>
  <text x="180" y="604" class="lb">(сокращённый)</text>
  <line x1="180" y1="620" x2="180" y2="650" class="ar" marker-end="url(#ar326)"/>
  <polygon points="95,650 265,650 285,675 265,700 95,700 75,675" class="evt"/>
  <text x="180" y="682" class="lb">Документ найден</text>
  <line x1="180" y1="700" x2="180" y2="730" class="ar"/>
  <line x1="180" y1="730" x2="520" y2="730" class="ar" marker-end="url(#ar326)"/>
  <text x="60" y="555" class="lb" text-anchor="start">10 мин</text>

  <!-- Right branch -->
  <polygon points="435,485 605,485 625,510 605,535 435,535 415,510" class="evt"/>
  <text x="520" y="517" class="lb">Документ найден в базе</text>
  <line x1="520" y1="535" x2="520" y2="730" class="ar"/>

  <!-- merge XOR -->
  <circle cx="520" cy="755" r="22" class="gw"/>
  <text x="520" y="763" class="lbb">×</text>
  <text x="565" y="760" class="lb" text-anchor="start">XOR</text>
  <line x1="520" y1="777" x2="520" y2="800" class="ar" marker-end="url(#ar326)"/>

  <!-- E -->
  <polygon points="435,800 605,800 625,825 605,850 435,850 415,825" class="evt"/>
  <text x="520" y="832" class="lb">Документ доступен</text>
  <line x1="520" y1="850" x2="520" y2="880" class="ar" marker-end="url(#ar326)"/>

  <!-- F3: Просмотр электронной копии -->
  <rect x="415" y="880" width="210" height="55" rx="10" class="fn"/>
  <text x="520" y="905" class="lb">Просмотр электронной</text>
  <text x="520" y="919" class="lb">копии, выписка данных</text>
  <line x1="520" y1="935" x2="520" y2="965" class="ar" marker-end="url(#ar326)"/>
  <line x1="625" y1="907" x2="680" y2="907" class="ar"/>
  <rect x="680" y="880" width="320" height="55" class="sl"/>
  <text x="690" y="898" class="slT">Бумажные оригиналы сохранены;</text>
  <text x="690" y="913" class="slT">копирование из электронной копии.</text>
  <text x="690" y="928" class="slTc" text-anchor="start">Эффект: устранён риск утраты</text>

  <!-- E -->
  <polygon points="435,965 605,965 625,990 605,1015 435,1015 415,990" class="evt"/>
  <text x="520" y="997" class="lb">Данные выписаны</text>
  <line x1="520" y1="1015" x2="520" y2="1045" class="ar" marker-end="url(#ar326)"/>

  <!-- F4: Формирование справки -->
  <rect x="415" y="1045" width="210" height="55" rx="10" class="fn"/>
  <text x="520" y="1070" class="lb">Формирование</text>
  <text x="520" y="1084" class="lb">архивной справки</text>
  <line x1="520" y1="1100" x2="520" y2="1130" class="ar" marker-end="url(#ar326)"/>

  <!-- E -->
  <polygon points="435,1130 605,1130 625,1155 605,1180 435,1180 415,1155" class="evt"/>
  <text x="520" y="1162" class="lb">Справка сформирована</text>
  <line x1="520" y1="1180" x2="520" y2="1210" class="ar" marker-end="url(#ar326)"/>

  <!-- F5: Заверение и выдача -->
  <rect x="415" y="1210" width="210" height="55" rx="10" class="fn"/>
  <text x="520" y="1235" class="lb">Заверение и выдача</text>
  <text x="520" y="1249" class="lb">справки заявителю</text>
  <line x1="520" y1="1265" x2="520" y2="1295" class="ar" marker-end="url(#ar326)"/>

  <!-- Final E -->
  <polygon points="435,1295 605,1295 625,1320 605,1345 435,1345 415,1320" class="evt" stroke-width="2"/>
  <text x="520" y="1322" class="lb" font-weight="bold">Запрос исполнен</text>
  <text x="520" y="1337" class="lb">(время цикла 14 мин)</text>

  <text x="550" y="1370" class="src">Источник: составлено автором.</text>
</svg>
