<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <marker id="ar311" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    .ttl{font-family:'Times New Roman',serif;font-size:16px;font-weight:bold;text-anchor:middle}
    .sub{font-family:'Times New Roman',serif;font-size:14px;font-weight:bold;text-anchor:middle}
    .bx{font-family:'Times New Roman',serif;font-size:13px;text-anchor:middle}
    .num{font-family:'Times New Roman',serif;font-size:11px;text-anchor:end}
    .lb{font-family:'Times New Roman',serif;font-size:11px}
    .lbc{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle}
    .src{font-family:'Times New Roman',serif;font-size:13px;text-anchor:middle;font-style:italic}
    .blk{fill:#FFFFFF;stroke:#000;stroke-width:1.6}
    .ar{stroke:#000;stroke-width:1.3;fill:none}
  </style>
  <rect width="1500" height="900" fill="white"/>
  <text x="750" y="26" class="ttl">Рис. 3.1.1. IDEF0-модель «Управление музейным фондом» (AS IS)</text>

  <!-- ===== LEFT: A-0 context ===== -->
  <text x="320" y="60" class="sub">Контекстная диаграмма А-0</text>

  <!-- Control (top, label outside) -->
  <text x="320" y="100" class="lbc">Регламенты Минкультуры; Положение о Дирекции музеев</text>
  <line x1="320" y1="110" x2="320" y2="240" class="ar" marker-end="url(#ar311)"/>

  <!-- Input (left) -->
  <text x="80" y="295" class="lb">Экспонаты;</text>
  <text x="80" y="310" class="lb">заявки на экскурсии;</text>
  <text x="80" y="325" class="lb">запросы исследователей</text>
  <line x1="80" y1="335" x2="200" y2="335" class="ar" marker-end="url(#ar311)"/>

  <!-- Central block -->
  <rect x="200" y="240" width="240" height="190" class="blk"/>
  <text x="320" y="335" class="bx" font-weight="bold">Управление</text>
  <text x="320" y="355" class="bx" font-weight="bold">музейным фондом</text>
  <text x="430" y="425" class="num">A0</text>

  <!-- Output (right) -->
  <line x1="440" y1="335" x2="565" y2="335" class="ar" marker-end="url(#ar311)"/>
  <text x="570" y="320" class="lb">Каталогизированный фонд;</text>
  <text x="570" y="335" class="lb">записи в Госкаталоге;</text>
  <text x="570" y="350" class="lb">экскурсии; публикации</text>

  <!-- Mechanism (bottom, arrow goes UP into block) -->
  <line x1="320" y1="540" x2="320" y2="430" class="ar" marker-end="url(#ar311)"/>
  <text x="320" y="560" class="lbc">Сотрудники музея; КАМИС; фотооборудование; интернет</text>

  <!-- Viewpoint / purpose -->
  <text x="320" y="610" class="lb" text-anchor="middle">Точка зрения: руководство Дирекции музеев КФУ.</text>
  <text x="320" y="626" class="lb" text-anchor="middle">Цель: выявление потерь в процессе учёта фонда.</text>

  <!-- Divider -->
  <line x1="640" y1="50" x2="640" y2="850" stroke="#999" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ===== RIGHT: A0 decomposition (staircase A1..A5) ===== -->
  <text x="1070" y="60" class="sub">Декомпозиция A0</text>

  <!-- top control rail -->
  <text x="1070" y="100" class="lbc">Регламенты Минкультуры; Положение о Дирекции музеев</text>
  <line x1="1070" y1="110" x2="1070" y2="135" class="ar"/>
  <line x1="780" y1="135" x2="1380" y2="135" class="ar"/>

  <!-- left input rail -->
  <text x="700" y="195" class="lb">Экспонаты</text>
  <line x1="700" y1="200" x2="780" y2="200" class="ar" marker-end="url(#ar311)"/>

  <!-- A1 -->
  <rect x="780" y="170" width="140" height="80" class="blk"/>
  <text x="850" y="200" class="bx">Приём и</text>
  <text x="850" y="216" class="bx">первичная</text>
  <text x="850" y="232" class="bx">атрибуция</text>
  <text x="912" y="246" class="num">A1</text>
  <line x1="850" y1="135" x2="850" y2="170" class="ar" marker-end="url(#ar311)"/>

  <!-- A1 -> A2 -->
  <line x1="920" y1="210" x2="950" y2="210" class="ar"/>
  <line x1="950" y1="210" x2="950" y2="290" class="ar" marker-end="url(#ar311)"/>
  <text x="958" y="252" class="lb">экспонат с №</text>

  <!-- A2 -->
  <rect x="950" y="290" width="140" height="80" class="blk"/>
  <text x="1020" y="324" class="bx">Фотосъёмка</text>
  <text x="1020" y="340" class="bx">и измерение</text>
  <text x="1082" y="366" class="num">A2</text>
  <line x1="1020" y1="135" x2="1020" y2="290" class="ar" marker-end="url(#ar311)"/>

  <!-- A2 -> A3 -->
  <line x1="1090" y1="330" x2="1120" y2="330" class="ar"/>
  <line x1="1120" y1="330" x2="1120" y2="410" class="ar" marker-end="url(#ar311)"/>
  <text x="1128" y="374" class="lb">фото, параметры</text>

  <!-- A3 -->
  <rect x="1120" y="410" width="140" height="80" class="blk"/>
  <text x="1190" y="444" class="bx">Регистрация</text>
  <text x="1190" y="460" class="bx">в КАМИС</text>
  <text x="1252" y="486" class="num">A3</text>
  <line x1="1190" y1="135" x2="1190" y2="410" class="ar" marker-end="url(#ar311)"/>

  <!-- A3 -> A4 (down-and-around) -->
  <line x1="1260" y1="450" x2="1300" y2="450" class="ar"/>
  <line x1="1300" y1="450" x2="1300" y2="555" class="ar"/>
  <line x1="1300" y1="555" x2="1090" y2="555" class="ar" marker-end="url(#ar311)"/>
  <text x="1305" y="500" class="lb">карточка</text>
  <text x="1305" y="515" class="lb">экспоната</text>

  <!-- A4 -->
  <rect x="950" y="530" width="140" height="80" class="blk"/>
  <text x="1020" y="564" class="bx">Выгрузка в</text>
  <text x="1020" y="580" class="bx">Госкаталог</text>
  <text x="1082" y="606" class="num">A4</text>
  <line x1="1020" y1="135" x2="1020" y2="530" class="ar" marker-end="url(#ar311)"/>

  <!-- A4 -> A5 -->
  <line x1="950" y1="570" x2="920" y2="570" class="ar"/>
  <line x1="920" y1="570" x2="920" y2="650" class="ar" marker-end="url(#ar311)"/>
  <text x="780" y="615" class="lb">запись в Госкаталоге</text>

  <!-- A5 -->
  <rect x="780" y="650" width="140" height="80" class="blk"/>
  <text x="850" y="680" class="bx">Организация</text>
  <text x="850" y="696" class="bx">экскурсий и</text>
  <text x="850" y="712" class="bx">научная работа</text>
  <text x="912" y="726" class="num">A5</text>
  <line x1="850" y1="135" x2="850" y2="650" class="ar" marker-end="url(#ar311)"/>

  <!-- Output to right from A3 (catalog records), from A5 (excursions) -->
  <line x1="1260" y1="430" x2="1380" y2="430" class="ar" marker-end="url(#ar311)"/>
  <text x="1388" y="425" class="lb">записи в</text>
  <text x="1388" y="440" class="lb">Госкаталоге</text>

  <line x1="920" y1="690" x2="1380" y2="690" class="ar" marker-end="url(#ar311)"/>
  <text x="1388" y="685" class="lb">экскурсии,</text>
  <text x="1388" y="700" class="lb">публикации</text>

  <!-- Mechanism rail (bottom) -->
  <line x1="700" y1="800" x2="1300" y2="800" class="ar"/>
  <line x1="850" y1="800" x2="850" y2="730" class="ar" marker-end="url(#ar311)"/>
  <line x1="1020" y1="800" x2="1020" y2="610" class="ar" marker-end="url(#ar311)"/>
  <line x1="1190" y1="800" x2="1190" y2="490" class="ar" marker-end="url(#ar311)"/>
  <text x="1000" y="822" class="lbc">Сотрудники музея; КАМИС; фотооборудование; интернет</text>

  <text x="750" y="880" class="src">Источник: составлено автором.</text>
</svg>
