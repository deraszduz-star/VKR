<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <marker id="ar312" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    .ttl{font-family:'Times New Roman',serif;font-size:16px;font-weight:bold;text-anchor:middle}
    .lb{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle}
    .lbb{font-family:'Times New Roman',serif;font-size:12px;text-anchor:middle;font-weight:bold}
    .tm{font-family:'Times New Roman',serif;font-size:10px;text-anchor:middle;font-style:italic;fill:#444}
    .src{font-family:'Times New Roman',serif;font-size:13px;text-anchor:middle;font-style:italic}
    .pool{fill:none;stroke:#000;stroke-width:1.4}
    .laneT{font-family:'Times New Roman',serif;font-size:12px;font-weight:bold;text-anchor:middle}
    .ar{stroke:#000;stroke-width:1.3;fill:none}
    .tk{fill:#FFFFFF;stroke:#000;stroke-width:1.3}
    .gw{fill:#FFFFFF;stroke:#000;stroke-width:1.3}
    .ev{fill:#FFFFFF}
  </style>
  <rect width="1500" height="500" fill="white"/>
  <text x="750" y="26" class="ttl">Рис. 3.1.2. BPMN-модель «Регистрация и описание музейных экспонатов в КАМИС» (AS IS)</text>

  <!-- Pool -->
  <rect x="40" y="60" width="1430" height="320" class="pool"/>
  <rect x="40" y="60" width="28" height="320" fill="#F2F2F2" stroke="#000" stroke-width="1.4"/>
  <text x="54" y="220" class="laneT" transform="rotate(-90 54 220)">Геологический музей</text>
  <!-- Lane -->
  <line x1="68" y1="60" x2="68" y2="380" stroke="#000" stroke-width="1.4"/>
  <rect x="68" y="60" width="28" height="320" fill="#FAFAFA" stroke="#000" stroke-width="1"/>
  <text x="82" y="220" class="laneT" transform="rotate(-90 82 220)">Заведующая музеем</text>
  <line x1="96" y1="60" x2="96" y2="380" stroke="#000" stroke-width="1"/>

  <!-- Y center for flow = 200 -->
  <!-- Start event -->
  <circle cx="135" cy="200" r="14" class="ev" stroke="#000" stroke-width="1.3"/>
  <text x="135" y="240" class="lb">Экспонат</text>
  <text x="135" y="254" class="lb">поступил</text>

  <!-- Task 1: Подготовка фотозоны -->
  <line x1="149" y1="200" x2="180" y2="200" class="ar" marker-end="url(#ar312)"/>
  <rect x="180" y="175" width="100" height="50" rx="8" class="tk"/>
  <text x="230" y="195" class="lb">Подготовка</text>
  <text x="230" y="209" class="lb">фотозоны</text>
  <text x="230" y="248" class="tm">5 мин 13 с</text>

  <!-- Task 2: Фотосъёмка -->
  <line x1="280" y1="200" x2="305" y2="200" class="ar" marker-end="url(#ar312)"/>
  <rect x="305" y="175" width="100" height="50" rx="8" class="tk"/>
  <text x="355" y="195" class="lb">Фотосъёмка</text>
  <text x="355" y="209" class="lb">экспоната</text>
  <text x="355" y="248" class="tm">1 мин 25 с</text>

  <!-- Task 3: Измерение параметров -->
  <line x1="405" y1="200" x2="430" y2="200" class="ar" marker-end="url(#ar312)"/>
  <rect x="430" y="175" width="100" height="50" rx="8" class="tk"/>
  <text x="480" y="195" class="lb">Измерение</text>
  <text x="480" y="209" class="lb">параметров</text>
  <text x="480" y="248" class="tm">2 мин 36 с</text>

  <!-- Task 4: Маркировка -->
  <line x1="530" y1="200" x2="555" y2="200" class="ar" marker-end="url(#ar312)"/>
  <rect x="555" y="175" width="100" height="50" rx="8" class="tk"/>
  <text x="605" y="195" class="lb">Маркировка</text>
  <text x="605" y="209" class="lb">экспоната</text>
  <text x="605" y="248" class="tm">2 мин 42 с</text>

  <!-- Task 5: Заполнение карточки -->
  <line x1="655" y1="200" x2="680" y2="200" class="ar" marker-end="url(#ar312)"/>
  <rect x="680" y="175" width="100" height="50" rx="8" class="tk"/>
  <text x="730" y="195" class="lb">Заполнение</text>
  <text x="730" y="209" class="lb">карточки</text>
  <text x="730" y="223" class="lb">в КАМИС</text>
  <text x="730" y="248" class="tm">2 мин 57 с</text>

  <!-- Task 6: Выгрузка -->
  <line x1="780" y1="200" x2="805" y2="200" class="ar" marker-end="url(#ar312)"/>
  <rect x="805" y="175" width="100" height="50" rx="8" class="tk"/>
  <text x="855" y="195" class="lb">Выгрузка в</text>
  <text x="855" y="209" class="lb">Госкаталог</text>
  <text x="855" y="248" class="tm">4 мин 21 с</text>

  <!-- Intermediate timer event (catching) -->
  <line x1="905" y1="200" x2="935" y2="200" class="ar" marker-end="url(#ar312)"/>
  <circle cx="950" cy="200" r="14" class="ev" stroke="#000" stroke-width="1.3"/>
  <circle cx="950" cy="200" r="10" class="ev" stroke="#000" stroke-width="1.3"/>
  <!-- clock hands -->
  <line x1="950" y1="200" x2="950" y2="193" stroke="#000" stroke-width="1.2"/>
  <line x1="950" y1="200" x2="956" y2="203" stroke="#000" stroke-width="1.2"/>
  <text x="950" y="240" class="lb">Ожидание</text>
  <text x="950" y="254" class="lb">прогрузки</text>
  <text x="950" y="268" class="tm">10 мин</text>

  <!-- Task 7: Перенос подтверждения -->
  <line x1="964" y1="200" x2="985" y2="200" class="ar" marker-end="url(#ar312)"/>
  <rect x="985" y="175" width="100" height="50" rx="8" class="tk"/>
  <text x="1035" y="195" class="lb">Перенос</text>
  <text x="1035" y="209" class="lb">подтверждения</text>
  <text x="1035" y="223" class="lb">в КАМИС</text>
  <text x="1035" y="248" class="tm">55 с</text>

  <!-- XOR Gateway -->
  <line x1="1085" y1="200" x2="1115" y2="200" class="ar" marker-end="url(#ar312)"/>
  <polygon points="1140,178 1162,200 1140,222 1118,200" class="gw"/>
  <line x1="1126" y1="186" x2="1154" y2="214" stroke="#000" stroke-width="1.2"/>
  <line x1="1154" y1="186" x2="1126" y2="214" stroke="#000" stroke-width="1.2"/>
  <text x="1140" y="245" class="lb">Корректно?</text>

  <!-- Branch "нет" — up loop back to "Заполнение карточки" -->
  <line x1="1140" y1="178" x2="1140" y2="120" class="ar"/>
  <line x1="1140" y1="120" x2="730" y2="120" class="ar"/>
  <line x1="730" y1="120" x2="730" y2="175" class="ar" marker-end="url(#ar312)"/>
  <text x="935" y="113" class="tm">нет (исправить)</text>

  <!-- Branch "да" — to End -->
  <line x1="1162" y1="200" x2="1200" y2="200" class="ar" marker-end="url(#ar312)"/>
  <text x="1180" y="195" class="tm">да</text>

  <!-- End event -->
  <circle cx="1215" cy="200" r="14" class="ev" stroke="#000" stroke-width="3"/>
  <text x="1215" y="240" class="lb">Экспонат</text>
  <text x="1215" y="254" class="lb">зарегистрирован</text>

  <!-- Caption with totals -->
  <text x="750" y="410" class="lb">Время цикла: ~45 мин на 1 экспонат · производительность 9 эксп./день при норме 20 эксп./день · доля операций НДЦ ≈ 64 %</text>

  <text x="750" y="475" class="src">Источник: составлено автором.</text>
</svg>
