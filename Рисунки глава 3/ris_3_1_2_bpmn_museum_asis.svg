<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640">
  <defs>
    <marker id="arr312" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  <style>
    .ttl{font-family:'Times New Roman',serif;font-size:15px;font-weight:bold;text-anchor:middle}
    .lbl{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle}
    .lblb{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle;font-weight:bold}
    .tm{font-family:'Times New Roman',serif;font-size:10px;text-anchor:middle;font-style:italic;fill:#444}
    .src{font-family:'Times New Roman',serif;font-size:13px;text-anchor:middle;font-style:italic}
    .pool{fill:none;stroke:#000;stroke-width:1.5}
    .lane{fill:#fafafa;stroke:#888;stroke-width:1}
    .laneTitle{font-family:'Times New Roman',serif;font-size:12px;font-weight:bold;text-anchor:middle}
    .ar{stroke:#000;stroke-width:1.5;fill:none}
    .ardash{stroke:#000;stroke-width:1.3;fill:none;stroke-dasharray:5,4}
    /* типы операций — цветовая разметка ДЦ/НДБ/НДЦ */
    .dc{fill:#d4edda;stroke:#000;stroke-width:1.3}     /* ДЦ — зелёный */
    .ndb{fill:#e2e3e5;stroke:#000;stroke-width:1.3}    /* НДБ — серый */
    .ndc{fill:#f8d7da;stroke:#000;stroke-width:1.3}    /* НДЦ — красный */
    .ev{fill:white;stroke-width:2}
    .gw{fill:white;stroke:#000;stroke-width:1.5}
  </style>

  <rect width="1500" height="640" fill="white"/>
  <text x="750" y="28" class="ttl">Рис. 3.1.2. BPMN-модель «Регистрация и описание музейных экспонатов в КАМИС» (AS IS)</text>

  <!-- Pool -->
  <rect x="40" y="60" width="1430" height="430" class="pool"/>
  <rect x="40" y="60" width="30" height="430" fill="#4472C4" stroke="#000"/>
  <text x="55" y="275" class="laneTitle" fill="white" transform="rotate(-90 55 275)">Геологический музей</text>
  <!-- Lane -->
  <rect x="70" y="60" width="1400" height="430" class="lane"/>
  <rect x="70" y="60" width="30" height="430" fill="#D9E2F3" stroke="#888"/>
  <text x="85" y="275" class="laneTitle" transform="rotate(-90 85 275)">Заведующая музеем</text>

  <!-- Легенда типов -->
  <rect x="1170" y="72" width="290" height="55" fill="white" stroke="#888"/>
  <text x="1315" y="88" class="lblb">Тип операции</text>
  <rect x="1180" y="95" width="14" height="10" class="dc"/><text x="1200" y="104" class="lbl" text-anchor="start">ДЦ — добавляет ценность</text>
  <rect x="1180" y="110" width="14" height="10" class="ndb"/><text x="1200" y="119" class="lbl" text-anchor="start">НДБ — необходимо для бизнеса</text>
  <rect x="1330" y="95" width="14" height="10" class="ndc"/><text x="1350" y="104" class="lbl" text-anchor="start">НДЦ — потери</text>

  <!-- Координаты потока (y=215 центральная линия) -->
  <!-- 1. Start -->
  <circle cx="125" cy="215" r="14" class="ev" stroke="#548235"/>
  <text x="125" y="245" class="lbl">Поступление</text>
  <text x="125" y="258" class="lbl">экспоната</text>

  <!-- 2. Подготовка рабочего места -->
  <line x1="139" y1="215" x2="170" y2="215" class="ar" marker-end="url(#arr312)"/>
  <rect x="170" y="190" width="100" height="50" rx="8" class="ndc"/>
  <text x="220" y="208" class="lbl">2. Подготовка</text>
  <text x="220" y="222" class="lbl">рабочего</text>
  <text x="220" y="236" class="lbl">места</text>
  <text x="220" y="258" class="tm">5 мин 13 сек · НДЦ</text>

  <!-- 3. Фотосъемка -->
  <line x1="270" y1="215" x2="295" y2="215" class="ar" marker-end="url(#arr312)"/>
  <rect x="295" y="190" width="95" height="50" rx="8" class="dc"/>
  <text x="342" y="210" class="lbl">3. Фото-</text>
  <text x="342" y="224" class="lbl">съемка</text>
  <text x="342" y="258" class="tm">1 мин 25 сек · ДЦ</text>

  <!-- 4. Измерение -->
  <line x1="390" y1="215" x2="415" y2="215" class="ar" marker-end="url(#arr312)"/>
  <rect x="415" y="190" width="100" height="50" rx="8" class="dc"/>
  <text x="465" y="210" class="lbl">4. Измерение</text>
  <text x="465" y="224" class="lbl">параметров</text>
  <text x="465" y="258" class="tm">2 мин 36 сек · ДЦ</text>

  <!-- 5. Поиск материалов и маркировка -->
  <line x1="515" y1="215" x2="540" y2="215" class="ar" marker-end="url(#arr312)"/>
  <rect x="540" y="190" width="105" height="50" rx="8" class="ndc"/>
  <text x="592" y="208" class="lbl">5. Поиск</text>
  <text x="592" y="222" class="lbl">материалов,</text>
  <text x="592" y="236" class="lbl">маркировка</text>
  <text x="592" y="258" class="tm">2 мин 42 сек · НДЦ/НДБ</text>

  <!-- 6. Перемещение к ПК -->
  <line x1="645" y1="215" x2="670" y2="215" class="ar" marker-end="url(#arr312)"/>
  <rect x="670" y="190" width="100" height="50" rx="8" class="ndc"/>
  <text x="720" y="210" class="lbl">6. Перемещ.</text>
  <text x="720" y="224" class="lbl">к компьютеру</text>
  <text x="720" y="258" class="tm">1 мин 33 сек · НДЦ</text>

  <!-- 7. Заполнение КАМИС -->
  <line x1="770" y1="215" x2="795" y2="215" class="ar" marker-end="url(#arr312)"/>
  <rect x="795" y="190" width="100" height="50" rx="8" class="dc"/>
  <text x="845" y="208" class="lbl">7. Заполнение</text>
  <text x="845" y="222" class="lbl">карточки</text>
  <text x="845" y="236" class="lbl">в КАМИС</text>
  <text x="845" y="258" class="tm">2 мин 57 сек · ДЦ</text>
  <!-- Иконка ИС -->
  <rect x="800" y="194" width="9" height="7" fill="#4472C4"/>

  <!-- 8. Выгрузка из КАМИС -->
  <line x1="895" y1="215" x2="920" y2="215" class="ar" marker-end="url(#arr312)"/>
  <rect x="920" y="190" width="100" height="50" rx="8" class="ndb"/>
  <text x="970" y="210" class="lbl">8. Выгрузка</text>
  <text x="970" y="224" class="lbl">файлов</text>
  <text x="970" y="258" class="tm">4 мин 21 сек · НДБ</text>
  <rect x="925" y="194" width="9" height="7" fill="#4472C4"/>

  <!-- 9. Загрузка в Госкаталог -->
  <line x1="1020" y1="215" x2="1045" y2="215" class="ar" marker-end="url(#arr312)"/>
  <rect x="1045" y="190" width="100" height="50" rx="8" class="ndb"/>
  <text x="1095" y="208" class="lbl">9. Загрузка</text>
  <text x="1095" y="222" class="lbl">в Гос-</text>
  <text x="1095" y="236" class="lbl">каталог</text>
  <text x="1095" y="258" class="tm">2 мин 40 сек · НДБ</text>
  <rect x="1050" y="194" width="9" height="7" fill="#4472C4"/>

  <!-- 10. Промежуточное событие — таймер -->
  <line x1="1145" y1="215" x2="1175" y2="215" class="ar" marker-end="url(#arr312)"/>
  <circle cx="1190" cy="215" r="14" fill="white" stroke="#ED7D31" stroke-width="2"/>
  <circle cx="1190" cy="215" r="10" fill="white" stroke="#ED7D31" stroke-width="1.5"/>
  <!-- стрелочки часов -->
  <line x1="1190" y1="215" x2="1190" y2="208" stroke="#ED7D31" stroke-width="1.3"/>
  <line x1="1190" y1="215" x2="1196" y2="218" stroke="#ED7D31" stroke-width="1.3"/>
  <text x="1190" y="245" class="lbl">Ожидание</text>
  <text x="1190" y="258" class="lbl">прогрузки</text>
  <text x="1190" y="271" class="tm">10 мин · НДЦ</text>

  <!-- 11. Перенос подтверждения -->
  <line x1="1204" y1="215" x2="1230" y2="215" class="ar" marker-end="url(#arr312)"/>
  <rect x="1230" y="190" width="100" height="50" rx="8" class="ndb"/>
  <text x="1280" y="210" class="lbl">11. Перенос</text>
  <text x="1280" y="224" class="lbl">подтверждения</text>
  <text x="1280" y="258" class="tm">55 сек · НДБ</text>

  <!-- 12. XOR -->
  <line x1="1330" y1="215" x2="1355" y2="215" class="ar" marker-end="url(#arr312)"/>
  <polygon points="1380,215 1400,195 1420,215 1400,235" class="gw"/>
  <text x="1400" y="220" class="lblb">×</text>
  <text x="1400" y="262" class="lbl">Корректно?</text>

  <!-- 14. End -->
  <line x1="1420" y1="215" x2="1438" y2="215" class="ar" marker-end="url(#arr312)"/>
  <text x="1437" y="200" class="tm">да</text>
  <circle cx="1452" cy="215" r="14" fill="white" stroke="#C00000" stroke-width="3.5"/>
  <text x="1452" y="245" class="lbl">Экспонат</text>
  <text x="1452" y="258" class="lbl">зарегистрирован</text>

  <!-- 13а. При ошибке — петля -->
  <line x1="1400" y1="235" x2="1400" y2="380" class="ardash"/>
  <text x="1408" y="320" class="tm">нет</text>
  <rect x="1230" y="370" width="170" height="40" rx="8" class="ndc"/>
  <text x="1315" y="388" class="lbl">13а. Исправление,</text>
  <text x="1315" y="402" class="lbl">повторный ввод</text>
  <text x="1315" y="425" class="tm">2–3 мин · НДЦ</text>
  <line x1="1400" y1="380" x2="1400" y2="380" class="ardash"/>
  <line x1="1400" y1="380" x2="1230" y2="380" class="ardash" marker-end="url(#arr312)"/>
  <!-- возврат к шагу 7 (заполнение карточки) — ближайший осмысленный шаг -->
  <line x1="1230" y1="390" x2="845" y2="390" class="ardash"/>
  <line x1="845" y1="390" x2="845" y2="240" class="ardash" marker-end="url(#arr312)"/>
  <text x="1040" y="382" class="tm">возврат к заполнению карточки</text>

  <!-- Сводные показатели снизу -->
  <rect x="40" y="510" width="1430" height="100" fill="#fff7e6" stroke="#888" stroke-width="1"/>
  <text x="755" y="530" class="lblb">Сводные характеристики процесса AS IS</text>
  <text x="60" y="552" class="lbl" text-anchor="start">• Среднее время цикла: 45 мин/экспонат   • Производительность факт.: 9 экспонатов/день (требуется 20)   • Время такта: 27 мин   • Стоимость 1 экспоната: 138 руб.</text>
  <text x="60" y="572" class="lbl" text-anchor="start">• Доля ДЦ ≈ 16 %   • Доля НДБ ≈ 20 %   • Доля НДЦ ≈ 64 %   • Критическое узкое место — ожидание прогрузки Госкаталога (10 мин = 22 % цикла)</text>
  <text x="60" y="592" class="lbl" text-anchor="start">• Один пул, одна дорожка; единственный шлюз XOR — проверка корректности после внесения в каталог; петля возврата к шагу 7 при ошибке.</text>

  <text x="750" y="628" class="src">Источник: составлено автором.</text>
</svg>
