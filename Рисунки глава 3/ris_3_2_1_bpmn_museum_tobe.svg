<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640">
  <defs>
    <marker id="arr321" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  <style>
    .ttl{font-family:'Times New Roman',serif;font-size:15px;font-weight:bold;text-anchor:middle}
    .lbl{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle}
    .lblb{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle;font-weight:bold}
    .tm{font-family:'Times New Roman',serif;font-size:10px;text-anchor:middle;font-style:italic;fill:#444}
    .src{font-family:'Times New Roman',serif;font-size:13px;text-anchor:middle;font-style:italic}
    .pool{fill:none;stroke:#000;stroke-width:1.5}
    .lane{fill:#fafafa;stroke:#888;stroke-width:1}
    .laneTitle{font-family:'Times New Roman',serif;font-size:12px;font-weight:bold;text-anchor:middle}
    .ar{stroke:#000;stroke-width:1.5;fill:none}
    .ardash{stroke:#000;stroke-width:1.3;fill:none;stroke-dasharray:5,4}
    .dc{fill:#d4edda;stroke:#000;stroke-width:1.3}
    .ndb{fill:#e2e3e5;stroke:#000;stroke-width:1.3}
    .ndc{fill:#f8d7da;stroke:#000;stroke-width:1.3}
    .ev{fill:white;stroke-width:2}
    .gw{fill:white;stroke:#000;stroke-width:1.5}
  </style>

  <rect width="1500" height="640" fill="white"/>
  <text x="750" y="28" class="ttl">Рис. 3.2.1. BPMN-модель «Регистрация и описание музейных экспонатов в КАМИС» (TO BE)</text>

  <!-- Pool с двумя дорожками -->
  <rect x="40" y="60" width="1430" height="370" class="pool"/>
  <rect x="40" y="60" width="30" height="370" fill="#4472C4"/>
  <text x="55" y="245" class="laneTitle" fill="white" transform="rotate(-90 55 245)">Геологический музей</text>

  <!-- Lane 1: Лаборант -->
  <rect x="70" y="60" width="1400" height="270" class="lane"/>
  <rect x="70" y="60" width="30" height="270" fill="#D9E2F3"/>
  <text x="85" y="195" class="laneTitle" transform="rotate(-90 85 195)">Лаборант</text>

  <!-- Lane 2: Заведующая (контроль) -->
  <rect x="70" y="330" width="1400" height="100" fill="#fafafa" stroke="#888"/>
  <rect x="70" y="330" width="30" height="100" fill="#D9E2F3"/>
  <text x="85" y="380" class="laneTitle" transform="rotate(-90 85 380)">Заведующая (контроль)</text>

  <!-- Легенда -->
  <rect x="1170" y="72" width="290" height="55" fill="white" stroke="#888"/>
  <text x="1315" y="88" class="lblb">Тип операции</text>
  <rect x="1180" y="95" width="14" height="10" class="dc"/><text x="1200" y="104" class="lbl" text-anchor="start">ДЦ — добавляет ценность</text>
  <rect x="1180" y="110" width="14" height="10" class="ndb"/><text x="1200" y="119" class="lbl" text-anchor="start">НДБ — необходимо для бизнеса</text>
  <rect x="1330" y="95" width="14" height="10" class="ndc"/><text x="1350" y="104" class="lbl" text-anchor="start">НДЦ — потери</text>

  <!-- 1. Start -->
  <circle cx="125" cy="195" r="14" class="ev" stroke="#548235"/>
  <text x="125" y="225" class="lbl">Экспонат подготовлен</text>
  <text x="125" y="238" class="lbl">к регистрации</text>

  <!-- 2. Фотосъемка на стационарной фотозоне -->
  <line x1="139" y1="195" x2="170" y2="195" class="ar" marker-end="url(#arr321)"/>
  <rect x="170" y="170" width="120" height="50" rx="8" class="dc"/>
  <text x="230" y="188" class="lbl">2. Фотосъёмка</text>
  <text x="230" y="202" class="lbl">на стационарной</text>
  <text x="230" y="216" class="lbl">фотозоне</text>
  <text x="230" y="240" class="tm">1 мин 10 сек · ДЦ</text>

  <!-- 3. Измерение -->
  <line x1="290" y1="195" x2="315" y2="195" class="ar" marker-end="url(#arr321)"/>
  <rect x="315" y="170" width="105" height="50" rx="8" class="dc"/>
  <text x="367" y="188" class="lbl">3. Измерение</text>
  <text x="367" y="202" class="lbl">штангенциркулем</text>
  <text x="367" y="216" class="lbl">и запись</text>
  <text x="367" y="240" class="tm">2 мин · ДЦ</text>

  <!-- 4. Маркировка -->
  <line x1="420" y1="195" x2="445" y2="195" class="ar" marker-end="url(#arr321)"/>
  <rect x="445" y="170" width="105" height="50" rx="8" class="ndb"/>
  <text x="497" y="188" class="lbl">4. Маркировка</text>
  <text x="497" y="202" class="lbl">(материалы</text>
  <text x="497" y="216" class="lbl">в органайзере)</text>
  <text x="497" y="240" class="tm">1 мин · НДБ</text>

  <!-- 5. Заполнение КАМИС по шаблону -->
  <line x1="550" y1="195" x2="575" y2="195" class="ar" marker-end="url(#arr321)"/>
  <rect x="575" y="170" width="115" height="50" rx="8" class="dc"/>
  <rect x="580" y="174" width="9" height="7" fill="#4472C4"/>
  <text x="632" y="188" class="lbl">5. Заполнение</text>
  <text x="632" y="202" class="lbl">карточки в КАМИС</text>
  <text x="632" y="216" class="lbl">по шаблону</text>
  <text x="632" y="240" class="tm">2 мин · ДЦ</text>

  <!-- 6. Прикрепление фото -->
  <line x1="690" y1="195" x2="715" y2="195" class="ar" marker-end="url(#arr321)"/>
  <rect x="715" y="170" width="105" height="50" rx="8" class="dc"/>
  <rect x="720" y="174" width="9" height="7" fill="#4472C4"/>
  <text x="767" y="188" class="lbl">6. Прикрепление</text>
  <text x="767" y="202" class="lbl">фотографии</text>
  <text x="767" y="216" class="lbl">к карточке</text>
  <text x="767" y="240" class="tm">30 сек · ДЦ</text>

  <!-- 7. Пакетная выгрузка офлайн -->
  <line x1="820" y1="195" x2="845" y2="195" class="ar" marker-end="url(#arr321)"/>
  <rect x="845" y="170" width="120" height="50" rx="8" class="ndb"/>
  <rect x="850" y="174" width="9" height="7" fill="#4472C4"/>
  <text x="905" y="186" class="lbl">7. Пакетная</text>
  <text x="905" y="200" class="lbl">выгрузка в Гос-</text>
  <text x="905" y="214" class="lbl">каталог (офлайн)</text>
  <text x="905" y="240" class="tm">1 мин 20 сек · НДБ</text>

  <!-- 8. Промежуточное событие — параллельная синхронизация (не блокирует) -->
  <circle cx="1010" cy="195" r="14" fill="white" stroke="#ED7D31" stroke-width="2"/>
  <circle cx="1010" cy="195" r="10" fill="white" stroke="#ED7D31" stroke-width="1.5"/>
  <line x1="1010" y1="195" x2="1010" y2="188" stroke="#ED7D31" stroke-width="1.3"/>
  <line x1="1010" y1="195" x2="1016" y2="198" stroke="#ED7D31" stroke-width="1.3"/>
  <line x1="965" y1="195" x2="996" y2="195" class="ardash" marker-end="url(#arr321)"/>
  <text x="1010" y="240" class="tm" fill="#0a7d2a" font-weight="bold">фоновая синхронизация · 0 мин блок.</text>

  <!-- Прямой переход к концу основного потока (не ждём 10 мин!) -->
  <line x1="1024" y1="195" x2="1130" y2="195" class="ar" marker-end="url(#arr321)"/>
  <text x="1077" y="187" class="tm" fill="#0a7d2a">параллельно</text>

  <!-- 10. End -->
  <circle cx="1144" cy="195" r="14" fill="white" stroke="#C00000" stroke-width="3.5"/>
  <text x="1144" y="225" class="lbl">Экспонат</text>
  <text x="1144" y="238" class="lbl">зарегистрирован</text>

  <!-- 9. Контроль (выборочно — 1 из 5) на дорожке заведующей -->
  <!-- ассоциация от шага 5/6 на нижнюю дорожку -->
  <line x1="767" y1="220" x2="767" y2="370" class="ardash"/>
  <text x="775" y="330" class="tm">выборочный контроль (1 из 5)</text>
  <rect x="700" y="370" width="135" height="40" rx="8" class="ndb"/>
  <text x="767" y="388" class="lbl">9. Верификация</text>
  <text x="767" y="402" class="lbl">корректности записи</text>
  <text x="767" y="423" class="tm">1 мин · НДБ</text>

  <!-- Сводные показатели -->
  <rect x="40" y="450" width="1430" height="160" fill="#e6f4e6" stroke="#888" stroke-width="1"/>
  <text x="755" y="470" class="lblb">Эффект целевого процесса (TO BE)</text>
  <text x="60" y="492" class="lbl" text-anchor="start">• Один пул, две дорожки (Лаборант — 80 % операций; Заведующая — выборочный контроль 1 из 5 + научная атрибуция).</text>
  <text x="60" y="510" class="lbl" text-anchor="start">• Среднее время цикла: 18 мин/экспонат (вместо 45 мин, −60 %); ожидание прогрузки Госкаталога переведено в фоновый режим (0 мин блокирующего ожидания вместо 10 мин).</text>
  <text x="60" y="528" class="lbl" text-anchor="start">• Производительность: 30 экспонатов/день (вместо 9, ×3,3); прогноз полной инвентаризации (2 000 ед.): ~67 рабочих дней (~3,5 мес.) вместо более 1 года.</text>
  <text x="60" y="546" class="lbl" text-anchor="start">• Применены инструменты: 5С (стационарная фотозона, органайзер на рабочем месте), стандартизация (шаблоны карточек по 3 категориям), перераспределение функций.</text>
  <text x="60" y="566" class="lbl" text-anchor="start">• Доля ДЦ ≈ 70 %, НДБ ≈ 19 %, НДЦ ≈ 11 % (вместо 64 % НДЦ в AS IS).</text>
  <text x="60" y="586" class="lbl" text-anchor="start">• Стоимость обработки 1 экспоната: 55 руб. (вместо 138 руб., −60 %).</text>

  <text x="750" y="628" class="src">Источник: составлено автором.</text>
</svg>
