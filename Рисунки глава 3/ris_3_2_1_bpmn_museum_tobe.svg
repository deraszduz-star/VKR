<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540">
  <defs>
    <marker id="ar321" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    .ttl{font-family:'Times New Roman',serif;font-size:16px;font-weight:bold;text-anchor:middle}
    .lb{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle}
    .tm{font-family:'Times New Roman',serif;font-size:10px;text-anchor:middle;font-style:italic;fill:#444}
    .src{font-family:'Times New Roman',serif;font-size:13px;text-anchor:middle;font-style:italic}
    .pool{fill:none;stroke:#000;stroke-width:1.4}
    .laneT{font-family:'Times New Roman',serif;font-size:12px;font-weight:bold;text-anchor:middle}
    .ar{stroke:#000;stroke-width:1.3;fill:none}
    .tk{fill:#FFFFFF;stroke:#000;stroke-width:1.3}
    .ev{fill:#FFFFFF}
  </style>
  <rect width="1500" height="540" fill="white"/>
  <text x="750" y="26" class="ttl">Рис. 3.2.1. BPMN-модель «Регистрация и описание музейных экспонатов в КАМИС» (TO BE)</text>

  <!-- Pool with two lanes -->
  <rect x="40" y="60" width="1430" height="320" class="pool"/>
  <rect x="40" y="60" width="28" height="320" fill="#F2F2F2" stroke="#000" stroke-width="1.4"/>
  <text x="54" y="220" class="laneT" transform="rotate(-90 54 220)">Геологический музей</text>

  <!-- Lane 1: Лаборант (top) -->
  <line x1="68" y1="60" x2="68" y2="380" stroke="#000" stroke-width="1.4"/>
  <rect x="68" y="60" width="28" height="220" fill="#FAFAFA"/>
  <text x="82" y="170" class="laneT" transform="rotate(-90 82 170)">Лаборант</text>
  <line x1="96" y1="60" x2="1470" y2="60" stroke="#000" stroke-width="1"/>
  <line x1="96" y1="280" x2="1470" y2="280" stroke="#000" stroke-width="1"/>

  <!-- Lane 2: Заведующая (bottom) -->
  <rect x="68" y="280" width="28" height="100" fill="#FAFAFA"/>
  <text x="82" y="330" class="laneT" transform="rotate(-90 82 330)">Заведующая</text>
  <line x1="96" y1="60" x2="96" y2="380" stroke="#000" stroke-width="1"/>

  <!-- ============ Lane 1 flow Y=170 ============ -->
  <!-- Start -->
  <circle cx="135" cy="170" r="14" class="ev" stroke="#000" stroke-width="1.3"/>
  <text x="135" y="207" class="lb">Экспонат</text>
  <text x="135" y="221" class="lb">подготовлен</text>

  <!-- Task: Фотосъёмка (стационарная зона) -->
  <line x1="149" y1="170" x2="180" y2="170" class="ar" marker-end="url(#ar321)"/>
  <rect x="180" y="145" width="110" height="50" rx="8" class="tk"/>
  <text x="235" y="165" class="lb">Фотосъёмка</text>
  <text x="235" y="179" class="lb">(стац. зона)</text>
  <text x="235" y="218" class="tm">1 мин 10 с</text>

  <!-- Task: Измерение -->
  <line x1="290" y1="170" x2="315" y2="170" class="ar" marker-end="url(#ar321)"/>
  <rect x="315" y="145" width="105" height="50" rx="8" class="tk"/>
  <text x="367" y="165" class="lb">Измерение</text>
  <text x="367" y="179" class="lb">параметров</text>
  <text x="367" y="218" class="tm">2 мин</text>

  <!-- Task: Маркировка (5С) -->
  <line x1="420" y1="170" x2="445" y2="170" class="ar" marker-end="url(#ar321)"/>
  <rect x="445" y="145" width="105" height="50" rx="8" class="tk"/>
  <text x="497" y="165" class="lb">Маркировка</text>
  <text x="497" y="179" class="lb">(5С-органайзер)</text>
  <text x="497" y="218" class="tm">1 мин</text>

  <!-- Task: Заполнение карточки по шаблону -->
  <line x1="550" y1="170" x2="575" y2="170" class="ar" marker-end="url(#ar321)"/>
  <rect x="575" y="145" width="115" height="50" rx="8" class="tk"/>
  <text x="632" y="165" class="lb">Заполнение</text>
  <text x="632" y="179" class="lb">карточки (шаблон)</text>
  <text x="632" y="218" class="tm">2 мин</text>

  <!-- Task: Прикрепление фото -->
  <line x1="690" y1="170" x2="715" y2="170" class="ar" marker-end="url(#ar321)"/>
  <rect x="715" y="145" width="105" height="50" rx="8" class="tk"/>
  <text x="767" y="165" class="lb">Прикрепление</text>
  <text x="767" y="179" class="lb">фотографии</text>
  <text x="767" y="218" class="tm">30 с</text>

  <!-- Task: Пакетная выгрузка (асинхронно) -->
  <line x1="820" y1="170" x2="845" y2="170" class="ar" marker-end="url(#ar321)"/>
  <rect x="845" y="145" width="115" height="50" rx="8" class="tk"/>
  <text x="902" y="165" class="lb">Пакетная выгрузка</text>
  <text x="902" y="179" class="lb">в Госкаталог</text>
  <text x="902" y="218" class="tm">1 мин 20 с</text>

  <!-- Intermediate event: фоновая синхронизация (parallel, не блокирует) -->
  <line x1="960" y1="170" x2="990" y2="170" class="ar" marker-end="url(#ar321)"/>
  <circle cx="1005" cy="170" r="14" class="ev" stroke="#000" stroke-width="1.3"/>
  <circle cx="1005" cy="170" r="10" class="ev" stroke="#000" stroke-width="1.3"/>
  <line x1="1005" y1="170" x2="1005" y2="163" stroke="#000" stroke-width="1.2"/>
  <line x1="1005" y1="170" x2="1011" y2="173" stroke="#000" stroke-width="1.2"/>
  <text x="1005" y="207" class="lb">Фоновая</text>
  <text x="1005" y="221" class="lb">синхронизация</text>
  <text x="1005" y="235" class="tm">0 мин (параллельно)</text>

  <!-- ============ Send to Заведующая for верификация ============ -->
  <line x1="1019" y1="170" x2="1135" y2="170" class="ar"/>
  <line x1="1135" y1="170" x2="1135" y2="320" class="ar" marker-end="url(#ar321)"/>
  <text x="1170" y="240" class="tm">выборочно (1 из 5)</text>

  <!-- Lane 2: Task: Верификация -->
  <rect x="1080" y="295" width="115" height="50" rx="8" class="tk"/>
  <text x="1137" y="315" class="lb">Верификация</text>
  <text x="1137" y="329" class="lb">записи</text>
  <text x="1137" y="365" class="tm">1 мин</text>

  <!-- back from верификация to end (we route via right) -->
  <line x1="1195" y1="320" x2="1290" y2="320" class="ar"/>
  <line x1="1290" y1="320" x2="1290" y2="170" class="ar" marker-end="url(#ar321)"/>

  <!-- merge: from event -->
  <line x1="1019" y1="170" x2="1290" y2="170" class="ar"/>
  <text x="1155" y="165" class="tm">остальные 4 из 5</text>

  <!-- End -->
  <circle cx="1305" cy="170" r="14" class="ev" stroke="#000" stroke-width="3"/>
  <text x="1305" y="207" class="lb">Экспонат</text>
  <text x="1305" y="221" class="lb">зарегистрирован</text>

  <!-- Caption -->
  <text x="750" y="415" class="lb">Время цикла: 18 мин на 1 экспонат · производительность 30 эксп./день · доля операций НДЦ ≈ 11 %</text>
  <text x="750" y="432" class="lb">Ключевые изменения: введение лаборанта, стационарная фотозона (5С), шаблоны карточек, асинхронная выгрузка в Госкаталог</text>

  <text x="750" y="515" class="src">Источник: составлено автором.</text>
</svg>
