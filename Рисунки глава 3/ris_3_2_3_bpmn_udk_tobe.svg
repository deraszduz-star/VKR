<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <marker id="ar325" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    .ttl{font-family:'Times New Roman',serif;font-size:16px;font-weight:bold;text-anchor:middle}
    .lb{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle}
    .tm{font-family:'Times New Roman',serif;font-size:10px;text-anchor:middle;font-style:italic;fill:#444}
    .src{font-family:'Times New Roman',serif;font-size:13px;text-anchor:middle;font-style:italic}
    .pool{fill:none;stroke:#000;stroke-width:1.4}
    .laneT{font-family:'Times New Roman',serif;font-size:12px;font-weight:bold;text-anchor:middle}
    .ar{stroke:#000;stroke-width:1.3;fill:none}
    .tk{fill:#FFFFFF;stroke:#000;stroke-width:1.3}
    .gw{fill:#FFFFFF;stroke:#000;stroke-width:1.3}
    .ev{fill:#FFFFFF}
  </style>
  <rect width="1500" height="500" fill="white"/>
  <text x="750" y="26" class="ttl">Рис. 3.2.5. BPMN-модель «Исполнение запросов граждан (оцифрованный архив)» (TO BE)</text>

  <!-- Pool -->
  <rect x="40" y="60" width="1430" height="280" class="pool"/>
  <rect x="40" y="60" width="28" height="280" fill="#F2F2F2" stroke="#000" stroke-width="1.4"/>
  <text x="54" y="200" class="laneT" transform="rotate(-90 54 200)">Отдел архивных документов</text>
  <line x1="68" y1="60" x2="68" y2="340" stroke="#000" stroke-width="1.4"/>
  <rect x="68" y="60" width="28" height="280" fill="#FAFAFA"/>
  <text x="82" y="200" class="laneT" transform="rotate(-90 82 200)">Ведущий документовед</text>
  <line x1="96" y1="60" x2="96" y2="340" stroke="#000" stroke-width="1"/>

  <!-- Y center = 200 -->
  <!-- Start -->
  <circle cx="135" cy="200" r="14" class="ev" stroke="#000" stroke-width="1.3"/>
  <text x="135" y="237" class="lb">Заявка</text>
  <text x="135" y="251" class="lb">поступила</text>

  <!-- Task: Регистрация в эл. журнале -->
  <line x1="149" y1="200" x2="180" y2="200" class="ar" marker-end="url(#ar325)"/>
  <rect x="180" y="175" width="110" height="50" rx="8" class="tk"/>
  <text x="235" y="195" class="lb">Регистрация в</text>
  <text x="235" y="209" class="lb">эл. журнале</text>
  <text x="235" y="248" class="tm">30 с</text>

  <!-- Task: Электронный поиск -->
  <line x1="290" y1="200" x2="315" y2="200" class="ar" marker-end="url(#ar325)"/>
  <rect x="315" y="175" width="115" height="50" rx="8" class="tk"/>
  <text x="372" y="195" class="lb">Электронный</text>
  <text x="372" y="209" class="lb">поиск (OCR)</text>
  <text x="372" y="248" class="tm">2 мин</text>

  <!-- XOR: Найден в эл. базе? -->
  <line x1="430" y1="200" x2="455" y2="200" class="ar" marker-end="url(#ar325)"/>
  <polygon points="480,178 502,200 480,222 458,200" class="gw"/>
  <line x1="466" y1="186" x2="494" y2="214" stroke="#000" stroke-width="1.2"/>
  <line x1="494" y1="186" x2="466" y2="214" stroke="#000" stroke-width="1.2"/>
  <text x="480" y="247" class="lb">В эл. базе?</text>

  <!-- нет — physical search (для не вошедших в пилот) -->
  <line x1="480" y1="178" x2="480" y2="120" class="ar"/>
  <line x1="480" y1="120" x2="600" y2="120" class="ar"/>
  <line x1="600" y1="120" x2="600" y2="175" class="ar" marker-end="url(#ar325)"/>
  <text x="540" y="113" class="tm">нет</text>

  <rect x="545" y="175" width="110" height="50" rx="8" class="tk"/>
  <text x="600" y="195" class="lb">Физический</text>
  <text x="600" y="209" class="lb">поиск</text>
  <text x="600" y="248" class="tm">10 мин</text>

  <!-- merge back -->
  <line x1="600" y1="225" x2="600" y2="260" class="ar"/>
  <line x1="600" y1="260" x2="700" y2="260" class="ar"/>
  <line x1="700" y1="260" x2="700" y2="200" class="ar" marker-end="url(#ar325)"/>

  <!-- да -->
  <line x1="502" y1="200" x2="685" y2="200" class="ar"/>
  <text x="525" y="195" class="tm">да</text>

  <!-- Task: Просмотр электронной копии -->
  <rect x="700" y="175" width="115" height="50" rx="8" class="tk"/>
  <text x="757" y="195" class="lb">Просмотр</text>
  <text x="757" y="209" class="lb">эл. копии</text>
  <text x="757" y="248" class="tm">2 мин</text>

  <!-- Task: Формирование справки -->
  <line x1="815" y1="200" x2="840" y2="200" class="ar" marker-end="url(#ar325)"/>
  <rect x="840" y="175" width="115" height="50" rx="8" class="tk"/>
  <text x="897" y="195" class="lb">Формирование</text>
  <text x="897" y="209" class="lb">справки</text>
  <text x="897" y="248" class="tm">2 мин</text>

  <!-- Task: Заверение -->
  <line x1="955" y1="200" x2="980" y2="200" class="ar" marker-end="url(#ar325)"/>
  <rect x="980" y="175" width="105" height="50" rx="8" class="tk"/>
  <text x="1032" y="195" class="lb">Заверение</text>
  <text x="1032" y="209" class="lb">справки</text>
  <text x="1032" y="248" class="tm">1 мин</text>

  <!-- Task: Выдача -->
  <line x1="1085" y1="200" x2="1110" y2="200" class="ar" marker-end="url(#ar325)"/>
  <rect x="1110" y="175" width="115" height="50" rx="8" class="tk"/>
  <text x="1167" y="195" class="lb">Выдача</text>
  <text x="1167" y="209" class="lb">справки</text>
  <text x="1167" y="248" class="tm">1 мин 30 с</text>

  <!-- End -->
  <line x1="1225" y1="200" x2="1255" y2="200" class="ar" marker-end="url(#ar325)"/>
  <circle cx="1270" cy="200" r="14" class="ev" stroke="#000" stroke-width="3"/>
  <text x="1270" y="237" class="lb">Запрос</text>
  <text x="1270" y="251" class="lb">исполнен</text>

  <text x="750" y="395" class="lb">Время цикла: 14 мин на 1 справку (вместо 22 мин) · электронный поиск 2 мин (вместо 15 мин физического)</text>
  <text x="750" y="412" class="lb">Уровень оцифровки целевого массива: 100 % (30 000 ед.) · точность OCR ≥ 98 % · доля операций НДЦ ≈ 15 %</text>

  <text x="750" y="475" class="src">Источник: составлено автором.</text>
</svg>
