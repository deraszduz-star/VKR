<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700">
  <defs>
    <marker id="ar323" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#000"/>
    </marker>
    <marker id="ar323m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#000" stroke-width="1"/>
    </marker>
  </defs>
  <style>
    .ttl{font-family:'Times New Roman',serif;font-size:16px;font-weight:bold;text-anchor:middle}
    .lb{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle}
    .tm{font-family:'Times New Roman',serif;font-size:10px;text-anchor:middle;font-style:italic;fill:#444}
    .src{font-family:'Times New Roman',serif;font-size:13px;text-anchor:middle;font-style:italic}
    .pool{fill:none;stroke:#000;stroke-width:1.4}
    .laneT{font-family:'Times New Roman',serif;font-size:12px;font-weight:bold;text-anchor:middle}
    .ar{stroke:#000;stroke-width:1.3;fill:none}
    .msg{stroke:#000;stroke-width:1.2;fill:none;stroke-dasharray:6,4}
    .tk{fill:#FFFFFF;stroke:#000;stroke-width:1.3}
    .gw{fill:#FFFFFF;stroke:#000;stroke-width:1.3}
    .ev{fill:#FFFFFF}
  </style>
  <rect width="1500" height="700" fill="white"/>
  <text x="750" y="26" class="ttl">Рис. 3.2.3. BPMN-модель «Формирование графика отпусков ППС через Битрикс24» (TO BE)</text>

  <!-- Pool 1: Сотрудник ППС -->
  <rect x="40" y="55" width="1430" height="120" class="pool"/>
  <rect x="40" y="55" width="28" height="120" fill="#F2F2F2" stroke="#000" stroke-width="1.4"/>
  <text x="54" y="115" class="laneT" transform="rotate(-90 54 115)">Сотрудник ППС</text>

  <!-- Pool 2: Отдел ППС / Битрикс24 -->
  <rect x="40" y="200" width="1430" height="170" class="pool"/>
  <rect x="40" y="200" width="28" height="170" fill="#F2F2F2" stroke="#000" stroke-width="1.4"/>
  <text x="54" y="285" class="laneT" transform="rotate(-90 54 285)">Отдел ППС / Битрикс24</text>
  <line x1="68" y1="200" x2="68" y2="370" stroke="#000" stroke-width="1.4"/>
  <rect x="68" y="200" width="28" height="85" fill="#FAFAFA"/>
  <text x="82" y="242" class="laneT" transform="rotate(-90 82 242)">Битрикс24</text>
  <line x1="96" y1="200" x2="1470" y2="200" stroke="#000" stroke-width="1"/>
  <line x1="96" y1="285" x2="1470" y2="285" stroke="#000" stroke-width="1"/>
  <rect x="68" y="285" width="28" height="85" fill="#FAFAFA"/>
  <text x="82" y="327" class="laneT" transform="rotate(-90 82 327)">Специалист</text>

  <!-- Pool 3: Руководитель / Проректор -->
  <rect x="40" y="395" width="1430" height="120" class="pool"/>
  <rect x="40" y="395" width="28" height="120" fill="#F2F2F2" stroke="#000" stroke-width="1.4"/>
  <text x="54" y="455" class="laneT" transform="rotate(-90 54 455)">Руководитель / Проректор</text>

  <!-- ============ FLOW ============ -->
  <!-- (B24) Start: Срок -->
  <circle cx="135" cy="240" r="14" class="ev" stroke="#000" stroke-width="1.3"/>
  <text x="135" y="275" class="lb">Срок</text>
  <text x="135" y="289" class="tm">триггер B24</text>

  <!-- B24 Task: Авто-рассылка -->
  <line x1="149" y1="240" x2="180" y2="240" class="ar" marker-end="url(#ar323)"/>
  <rect x="180" y="215" width="110" height="50" rx="8" class="tk"/>
  <text x="235" y="235" class="lb">Авто-рассылка</text>
  <text x="235" y="249" class="lb">уведомлений</text>
  <text x="235" y="280" class="tm">авто</text>

  <!-- message flow up to сотрудник -->
  <line x1="380" y1="215" x2="380" y2="135" class="msg" marker-end="url(#ar323m)"/>
  <text x="423" y="178" class="tm">уведомление</text>

  <!-- Continuation arrow from auto-рассылка to gw -->
  <line x1="290" y1="240" x2="380" y2="240" class="ar"/>
  <line x1="380" y1="240" x2="380" y2="215" class="ar"/>

  <!-- Сотрудник Pool: User Task: Выбор дат -->
  <rect x="325" y="105" width="110" height="50" rx="8" class="tk"/>
  <text x="380" y="125" class="lb">Выбор дат в</text>
  <text x="380" y="139" class="lb">личн. кабинете</text>
  <text x="380" y="170" class="tm">3 мин</text>

  <!-- message flow back down -->
  <line x1="435" y1="130" x2="465" y2="130" class="ar"/>
  <line x1="465" y1="130" x2="465" y2="240" class="msg" marker-end="url(#ar323m)"/>

  <!-- B24: XOR Конфликт? -->
  <polygon points="490,218 512,240 490,262 468,240" class="gw"/>
  <line x1="476" y1="226" x2="504" y2="254" stroke="#000" stroke-width="1.2"/>
  <line x1="504" y1="226" x2="476" y2="254" stroke="#000" stroke-width="1.2"/>
  <text x="490" y="285" class="lb">Конфликт?</text>

  <!-- да — return to user -->
  <line x1="490" y1="218" x2="490" y2="180" class="ar"/>
  <line x1="490" y1="180" x2="380" y2="180" class="ar" marker-end="url(#ar323)"/>
  <text x="435" y="174" class="tm">да: альтернатива</text>

  <!-- нет -->
  <line x1="512" y1="240" x2="540" y2="240" class="ar" marker-end="url(#ar323)"/>
  <text x="525" y="235" class="tm">нет</text>

  <!-- B24 Task: Авто-формирование списка -->
  <rect x="540" y="215" width="115" height="50" rx="8" class="tk"/>
  <text x="597" y="235" class="lb">Формирование</text>
  <text x="597" y="249" class="lb">списка</text>
  <text x="597" y="280" class="tm">авто</text>

  <!-- Send to руководитель -->
  <line x1="655" y1="240" x2="685" y2="240" class="ar"/>
  <line x1="685" y1="240" x2="685" y2="430" class="msg" marker-end="url(#ar323m)"/>

  <!-- Руководитель: Подтверждение -->
  <rect x="630" y="430" width="115" height="50" rx="8" class="tk"/>
  <text x="687" y="450" class="lb">Подтверждение</text>
  <text x="687" y="464" class="lb">руководителем</text>
  <text x="687" y="495" class="tm">5 мин</text>

  <!-- back to специалист (lane below B24) -->
  <line x1="745" y1="455" x2="800" y2="455" class="ar"/>
  <line x1="800" y1="455" x2="800" y2="325" class="msg" marker-end="url(#ar323m)"/>

  <!-- Специалист: Task: Направление на согласование -->
  <rect x="745" y="300" width="115" height="50" rx="8" class="tk"/>
  <text x="802" y="320" class="lb">Направление</text>
  <text x="802" y="334" class="lb">на согласование</text>
  <text x="802" y="365" class="tm">5 мин</text>

  <!-- send to проректор -->
  <line x1="860" y1="325" x2="900" y2="325" class="ar"/>
  <line x1="900" y1="325" x2="900" y2="430" class="msg" marker-end="url(#ar323m)"/>

  <!-- Проректор: Task: Согласование (электр. подпись) -->
  <rect x="845" y="430" width="115" height="50" rx="8" class="tk"/>
  <text x="902" y="450" class="lb">Согласование</text>
  <text x="902" y="464" class="lb">(ЭП)</text>
  <text x="902" y="495" class="tm">5 мин</text>

  <!-- back to специалист -->
  <line x1="960" y1="455" x2="1005" y2="455" class="ar"/>
  <line x1="1005" y1="455" x2="1005" y2="325" class="msg" marker-end="url(#ar323m)"/>

  <!-- Специалист: XOR Согласовано? -->
  <polygon points="1030,303 1052,325 1030,347 1008,325" class="gw"/>
  <line x1="1016" y1="311" x2="1044" y2="339" stroke="#000" stroke-width="1.2"/>
  <line x1="1044" y1="311" x2="1016" y2="339" stroke="#000" stroke-width="1.2"/>
  <text x="1030" y="370" class="lb">Согласовано?</text>

  <!-- нет -->
  <line x1="1030" y1="303" x2="1030" y2="265" class="ar"/>
  <line x1="1030" y1="265" x2="802" y2="265" class="ar"/>
  <line x1="802" y1="265" x2="802" y2="300" class="ar" marker-end="url(#ar323)"/>
  <text x="900" y="258" class="tm">нет (+10 мин)</text>

  <!-- да -->
  <line x1="1052" y1="325" x2="1080" y2="325" class="ar" marker-end="url(#ar323)"/>
  <text x="1065" y="320" class="tm">да</text>

  <!-- Task: Печать единого приказа -->
  <rect x="1080" y="300" width="115" height="50" rx="8" class="tk"/>
  <text x="1137" y="320" class="lb">Печать единого</text>
  <text x="1137" y="334" class="lb">приказа</text>
  <text x="1137" y="365" class="tm">2 мин</text>

  <!-- Move down to B24 lane: Авто-уведомление -->
  <line x1="1195" y1="325" x2="1225" y2="325" class="ar"/>
  <line x1="1225" y1="325" x2="1225" y2="240" class="ar" marker-end="url(#ar323)"/>

  <rect x="1225" y="215" width="115" height="50" rx="8" class="tk"/>
  <text x="1282" y="235" class="lb">Авто-</text>
  <text x="1282" y="249" class="lb">уведомление</text>
  <text x="1282" y="280" class="tm">авто</text>

  <!-- message flow up to сотрудник -->
  <line x1="1282" y1="215" x2="1282" y2="135" class="msg" marker-end="url(#ar323m)"/>
  <text x="1325" y="178" class="tm">уведомление</text>

  <!-- End event -->
  <line x1="1340" y1="240" x2="1370" y2="240" class="ar" marker-end="url(#ar323)"/>
  <circle cx="1385" cy="240" r="14" class="ev" stroke="#000" stroke-width="3"/>
  <text x="1385" y="275" class="lb">График</text>
  <text x="1385" y="289" class="lb">утверждён</text>

  <!-- Caption -->
  <text x="750" y="555" class="lb">Время на 1 заявление: 20 мин (вместо 135 мин); ожидание подписи: до 1 рабочего дня (вместо 7 дней)</text>
  <text x="750" y="572" class="lb">Транспортировка документов: 0 мин (полностью электронное согласование); единый приказ вместо индивидуальных</text>

  <text x="750" y="675" class="src">Источник: составлено автором.</text>
</svg>
