  <text x="320" y="560" class="lbc">Сотрудники УДК (28 чел.); СЭД «Практика»; архивохранилища</text>

  <text x="320" y="610" class="lb" text-anchor="middle">Точка зрения: руководство УДК.</text>
  <text x="320" y="626" class="lb" text-anchor="middle">Цель: выявление потерь в документообороте и архиве.</text>

  <line x1="640" y1="50" x2="640" y2="850" stroke="#999" stroke-width="1" stroke-dasharray="6,4"/>

