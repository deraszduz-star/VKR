  <text x="1190" y="477" class="bx">граждан (архив)</text>
  <text x="1252" y="491" class="num">A3</text>
  <line x1="1190" y1="135" x2="1190" y2="415" class="ar" marker-end="url(#ar317)"/>

  <line x1="1260" y1="455" x2="1300" y2="455" class="ar"/>
  <line x1="1300" y1="455" x2="1300" y2="565" class="ar"/>
  <line x1="1300" y1="565" x2="1090" y2="565" class="ar" marker-end="url(#ar317)"/>
  <text x="1305" y="500" class="lb">справка</text>
  <text x="1305" y="515" class="lb">сформирована</text>

  <!-- A4 Учёт бланков -->
  <rect x="950" y="545" width="140" height="80" class="blk"/>
  <text x="1020" y="575" class="bx">Нумерация и</text>
  <text x="1020" y="591" class="bx">учёт фирменных</text>
  <text x="1020" y="607" class="bx">бланков</text>
  <text x="1082" y="621" class="num">A4</text>
  <line x1="1020" y1="135" x2="1020" y2="545" class="ar" marker-end="url(#ar317)"/>

  <line x1="950" y1="585" x2="920" y2="585" class="ar"/>
  <line x1="920" y1="585" x2="920" y2="665" class="ar" marker-end="url(#ar317)"/>
