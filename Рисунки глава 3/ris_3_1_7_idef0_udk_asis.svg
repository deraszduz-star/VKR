  <text x="850" y="727" class="bx">обеспечение</text>
  <text x="912" y="741" class="num">A5</text>
  <line x1="850" y1="135" x2="850" y2="665" class="ar" marker-end="url(#ar317)"/>

  <!-- Outputs to right -->
  <line x1="1090" y1="345" x2="1380" y2="345" class="ar" marker-end="url(#ar317)"/>
  <text x="1388" y="340" class="lb">приказы,</text>
  <text x="1388" y="355" class="lb">распоряжения</text>

  <line x1="1260" y1="435" x2="1380" y2="435" class="ar" marker-end="url(#ar317)"/>
  <text x="1388" y="430" class="lb">архивные</text>
  <text x="1388" y="445" class="lb">справки</text>

  <line x1="920" y1="705" x2="1380" y2="705" class="ar" marker-end="url(#ar317)"/>
  <text x="1388" y="700" class="lb">протоколы,</text>
  <text x="1388" y="715" class="lb">материалы</text>

  <!-- Mechanism rail -->
  <line x1="700" y1="800" x2="1300" y2="800" class="ar"/>
  <line x1="850" y1="800" x2="850" y2="745" class="ar" marker-end="url(#ar317)"/>
  <line x1="1020" y1="800" x2="1020" y2="625" class="ar" marker-end="url(#ar317)"/>
  <line x1="1190" y1="800" x2="1190" y2="495" class="ar" marker-end="url(#ar317)"/>
  <text x="1000" y="822" class="lbc">Сотрудники УДК (28 чел.); СЭД «Практика»; архивохранилища</text>

  <text x="750" y="880" class="src">Источник: составлено автором.</text>
