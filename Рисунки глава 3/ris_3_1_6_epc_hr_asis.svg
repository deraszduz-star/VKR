<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1740" viewBox="0 0 1100 1740">
  <defs>
    <marker id="ar316" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    .ttl{font-family:'Times New Roman',serif;font-size:16px;font-weight:bold;text-anchor:middle}
    .lb{font-family:'Times New Roman',serif;font-size:12px;text-anchor:middle}
    .lbb{font-family:'Times New Roman',serif;font-size:14px;text-anchor:middle;font-weight:bold}
    .src{font-family:'Times New Roman',serif;font-size:13px;text-anchor:middle;font-style:italic}
    .ar{stroke:#000;stroke-width:1.3;fill:none}
    .evt{fill:#FCE4D6;stroke:#000;stroke-width:1.3}
    .fn{fill:#E2EFDA;stroke:#000;stroke-width:1.3}
    .gw{fill:#FFFFFF;stroke:#000;stroke-width:1.3}
    .bn{fill:#FFEDED;stroke:#C00000;stroke-width:1.2;stroke-dasharray:5,3}
    .bnT{font-family:'Times New Roman',serif;font-size:11px;text-anchor:start;fill:#8B0000}
    .bnTc{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle;fill:#8B0000;font-weight:bold}
  </style>
  <rect width="1100" height="1740" fill="white"/>
  <text x="550" y="26" class="ttl">Рис. 3.1.6. EPC-модель «Формирование графика отпусков ППС» (AS IS): проблемные зоны</text>

  <!-- E1 -->
  <polygon points="245,55 455,55 475,80 455,105 245,105 225,80" class="evt"/>
  <text x="350" y="78" class="lb">Срок формирования</text>
  <text x="350" y="92" class="lb">графика отпусков наступил</text>
  <line x1="350" y1="105" x2="350" y2="135" class="ar" marker-end="url(#ar316)"/>

  <!-- F1: Сбор заявлений -->
  <rect x="245" y="135" width="210" height="55" rx="10" class="fn"/>
  <text x="350" y="160" class="lb">Сбор заявлений</text>
  <text x="350" y="174" class="lb">от сотрудников ППС</text>
  <line x1="350" y1="190" x2="350" y2="220" class="ar" marker-end="url(#ar316)"/>
  <line x1="455" y1="162" x2="510" y2="162" class="ar"/>
  <rect x="510" y="135" width="320" height="55" class="bn"/>
  <text x="520" y="153" class="bnT">Бумажная форма; высокий риск ошибок;</text>
  <text x="520" y="168" class="bnT">отсутствие электронной валидации.</text>
  <text x="520" y="183" class="bnTc" text-anchor="start">Потери: 33 мин (переделывание)</text>

  <!-- E2: Заявление получено -->
  <polygon points="245,220 455,220 475,245 455,270 245,270 225,245" class="evt"/>
  <text x="350" y="252" class="lb">Заявление получено</text>
  <line x1="350" y1="270" x2="350" y2="300" class="ar" marker-end="url(#ar316)"/>

  <!-- F2: Проверка корректности -->
  <rect x="245" y="300" width="210" height="55" rx="10" class="fn"/>
  <text x="350" y="325" class="lb">Проверка корректности</text>
  <text x="350" y="339" class="lb">заявления</text>
  <line x1="350" y1="355" x2="350" y2="395" class="ar"/>

  <!-- XOR after function — ветвление -->
  <circle cx="350" cy="420" r="22" class="gw"/>
  <text x="350" y="428" class="lbb">×</text>
  <text x="395" y="425" class="lb" text-anchor="start">XOR</text>

  <line x1="350" y1="442" x2="350" y2="455" class="ar"/>
  <line x1="180" y1="455" x2="520" y2="455" class="ar"/>
  <line x1="180" y1="455" x2="180" y2="485" class="ar" marker-end="url(#ar316)"/>
  <line x1="520" y1="455" x2="520" y2="485" class="ar" marker-end="url(#ar316)"/>
  <text x="240" y="450" class="lb">ошибка</text>
  <text x="585" y="450" class="lb">корректно</text>

  <!-- Left branch: E "Заявление возвращено" + F "Доработка" -->
  <polygon points="95,485 265,485 285,510 265,535 95,535 75,510" class="evt"/>
  <text x="180" y="517" class="lb">Заявление возвращено</text>
  <line x1="180" y1="535" x2="180" y2="565" class="ar" marker-end="url(#ar316)"/>
  <rect x="80" y="565" width="200" height="55" rx="10" class="fn"/>
  <text x="180" y="590" class="lb">Доработка заявления</text>
  <text x="180" y="604" class="lb">сотрудником</text>
  <line x1="180" y1="620" x2="180" y2="650" class="ar" marker-end="url(#ar316)"/>
  <polygon points="95,650 265,650 285,675 265,700 95,700 75,675" class="evt"/>
  <text x="180" y="682" class="lb">Заявление доработано</text>
  <line x1="180" y1="700" x2="180" y2="730" class="ar"/>
  <line x1="180" y1="730" x2="40" y2="730" class="ar"/>
  <line x1="40" y1="730" x2="40" y2="245" class="ar"/>
  <line x1="40" y1="245" x2="225" y2="245" class="ar" marker-end="url(#ar316)"/>
  <text x="50" y="745" class="lb" text-anchor="start">возврат к «Заявление получено» (+1–2 дня)</text>

  <!-- Right branch -->
  <polygon points="435,485 605,485 625,510 605,535 435,535 415,510" class="evt"/>
  <text x="520" y="517" class="lb">Заявление принято</text>
  <line x1="520" y1="535" x2="520" y2="565" class="ar" marker-end="url(#ar316)"/>

  <!-- F3: Формирование списка -->
  <rect x="415" y="565" width="210" height="55" rx="10" class="fn"/>
  <text x="520" y="590" class="lb">Формирование списка</text>
  <text x="520" y="604" class="lb">отпусков по департаменту</text>
  <line x1="520" y1="620" x2="520" y2="650" class="ar" marker-end="url(#ar316)"/>
  <line x1="625" y1="592" x2="680" y2="592" class="ar"/>
  <rect x="680" y="565" width="320" height="55" class="bn"/>
  <text x="690" y="583" class="bnT">Ручное формирование списков;</text>
  <text x="690" y="598" class="bnT">17 мин/департамент.</text>
  <text x="690" y="613" class="bnTc" text-anchor="start">Потери: лишняя обработка</text>

  <!-- E5 -->
  <polygon points="435,650 605,650 625,675 605,700 435,700 415,675" class="evt"/>
  <text x="520" y="682" class="lb">Список сформирован</text>
  <line x1="520" y1="700" x2="520" y2="730" class="ar" marker-end="url(#ar316)"/>

  <!-- F4: Печать индивидуальных приказов -->
  <rect x="415" y="730" width="210" height="55" rx="10" class="fn"/>
  <text x="520" y="755" class="lb">Печать индивидуальных</text>
  <text x="520" y="769" class="lb">приказов</text>
  <line x1="520" y1="785" x2="520" y2="815" class="ar" marker-end="url(#ar316)"/>
  <line x1="625" y1="757" x2="680" y2="757" class="ar"/>
  <rect x="680" y="730" width="320" height="55" class="bn"/>
  <text x="690" y="748" class="bnT">Отдельный приказ на каждого сотрудника</text>
  <text x="690" y="763" class="bnT">вместо единого списка.</text>
  <text x="690" y="778" class="bnTc" text-anchor="start">Потери: 38 мин/цикл</text>

  <!-- E6 -->
  <polygon points="435,815 605,815 625,840 605,865 435,865 415,840" class="evt"/>
  <text x="520" y="847" class="lb">Приказы распечатаны</text>
  <line x1="520" y1="865" x2="520" y2="895" class="ar" marker-end="url(#ar316)"/>

  <!-- F5: Транспортировка -->
  <rect x="415" y="895" width="210" height="55" rx="10" class="fn"/>
  <text x="520" y="920" class="lb">Доставка документов</text>
  <text x="520" y="934" class="lb">в главное здание</text>
  <line x1="520" y1="950" x2="520" y2="980" class="ar" marker-end="url(#ar316)"/>
  <line x1="625" y1="922" x2="680" y2="922" class="ar"/>
  <rect x="680" y="890" width="320" height="65" fill="#FFD6D6" stroke="#C00000" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="840" y="908" class="bnTc">КРИТИЧЕСКОЕ УЗКОЕ МЕСТО</text>
  <text x="690" y="925" class="bnT">2 раза/день × 40 мин = 80 мин/день;</text>
  <text x="690" y="940" class="bnT">отделы в разных зданиях.</text>
  <text x="690" y="953" class="bnTc" text-anchor="start">Потери: 40 ч/мес</text>

  <!-- E7 -->
  <polygon points="435,980 605,980 625,1005 605,1030 435,1030 415,1005" class="evt"/>
  <text x="520" y="1012" class="lb">Документы доставлены</text>
  <line x1="520" y1="1030" x2="520" y2="1060" class="ar" marker-end="url(#ar316)"/>

  <!-- F6: Ожидание подписи проректора -->
  <rect x="415" y="1060" width="210" height="55" rx="10" class="fn"/>
  <text x="520" y="1085" class="lb">Ожидание подписи</text>
  <text x="520" y="1099" class="lb">проректора</text>
  <line x1="520" y1="1115" x2="520" y2="1145" class="ar" marker-end="url(#ar316)"/>
  <line x1="625" y1="1087" x2="680" y2="1087" class="ar"/>
  <rect x="680" y="1055" width="320" height="65" fill="#FFD6D6" stroke="#C00000" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="840" y="1073" class="bnTc">КРИТИЧЕСКОЕ УЗКОЕ МЕСТО</text>
  <text x="690" y="1090" class="bnT">Нет уведомлений об отсутствии</text>
  <text x="690" y="1105" class="bnT">проректора; повторные походы.</text>
  <text x="690" y="1118" class="bnTc" text-anchor="start">Потери: от 4 ч до 7 дней</text>

  <!-- E8 -->
  <polygon points="435,1145 605,1145 625,1170 605,1195 435,1195 415,1170" class="evt"/>
  <text x="520" y="1177" class="lb">Подпись получена</text>
  <line x1="520" y1="1195" x2="520" y2="1225" class="ar" marker-end="url(#ar316)"/>

  <!-- F7: Уведомление сотрудника -->
  <rect x="415" y="1225" width="210" height="55" rx="10" class="fn"/>
  <text x="520" y="1250" class="lb">Уведомление сотрудника</text>
  <text x="520" y="1264" class="lb">ППС о готовности</text>
  <line x1="520" y1="1280" x2="520" y2="1310" class="ar" marker-end="url(#ar316)"/>
  <line x1="625" y1="1252" x2="680" y2="1252" class="ar"/>
  <rect x="680" y="1225" width="320" height="55" class="bn"/>
  <text x="690" y="1243" class="bnT">Нет системы уведомлений — сотрудник</text>
  <text x="690" y="1258" class="bnT">узнает о готовности при личном визите.</text>
  <text x="690" y="1273" class="bnTc" text-anchor="start">Потери: ожидание</text>

  <!-- Final E -->
  <polygon points="435,1310 605,1310 625,1335 605,1360 435,1360 415,1335" class="evt" stroke-width="2"/>
  <text x="520" y="1337" class="lb" font-weight="bold">График отпусков</text>
  <text x="520" y="1352" class="lb">утверждён</text>

  <!-- Legend -->
  <rect x="80" y="1430" width="940" height="100" fill="none" stroke="#888" stroke-width="0.8"/>
  <text x="100" y="1450" class="lb" text-anchor="start" font-weight="bold">Легенда:</text>
  <polygon points="180,1462 240,1462 250,1475 240,1488 180,1488 170,1475" class="evt"/>
  <text x="270" y="1480" class="lb" text-anchor="start">— событие</text>
  <rect x="370" y="1462" width="60" height="26" rx="6" class="fn"/>
  <text x="450" y="1480" class="lb" text-anchor="start">— функция</text>
  <circle cx="565" cy="1475" r="13" class="gw"/>
  <text x="565" y="1480" class="lbb">×</text>
  <text x="590" y="1480" class="lb" text-anchor="start">— XOR (исключающее ИЛИ)</text>
  <rect x="780" y="1462" width="60" height="26" class="bn"/>
  <text x="855" y="1480" class="lb" text-anchor="start">— узкое место (потери)</text>
  <text x="100" y="1512" class="lb" text-anchor="start">Правило EPC: чередование «событие → функция → событие». XOR-ветвление допустимо после функции.</text>

  <text x="550" y="1700" class="src">Источник: составлено автором.</text>
</svg>
