<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <defs>
    <marker id="arr316" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  <style>
    .ttl{font-family:'Times New Roman',serif;font-size:15px;font-weight:bold;text-anchor:middle}
    .lbl{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle}
    .lblb{font-family:'Times New Roman',serif;font-size:12px;text-anchor:middle;font-weight:bold}
    .src{font-family:'Times New Roman',serif;font-size:13px;text-anchor:middle;font-style:italic}
    .ar{stroke:#000;stroke-width:1.5;fill:none}
    .evt{fill:#FCE4D6;stroke:#000;stroke-width:1.3}
    .fn{fill:#E2EFDA;stroke:#000;stroke-width:1.3}
    .bot{fill:#FFEDED;stroke:#C00000;stroke-width:1.3;stroke-dasharray:5,3}
    .botCrit{fill:#FFD6D6;stroke:#C00000;stroke-width:2}
    .botT{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle;fill:#8B0000}
  </style>

  <rect width="1400" height="780" fill="white"/>
  <text x="700" y="28" class="ttl">Рис. 3.1.6. EPC-модель «Формирование графика отпусков ППС» (AS IS): проблемные зоны</text>

  <text x="200" y="62" class="lblb">События (E)</text>
  <text x="600" y="62" class="lblb">Функции (F)</text>
  <text x="1100" y="62" class="lblb">Узкие места и потери</text>

  <!-- ROW 1 -->
  <polygon points="100,90 280,90 300,115 280,140 100,140 80,115" class="evt"/>
  <text x="190" y="110" class="lbl">Заявление получено</text>
  <text x="190" y="124" class="lbl">от сотрудника</text>

  <line x1="300" y1="115" x2="430" y2="115" class="ar" marker-end="url(#arr316)"/>

  <rect x="430" y="90" width="220" height="50" rx="10" class="fn"/>
  <text x="540" y="110" class="lbl">F1. Проверка</text>
  <text x="540" y="124" class="lbl">корректности заявления</text>

  <line x1="650" y1="115" x2="780" y2="115" class="ar" marker-end="url(#arr316)"/>

  <rect x="780" y="80" width="380" height="70" class="bot"/>
  <text x="970" y="100" class="botT" font-weight="bold">⚠ Бумажная форма — высокая вероятность</text>
  <text x="970" y="115" class="botT">ошибок; отсутствие электронной валидации</text>
  <text x="970" y="138" class="botT" font-weight="bold">Потери: 33 мин (переделывание)</text>

  <line x1="540" y1="140" x2="540" y2="170" class="ar" marker-end="url(#arr316)"/>

  <!-- ROW 2 -->
  <polygon points="100,180 280,180 300,205 280,230 100,230 80,205" class="evt"/>
  <text x="190" y="200" class="lbl">Список</text>
  <text x="190" y="214" class="lbl">сформирован</text>

  <line x1="300" y1="205" x2="430" y2="205" class="ar" marker-end="url(#arr316)"/>

  <rect x="430" y="180" width="220" height="50" rx="10" class="fn"/>
  <text x="540" y="200" class="lbl">F2. Печать</text>
  <text x="540" y="214" class="lbl">индивидуальных приказов</text>

  <line x1="650" y1="205" x2="780" y2="205" class="ar" marker-end="url(#arr316)"/>

  <rect x="780" y="170" width="380" height="70" class="bot"/>
  <text x="970" y="190" class="botT" font-weight="bold">⚠ Каждому сотруднику — отдельный приказ</text>
  <text x="970" y="205" class="botT">(вместо единого списка)</text>
  <text x="970" y="228" class="botT" font-weight="bold">Потери: лишняя обработка (38 мин/цикл)</text>

  <line x1="540" y1="230" x2="540" y2="260" class="ar" marker-end="url(#arr316)"/>

  <!-- ROW 3 — КРИТИЧЕСКОЕ -->
  <polygon points="100,270 280,270 300,295 280,320 100,320 80,295" class="evt"/>
  <text x="190" y="290" class="lbl">Приказы</text>
  <text x="190" y="304" class="lbl">распечатаны</text>

  <line x1="300" y1="295" x2="430" y2="295" class="ar" marker-end="url(#arr316)"/>

  <rect x="430" y="270" width="220" height="50" rx="10" class="fn"/>
  <text x="540" y="290" class="lbl">F3. Транспортировка</text>
  <text x="540" y="304" class="lbl">документов к проректору</text>

  <line x1="650" y1="295" x2="780" y2="295" class="ar" marker-end="url(#arr316)"/>

  <rect x="780" y="255" width="380" height="85" class="botCrit"/>
  <text x="970" y="275" class="botT" font-weight="bold">⚠⚠ КРИТИЧЕСКОЕ: 2 раза/день × 40 мин =</text>
  <text x="970" y="292" class="botT">80 мин/день; отделы в разных зданиях</text>
  <text x="970" y="312" class="botT" font-weight="bold">Потери: 80 мин/день (40 ч/мес)</text>

  <line x1="540" y1="320" x2="540" y2="350" class="ar" marker-end="url(#arr316)"/>

  <!-- ROW 4 — КРИТИЧЕСКОЕ -->
  <polygon points="100,360 280,360 300,385 280,410 100,410 80,385" class="evt"/>
  <text x="190" y="380" class="lbl">Документы</text>
  <text x="190" y="394" class="lbl">доставлены</text>

  <line x1="300" y1="385" x2="430" y2="385" class="ar" marker-end="url(#arr316)"/>

  <rect x="430" y="360" width="220" height="50" rx="10" class="fn"/>
  <text x="540" y="380" class="lbl">F4. Ожидание подписи</text>
  <text x="540" y="394" class="lbl">проректора</text>

  <line x1="650" y1="385" x2="780" y2="385" class="ar" marker-end="url(#arr316)"/>

  <rect x="780" y="345" width="380" height="85" class="botCrit"/>
  <text x="970" y="365" class="botT" font-weight="bold">⚠⚠ КРИТИЧЕСКОЕ: нет уведомления об</text>
  <text x="970" y="382" class="botT">отсутствии проректора; сотрудник может</text>
  <text x="970" y="397" class="botT">несколько дней ходить безрезультатно</text>
  <text x="970" y="420" class="botT" font-weight="bold">Потери: от 4 ч 26 мин до 7 дней</text>

  <line x1="540" y1="410" x2="540" y2="440" class="ar" marker-end="url(#arr316)"/>

  <!-- ROW 5 -->
  <polygon points="100,450 280,450 300,475 280,500 100,500 80,475" class="evt"/>
  <text x="190" y="470" class="lbl">Подпись</text>
  <text x="190" y="484" class="lbl">получена</text>

  <line x1="300" y1="475" x2="430" y2="475" class="ar" marker-end="url(#arr316)"/>

  <rect x="430" y="450" width="220" height="50" rx="10" class="fn"/>
  <text x="540" y="470" class="lbl">F5. Уведомление</text>
  <text x="540" y="484" class="lbl">сотрудника ППС</text>

  <line x1="650" y1="475" x2="780" y2="475" class="ar" marker-end="url(#arr316)"/>

  <rect x="780" y="440" width="380" height="70" class="bot"/>
  <text x="970" y="460" class="botT" font-weight="bold">⚠ Нет системы уведомлений — сотрудник</text>
  <text x="970" y="475" class="botT">узнаёт о готовности только при личном визите</text>
  <text x="970" y="498" class="botT" font-weight="bold">Потери: ожидание (+1 день)</text>

  <line x1="540" y1="500" x2="540" y2="540" class="ar" marker-end="url(#arr316)"/>

  <!-- Конечное событие -->
  <polygon points="430,540 650,540 670,565 650,590 430,590 410,565" fill="#FCE4D6" stroke="#C00000" stroke-width="2"/>
  <text x="540" y="560" class="lbl" font-weight="bold">График отпусков утверждён,</text>
  <text x="540" y="574" class="lbl">сотрудники уведомлены</text>

  <!-- Легенда -->
  <rect x="80" y="630" width="1080" height="100" fill="#fff7e6" stroke="#888"/>
  <text x="620" y="650" class="lblb">Логика и связи в EPC-модели</text>
  <text x="100" y="672" class="lbl" text-anchor="start">• Чередование «событие → функция → событие» соблюдается на всём потоке.</text>
  <text x="100" y="690" class="lbl" text-anchor="start">• На участке F1 (проверка) присутствует логический оператор XOR (не показан явно — для компактности): при некорректном заявлении выполняется возврат к событию «Заявление получено».</text>
  <text x="100" y="708" class="lbl" text-anchor="start">• Из 5 функций три (F2, F3, F4) являются носителями потерь категории НДЦ (бумажная обработка, транспортировка, ожидание).</text>

  <text x="700" y="755" class="src">Источник: составлено автором.</text>
</svg>
