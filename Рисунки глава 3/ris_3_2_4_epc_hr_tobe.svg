<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1480" viewBox="0 0 1100 1480">
  <defs>
    <marker id="ar324" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    .ttl{font-family:'Times New Roman',serif;font-size:16px;font-weight:bold;text-anchor:middle}
    .lb{font-family:'Times New Roman',serif;font-size:12px;text-anchor:middle}
    .lbb{font-family:'Times New Roman',serif;font-size:14px;text-anchor:middle;font-weight:bold}
    .src{font-family:'Times New Roman',serif;font-size:13px;text-anchor:middle;font-style:italic}
    .ar{stroke:#000;stroke-width:1.3;fill:none}
    .evt{fill:#FCE4D6;stroke:#000;stroke-width:1.3}
    .fn{fill:#E2EFDA;stroke:#000;stroke-width:1.3}
    .gw{fill:#FFFFFF;stroke:#000;stroke-width:1.3}
    .sl{fill:#E8F4FD;stroke:#1F77B4;stroke-width:1.2;stroke-dasharray:4,3}
    .slT{font-family:'Times New Roman',serif;font-size:11px;text-anchor:start;fill:#0B4B7F}
    .slTc{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle;fill:#0B4B7F;font-weight:bold}
  </style>
  <rect width="1100" height="1480" fill="white"/>
  <text x="550" y="26" class="ttl">Рис. 3.2.4. EPC-модель «Формирование графика отпусков ППС» (TO BE): устранённые узкие места</text>

  <!-- E1 -->
  <polygon points="245,55 455,55 475,80 455,105 245,105 225,80" class="evt"/>
  <text x="350" y="78" class="lb">Срок формирования</text>
  <text x="350" y="92" class="lb">графика наступил</text>
  <line x1="350" y1="105" x2="350" y2="135" class="ar" marker-end="url(#ar324)"/>

  <!-- F1 -->
  <rect x="245" y="135" width="210" height="55" rx="10" class="fn"/>
  <text x="350" y="160" class="lb">Авто-рассылка уведомлений</text>
  <text x="350" y="174" class="lb">сотрудникам ППС (Битрикс24)</text>
  <line x1="350" y1="190" x2="350" y2="220" class="ar" marker-end="url(#ar324)"/>
  <line x1="455" y1="162" x2="510" y2="162" class="ar"/>
  <rect x="510" y="135" width="320" height="55" class="sl"/>
  <text x="520" y="153" class="slT">Автоматические уведомления —</text>
  <text x="520" y="168" class="slT">мгновенное информирование сотрудников.</text>
  <text x="520" y="183" class="slTc" text-anchor="start">Эффект: −80 мин/день курьерских функций</text>

  <!-- E2 -->
  <polygon points="245,220 455,220 475,245 455,270 245,270 225,245" class="evt"/>
  <text x="350" y="252" class="lb">Уведомление получено</text>
  <line x1="350" y1="270" x2="350" y2="300" class="ar" marker-end="url(#ar324)"/>

  <!-- F2: Выбор дат в личном кабинете -->
  <rect x="245" y="300" width="210" height="55" rx="10" class="fn"/>
  <text x="350" y="325" class="lb">Выбор дат отпуска</text>
  <text x="350" y="339" class="lb">в личном кабинете</text>
  <line x1="350" y1="355" x2="350" y2="395" class="ar"/>

  <!-- XOR проверка конфликтов -->
  <circle cx="350" cy="420" r="22" class="gw"/>
  <text x="350" y="428" class="lbb">×</text>
  <text x="395" y="425" class="lb" text-anchor="start">XOR</text>

  <line x1="350" y1="442" x2="350" y2="455" class="ar"/>
  <line x1="180" y1="455" x2="520" y2="455" class="ar"/>
  <line x1="180" y1="455" x2="180" y2="485" class="ar" marker-end="url(#ar324)"/>
  <line x1="520" y1="455" x2="520" y2="485" class="ar" marker-end="url(#ar324)"/>
  <text x="240" y="450" class="lb">конфликт</text>
  <text x="585" y="450" class="lb">нет конфликта</text>

  <!-- Left branch: альтернативы -->
  <polygon points="95,485 265,485 285,510 265,535 95,535 75,510" class="evt"/>
  <text x="180" y="517" class="lb">Конфликт обнаружен</text>
  <line x1="180" y1="535" x2="180" y2="565" class="ar" marker-end="url(#ar324)"/>
  <rect x="80" y="565" width="200" height="55" rx="10" class="fn"/>
  <text x="180" y="590" class="lb">Предложение</text>
  <text x="180" y="604" class="lb">альтернативных дат</text>
  <line x1="180" y1="620" x2="180" y2="650" class="ar"/>
  <line x1="180" y1="650" x2="40" y2="650" class="ar"/>
  <line x1="40" y1="650" x2="40" y2="245" class="ar"/>
  <line x1="40" y1="245" x2="225" y2="245" class="ar" marker-end="url(#ar324)"/>
  <text x="50" y="665" class="lb" text-anchor="start">+1 мин</text>

  <!-- Right branch -->
  <polygon points="435,485 605,485 625,510 605,535 435,535 415,510" class="evt"/>
  <text x="520" y="517" class="lb">Даты согласованы системой</text>
  <line x1="520" y1="535" x2="520" y2="565" class="ar" marker-end="url(#ar324)"/>

  <!-- F3: Авто-формирование списка -->
  <rect x="415" y="565" width="210" height="55" rx="10" class="fn"/>
  <text x="520" y="590" class="lb">Авто-формирование</text>
  <text x="520" y="604" class="lb">консолидированного списка</text>
  <line x1="520" y1="620" x2="520" y2="650" class="ar" marker-end="url(#ar324)"/>
  <line x1="625" y1="592" x2="680" y2="592" class="ar"/>
  <rect x="680" y="565" width="320" height="55" class="sl"/>
  <text x="690" y="583" class="slT">Единый приказ на подразделение</text>
  <text x="690" y="598" class="slT">вместо индивидуальных приказов.</text>
  <text x="690" y="613" class="slTc" text-anchor="start">Эффект: −38 мин лишней обработки</text>

  <!-- E -->
  <polygon points="435,650 605,650 625,675 605,700 435,700 415,675" class="evt"/>
  <text x="520" y="682" class="lb">Список сформирован</text>
  <line x1="520" y1="700" x2="520" y2="730" class="ar" marker-end="url(#ar324)"/>

  <!-- F4: Подтверждение руководителем -->
  <rect x="415" y="730" width="210" height="55" rx="10" class="fn"/>
  <text x="520" y="755" class="lb">Подтверждение списка</text>
  <text x="520" y="769" class="lb">руководителем</text>
  <line x1="520" y1="785" x2="520" y2="815" class="ar" marker-end="url(#ar324)"/>

  <!-- E -->
  <polygon points="435,815 605,815 625,840 605,865 435,865 415,840" class="evt"/>
  <text x="520" y="847" class="lb">Список подтверждён</text>
  <line x1="520" y1="865" x2="520" y2="895" class="ar" marker-end="url(#ar324)"/>

  <!-- F5: Согласование проректором (ЭП) -->
  <rect x="415" y="895" width="210" height="55" rx="10" class="fn"/>
  <text x="520" y="920" class="lb">Согласование проректором</text>
  <text x="520" y="934" class="lb">(электронная подпись)</text>
  <line x1="520" y1="950" x2="520" y2="980" class="ar" marker-end="url(#ar324)"/>
  <line x1="625" y1="922" x2="680" y2="922" class="ar"/>
  <rect x="680" y="890" width="320" height="65" fill="#D6F0FF" stroke="#1F77B4" stroke-width="1.6" stroke-dasharray="4,3"/>
  <text x="840" y="908" class="slTc">УСТРАНЕНО КРИТИЧЕСКОЕ УЗКОЕ МЕСТО</text>
  <text x="690" y="925" class="slT">Электронная подпись + уведомления</text>
  <text x="690" y="940" class="slT">о задачах в Битрикс24.</text>
  <text x="690" y="953" class="slTc" text-anchor="start">Эффект: с 7 дней до 1 дня</text>

  <!-- E -->
  <polygon points="435,980 605,980 625,1005 605,1030 435,1030 415,1005" class="evt"/>
  <text x="520" y="1012" class="lb">Приказ согласован электронно</text>
  <line x1="520" y1="1030" x2="520" y2="1060" class="ar" marker-end="url(#ar324)"/>

  <!-- F6: Печать единого приказа -->
  <rect x="415" y="1060" width="210" height="55" rx="10" class="fn"/>
  <text x="520" y="1085" class="lb">Печать единого приказа</text>
  <text x="520" y="1099" class="lb">для архива</text>
  <line x1="520" y1="1115" x2="520" y2="1145" class="ar" marker-end="url(#ar324)"/>

  <!-- E -->
  <polygon points="435,1145 605,1145 625,1170 605,1195 435,1195 415,1170" class="evt"/>
  <text x="520" y="1177" class="lb">Приказ напечатан</text>
  <line x1="520" y1="1195" x2="520" y2="1225" class="ar" marker-end="url(#ar324)"/>

  <!-- F7: Авто-уведомление сотрудникам -->
  <rect x="415" y="1225" width="210" height="55" rx="10" class="fn"/>
  <text x="520" y="1250" class="lb">Авто-уведомление</text>
  <text x="520" y="1264" class="lb">сотрудников ППС</text>
  <line x1="520" y1="1280" x2="520" y2="1310" class="ar" marker-end="url(#ar324)"/>
  <line x1="625" y1="1252" x2="680" y2="1252" class="ar"/>
  <rect x="680" y="1225" width="320" height="55" class="sl"/>
  <text x="690" y="1243" class="slT">Битрикс24 информирует автоматически</text>
  <text x="690" y="1258" class="slT">о готовности графика отпусков.</text>
  <text x="690" y="1273" class="slTc" text-anchor="start">Эффект: −33 мин переделывания</text>

  <!-- Final E -->
  <polygon points="435,1310 605,1310 625,1335 605,1360 435,1360 415,1335" class="evt" stroke-width="2"/>
  <text x="520" y="1337" class="lb" font-weight="bold">График отпусков утверждён,</text>
  <text x="520" y="1352" class="lb">сотрудники уведомлены</text>

  <text x="550" y="1450" class="src">Источник: составлено автором.</text>
</svg>
