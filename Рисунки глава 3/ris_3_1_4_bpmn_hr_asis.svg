<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600">
  <defs>
    <marker id="ar315" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#000"/>
    </marker>
    <marker id="ar315m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#000" stroke-width="1"/>
    </marker>
  </defs>
  <style>
    .ttl{font-family:'Times New Roman',serif;font-size:16px;font-weight:bold;text-anchor:middle}
    .lb{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle}
    .tm{font-family:'Times New Roman',serif;font-size:10px;text-anchor:middle;font-style:italic;fill:#444}
    .src{font-family:'Times New Roman',serif;font-size:13px;text-anchor:middle;font-style:italic}
    .pool{fill:none;stroke:#000;stroke-width:1.4}
    .laneT{font-family:'Times New Roman',serif;font-size:12px;font-weight:bold;text-anchor:middle}
    .ar{stroke:#000;stroke-width:1.3;fill:none}
    .msg{stroke:#000;stroke-width:1.2;fill:none;stroke-dasharray:6,4}
    .tk{fill:#FFFFFF;stroke:#000;stroke-width:1.3}
    .gw{fill:#FFFFFF;stroke:#000;stroke-width:1.3}
    .ev{fill:#FFFFFF}
  </style>
  <rect width="1500" height="600" fill="white"/>
  <text x="750" y="26" class="ttl">Рис. 3.1.5. BPMN-модель «Формирование графика отпусков ППС» (AS IS)</text>

  <!-- ===== Pool 1: Отдел ППС ===== -->
  <rect x="40" y="55" width="1430" height="220" class="pool"/>
  <rect x="40" y="55" width="28" height="220" fill="#F2F2F2" stroke="#000" stroke-width="1.4"/>
  <text x="54" y="165" class="laneT" transform="rotate(-90 54 165)">Отдел ППС</text>
  <line x1="68" y1="55" x2="68" y2="275" stroke="#000" stroke-width="1.4"/>
  <rect x="68" y="55" width="28" height="220" fill="#FAFAFA"/>
  <text x="82" y="165" class="laneT" transform="rotate(-90 82 165)">Специалист отдела</text>
  <line x1="96" y1="55" x2="96" y2="275" stroke="#000" stroke-width="1"/>

  <!-- ===== Pool 2: Проректор ===== -->
  <rect x="40" y="310" width="1430" height="120" class="pool"/>
  <rect x="40" y="310" width="28" height="120" fill="#F2F2F2" stroke="#000" stroke-width="1.4"/>
  <text x="54" y="370" class="laneT" transform="rotate(-90 54 370)">Проректор</text>

  <!-- ===== Pool 1 flow ===== Y=165 -->
  <!-- Start -->
  <circle cx="135" cy="165" r="14" class="ev" stroke="#000" stroke-width="1.3"/>
  <text x="135" y="200" class="lb">Срок</text>
  <text x="135" y="214" class="lb">формирования</text>

  <!-- Task: Сбор заявлений -->
  <line x1="149" y1="165" x2="180" y2="165" class="ar" marker-end="url(#ar315)"/>
  <rect x="180" y="140" width="105" height="50" rx="8" class="tk"/>
  <text x="232" y="160" class="lb">Сбор</text>
  <text x="232" y="174" class="lb">заявлений</text>
  <text x="232" y="213" class="tm">5 мин/заявл.</text>

  <!-- Task: Проверка -->
  <line x1="285" y1="165" x2="310" y2="165" class="ar" marker-end="url(#ar315)"/>
  <rect x="310" y="140" width="105" height="50" rx="8" class="tk"/>
  <text x="362" y="160" class="lb">Проверка</text>
  <text x="362" y="174" class="lb">заявления</text>
  <text x="362" y="213" class="tm">3 мин/заявл.</text>

  <!-- XOR Корректно? -->
  <line x1="415" y1="165" x2="440" y2="165" class="ar" marker-end="url(#ar315)"/>
  <polygon points="465,143 487,165 465,187 443,165" class="gw"/>
  <line x1="451" y1="151" x2="479" y2="179" stroke="#000" stroke-width="1.2"/>
  <line x1="479" y1="151" x2="451" y2="179" stroke="#000" stroke-width="1.2"/>
  <text x="465" y="210" class="lb">Корректно?</text>

  <!-- ветвь нет -->
  <line x1="465" y1="143" x2="465" y2="105" class="ar"/>
  <line x1="465" y1="105" x2="232" y2="105" class="ar" marker-end="url(#ar315)"/>
  <text x="350" y="98" class="tm">нет (+1–2 дня)</text>

  <!-- да -->
  <line x1="487" y1="165" x2="515" y2="165" class="ar" marker-end="url(#ar315)"/>
  <text x="500" y="160" class="tm">да</text>

  <!-- Task: Формирование списка -->
  <rect x="515" y="140" width="105" height="50" rx="8" class="tk"/>
  <text x="567" y="160" class="lb">Формирование</text>
  <text x="567" y="174" class="lb">списка</text>
  <text x="567" y="213" class="tm">17 мин</text>

  <!-- Task: Печать приказов -->
  <line x1="620" y1="165" x2="645" y2="165" class="ar" marker-end="url(#ar315)"/>
  <rect x="645" y="140" width="105" height="50" rx="8" class="tk"/>
  <text x="697" y="160" class="lb">Печать</text>
  <text x="697" y="174" class="lb">приказов</text>
  <text x="697" y="213" class="tm">5 мин</text>

  <!-- Task: Транспортировка -->
  <line x1="750" y1="165" x2="775" y2="165" class="ar" marker-end="url(#ar315)"/>
  <rect x="775" y="140" width="105" height="50" rx="8" class="tk"/>
  <text x="827" y="160" class="lb">Доставка в</text>
  <text x="827" y="174" class="lb">главное здание</text>
  <text x="827" y="213" class="tm">40 мин</text>

  <!-- Intermediate event: ожидание подписи -->
  <line x1="880" y1="165" x2="910" y2="165" class="ar" marker-end="url(#ar315)"/>
  <circle cx="925" cy="165" r="14" class="ev" stroke="#000" stroke-width="1.3"/>
  <circle cx="925" cy="165" r="10" class="ev" stroke="#000" stroke-width="1.3"/>
  <line x1="925" y1="165" x2="925" y2="158" stroke="#000" stroke-width="1.2"/>
  <line x1="925" y1="165" x2="931" y2="168" stroke="#000" stroke-width="1.2"/>
  <text x="925" y="200" class="lb">Ожидание</text>
  <text x="925" y="214" class="lb">подписи</text>
  <text x="925" y="228" class="tm">от 4 ч до 7 дней</text>

  <!-- Task: Получение -->
  <line x1="939" y1="165" x2="965" y2="165" class="ar" marker-end="url(#ar315)"/>
  <rect x="965" y="140" width="105" height="50" rx="8" class="tk"/>
  <text x="1017" y="160" class="lb">Получение</text>
  <text x="1017" y="174" class="lb">документов</text>
  <text x="1017" y="213" class="tm">40 мин</text>

  <!-- XOR Подписаны? -->
  <line x1="1070" y1="165" x2="1095" y2="165" class="ar" marker-end="url(#ar315)"/>
  <polygon points="1120,143 1142,165 1120,187 1098,165" class="gw"/>
  <line x1="1106" y1="151" x2="1134" y2="179" stroke="#000" stroke-width="1.2"/>
  <line x1="1134" y1="151" x2="1106" y2="179" stroke="#000" stroke-width="1.2"/>
  <text x="1120" y="210" class="lb">Подписаны?</text>

  <!-- нет — повторный поход -->
  <line x1="1120" y1="143" x2="1120" y2="105" class="ar"/>
  <line x1="1120" y1="105" x2="827" y2="105" class="ar" marker-end="url(#ar315)"/>
  <text x="975" y="98" class="tm">нет (+1 день)</text>

  <!-- да -->
  <line x1="1142" y1="165" x2="1170" y2="165" class="ar" marker-end="url(#ar315)"/>
  <text x="1155" y="160" class="tm">да</text>

  <!-- Task: Уведомление -->
  <rect x="1170" y="140" width="105" height="50" rx="8" class="tk"/>
  <text x="1222" y="160" class="lb">Уведомление</text>
  <text x="1222" y="174" class="lb">сотрудника</text>
  <text x="1222" y="213" class="tm">2 мин</text>

  <!-- End event -->
  <line x1="1275" y1="165" x2="1305" y2="165" class="ar" marker-end="url(#ar315)"/>
  <circle cx="1320" cy="165" r="14" class="ev" stroke="#000" stroke-width="3"/>
  <text x="1320" y="200" class="lb">График</text>
  <text x="1320" y="214" class="lb">утверждён</text>

  <!-- ===== Pool 2: Проректор ===== -->
  <!-- message flow down (документы) -->
  <line x1="827" y1="190" x2="827" y2="338" class="msg" marker-end="url(#ar315m)"/>
  <text x="868" y="265" class="tm">бумажные документы</text>

  <rect x="775" y="345" width="105" height="50" rx="8" class="tk"/>
  <text x="827" y="365" class="lb">Подписание</text>
  <text x="827" y="379" class="lb">приказов</text>
  <text x="827" y="412" class="tm">в течение раб. дня</text>

  <!-- message flow back -->
  <line x1="880" y1="370" x2="1017" y2="370" class="msg"/>
  <line x1="1017" y1="370" x2="1017" y2="190" class="msg" marker-end="url(#ar315m)"/>
  <text x="950" y="363" class="tm">подписанные документы</text>

  <text x="750" y="475" class="lb">Время на 1 заявление: 55–135 мин (без ожидания); до 7,25 рабочих дней (с ожиданием)</text>
  <text x="750" y="492" class="lb">Транспортировка между зданиями: 80 мин/день (40 ч/мес) · доля операций НДЦ ≈ 75 %</text>

  <text x="750" y="575" class="src">Источник: составлено автором.</text>
</svg>
