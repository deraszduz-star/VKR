<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <marker id="ar318" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    .ttl{font-family:'Times New Roman',serif;font-size:16px;font-weight:bold;text-anchor:middle}
    .lb{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle}
    .tm{font-family:'Times New Roman',serif;font-size:10px;text-anchor:middle;font-style:italic;fill:#444}
    .src{font-family:'Times New Roman',serif;font-size:13px;text-anchor:middle;font-style:italic}
    .pool{fill:none;stroke:#000;stroke-width:1.4}
    .laneT{font-family:'Times New Roman',serif;font-size:12px;font-weight:bold;text-anchor:middle}
    .ar{stroke:#000;stroke-width:1.3;fill:none}
    .tk{fill:#FFFFFF;stroke:#000;stroke-width:1.3}
    .gw{fill:#FFFFFF;stroke:#000;stroke-width:1.3}
    .ev{fill:#FFFFFF}
  </style>
  <rect width="1500" height="500" fill="white"/>
  <text x="750" y="26" class="ttl">Рис. 3.1.8. BPMN-модель «Исполнение запросов граждан в архиве» (AS IS)</text>

  <!-- Pool -->
  <rect x="40" y="60" width="1430" height="280" class="pool"/>
  <rect x="40" y="60" width="28" height="280" fill="#F2F2F2" stroke="#000" stroke-width="1.4"/>
  <text x="54" y="200" class="laneT" transform="rotate(-90 54 200)">Отдел архивных документов</text>
  <line x1="68" y1="60" x2="68" y2="340" stroke="#000" stroke-width="1.4"/>
  <rect x="68" y="60" width="28" height="280" fill="#FAFAFA"/>
  <text x="82" y="200" class="laneT" transform="rotate(-90 82 200)">Ведущий документовед</text>
  <line x1="96" y1="60" x2="96" y2="340" stroke="#000" stroke-width="1"/>

  <!-- Y center = 200 -->
  <!-- Start -->
  <circle cx="135" cy="200" r="14" class="ev" stroke="#000" stroke-width="1.3"/>
  <text x="135" y="237" class="lb">Заявка</text>
  <text x="135" y="251" class="lb">поступила</text>

  <!-- Task: Регистрация -->
  <line x1="149" y1="200" x2="180" y2="200" class="ar" marker-end="url(#ar318)"/>
  <rect x="180" y="175" width="105" height="50" rx="8" class="tk"/>
  <text x="232" y="195" class="lb">Регистрация</text>
  <text x="232" y="209" class="lb">заявки</text>
  <text x="232" y="248" class="tm">30 с</text>

  <!-- Task: Определение местонахождения -->
  <line x1="285" y1="200" x2="310" y2="200" class="ar" marker-end="url(#ar318)"/>
  <rect x="310" y="175" width="115" height="50" rx="8" class="tk"/>
  <text x="367" y="195" class="lb">Определение</text>
  <text x="367" y="209" class="lb">местонахождения</text>
  <text x="367" y="248" class="tm">2 мин</text>

  <!-- Task: Физический поиск -->
  <line x1="425" y1="200" x2="450" y2="200" class="ar" marker-end="url(#ar318)"/>
  <rect x="450" y="175" width="115" height="50" rx="8" class="tk"/>
  <text x="507" y="195" class="lb">Физический</text>
  <text x="507" y="209" class="lb">поиск дела</text>
  <text x="507" y="248" class="tm">15 мин (узкое место)</text>

  <!-- XOR Дело найдено? -->
  <line x1="565" y1="200" x2="590" y2="200" class="ar" marker-end="url(#ar318)"/>
  <polygon points="615,178 637,200 615,222 593,200" class="gw"/>
  <line x1="601" y1="186" x2="629" y2="214" stroke="#000" stroke-width="1.2"/>
  <line x1="629" y1="186" x2="601" y2="214" stroke="#000" stroke-width="1.2"/>
  <text x="615" y="247" class="lb">Найдено?</text>

  <!-- нет — расширенный поиск -->
  <line x1="615" y1="178" x2="615" y2="120" class="ar"/>
  <line x1="615" y1="120" x2="507" y2="120" class="ar"/>
  <line x1="507" y1="120" x2="507" y2="175" class="ar" marker-end="url(#ar318)"/>
  <text x="555" y="113" class="tm">нет (+5–10 мин)</text>

  <!-- да -->
  <line x1="637" y1="200" x2="665" y2="200" class="ar" marker-end="url(#ar318)"/>
  <text x="652" y="195" class="tm">да</text>

  <!-- Task: Формирование справки -->
  <rect x="665" y="175" width="115" height="50" rx="8" class="tk"/>
  <text x="722" y="195" class="lb">Формирование</text>
  <text x="722" y="209" class="lb">справки</text>
  <text x="722" y="248" class="tm">2 мин 30 с</text>

  <!-- Task: Заверение -->
  <line x1="780" y1="200" x2="805" y2="200" class="ar" marker-end="url(#ar318)"/>
  <rect x="805" y="175" width="105" height="50" rx="8" class="tk"/>
  <text x="857" y="195" class="lb">Заверение</text>
  <text x="857" y="209" class="lb">справки</text>
  <text x="857" y="248" class="tm">1 мин</text>

  <!-- Task: Выдача -->
  <line x1="910" y1="200" x2="935" y2="200" class="ar" marker-end="url(#ar318)"/>
  <rect x="935" y="175" width="105" height="50" rx="8" class="tk"/>
  <text x="987" y="195" class="lb">Выдача</text>
  <text x="987" y="209" class="lb">справки</text>
  <text x="987" y="248" class="tm">1 мин 45 с</text>

  <!-- End -->
  <line x1="1040" y1="200" x2="1070" y2="200" class="ar" marker-end="url(#ar318)"/>
  <circle cx="1085" cy="200" r="14" class="ev" stroke="#000" stroke-width="3"/>
  <text x="1085" y="237" class="lb">Запрос</text>
  <text x="1085" y="251" class="lb">исполнен</text>

  <text x="750" y="395" class="lb">Время цикла: 22 мин на 1 справку · физический поиск ≈ 68 % цикла · оцифровано 12 % фонда (с 2014 г.); за 1960–2014 гг. — 0 %</text>

  <text x="750" y="475" class="src">Источник: составлено автором.</text>
</svg>
