<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600">
  <defs>
    <marker id="arr318" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  <style>
    .ttl{font-family:'Times New Roman',serif;font-size:15px;font-weight:bold;text-anchor:middle}
    .lbl{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle}
    .lblb{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle;font-weight:bold}
    .tm{font-family:'Times New Roman',serif;font-size:10px;text-anchor:middle;font-style:italic;fill:#444}
    .src{font-family:'Times New Roman',serif;font-size:13px;text-anchor:middle;font-style:italic}
    .pool{fill:none;stroke:#000;stroke-width:1.5}
    .lane{fill:#fafafa;stroke:#888;stroke-width:1}
    .laneTitle{font-family:'Times New Roman',serif;font-size:12px;font-weight:bold;text-anchor:middle}
    .ar{stroke:#000;stroke-width:1.5;fill:none}
    .ardash{stroke:#000;stroke-width:1.3;fill:none;stroke-dasharray:5,4}
    .dc{fill:#d4edda;stroke:#000;stroke-width:1.3}
    .ndb{fill:#e2e3e5;stroke:#000;stroke-width:1.3}
    .ndc{fill:#f8d7da;stroke:#000;stroke-width:1.3}
    .ev{fill:white;stroke-width:2}
    .gw{fill:white;stroke:#000;stroke-width:1.5}
  </style>

  <rect width="1500" height="600" fill="white"/>
  <text x="750" y="28" class="ttl">Рис. 3.1.8. BPMN-модель «Исполнение запросов граждан в архиве» (AS IS)</text>

  <!-- Pool -->
  <rect x="40" y="60" width="1430" height="350" class="pool"/>
  <rect x="40" y="60" width="30" height="350" fill="#4472C4"/>
  <text x="55" y="235" class="laneTitle" fill="white" transform="rotate(-90 55 235)">Отдел по работе с архивными документами</text>
  <rect x="70" y="60" width="1400" height="350" class="lane"/>
  <rect x="70" y="60" width="30" height="350" fill="#D9E2F3"/>
  <text x="85" y="235" class="laneTitle" transform="rotate(-90 85 235)">Ведущий документовед</text>

  <!-- Легенда -->
  <rect x="1170" y="72" width="290" height="55" fill="white" stroke="#888"/>
  <text x="1315" y="88" class="lblb">Тип операции</text>
  <rect x="1180" y="95" width="14" height="10" class="dc"/><text x="1200" y="104" class="lbl" text-anchor="start">ДЦ — добавляет ценность</text>
  <rect x="1180" y="110" width="14" height="10" class="ndb"/><text x="1200" y="119" class="lbl" text-anchor="start">НДБ — необходимо для бизнеса</text>
  <rect x="1330" y="95" width="14" height="10" class="ndc"/><text x="1350" y="104" class="lbl" text-anchor="start">НДЦ — потери</text>

  <!-- 1. Start -->
  <circle cx="125" cy="225" r="14" class="ev" stroke="#548235"/>
  <text x="125" y="255" class="lbl">Поступление заявки</text>
  <text x="125" y="268" class="lbl">(почта/визит)</text>

  <!-- 2. Регистрация -->
  <line x1="139" y1="225" x2="170" y2="225" class="ar" marker-end="url(#arr318)"/>
  <rect x="170" y="200" width="100" height="50" rx="8" class="ndb"/>
  <text x="220" y="218" class="lbl">2. Регистрация</text>
  <text x="220" y="232" class="lbl">заявки в</text>
  <text x="220" y="246" class="lbl">журнале</text>
  <text x="220" y="270" class="tm">30 сек · НДБ</text>
  <rect x="175" y="204" width="9" height="7" fill="#4472C4"/>

  <!-- 3. Определение местонахождения -->
  <line x1="270" y1="225" x2="295" y2="225" class="ar" marker-end="url(#arr318)"/>
  <rect x="295" y="200" width="105" height="50" rx="8" class="ndb"/>
  <text x="347" y="218" class="lbl">3. Определение</text>
  <text x="347" y="232" class="lbl">местонахожд.</text>
  <text x="347" y="246" class="lbl">дела (по описям)</text>
  <text x="347" y="270" class="tm">2 мин · НДБ</text>

  <!-- 4. Физический поиск — КРИТИЧЕСКОЕ -->
  <line x1="400" y1="225" x2="425" y2="225" class="ar" marker-end="url(#arr318)"/>
  <rect x="425" y="200" width="115" height="50" rx="8" class="ndc" stroke-width="2.5" stroke="#C00000"/>
  <text x="482" y="218" class="lbl">4. Физический</text>
  <text x="482" y="232" class="lbl">поиск дела</text>
  <text x="482" y="246" class="lbl">в архивохранилище</text>
  <text x="482" y="270" class="tm" fill="#8B0000" font-weight="bold">15 мин · НДЦ ⚠⚠</text>

  <!-- 5. XOR Дело найдено? -->
  <line x1="540" y1="225" x2="565" y2="225" class="ar" marker-end="url(#arr318)"/>
  <polygon points="590,225 610,205 630,225 610,245" class="gw"/>
  <text x="610" y="230" class="lblb">×</text>
  <text x="610" y="270" class="lbl">Дело найдено?</text>

  <!-- 5а. При отсутствии — расширенный поиск (петля) -->
  <line x1="610" y1="245" x2="610" y2="320" class="ardash"/>
  <text x="618" y="285" class="tm">нет</text>
  <rect x="500" y="320" width="220" height="40" rx="8" class="ndc"/>
  <text x="610" y="338" class="lbl">5а. Расширенный поиск,</text>
  <text x="610" y="352" class="lbl">обращение к коллегам</text>
  <text x="610" y="375" class="tm">+5–10 мин · НДЦ</text>
  <line x1="500" y1="340" x2="450" y2="340" class="ardash"/>
  <line x1="450" y1="340" x2="450" y2="225" class="ardash"/>
  <line x1="450" y1="225" x2="425" y2="225" class="ardash" marker-end="url(#arr318)"/>
  <text x="400" y="335" class="tm">возврат к</text>
  <text x="400" y="348" class="tm">физическому поиску</text>

  <!-- 6. Формирование справки -->
  <line x1="630" y1="225" x2="660" y2="225" class="ar" marker-end="url(#arr318)"/>
  <text x="640" y="217" class="tm">да</text>
  <rect x="660" y="200" width="105" height="50" rx="8" class="dc"/>
  <text x="712" y="218" class="lbl">6. Формирование</text>
  <text x="712" y="232" class="lbl">архивной</text>
  <text x="712" y="246" class="lbl">справки</text>
  <text x="712" y="270" class="tm">2 мин 30 сек · ДЦ</text>

  <!-- 7. Заверение -->
  <line x1="765" y1="225" x2="790" y2="225" class="ar" marker-end="url(#arr318)"/>
  <rect x="790" y="200" width="100" height="50" rx="8" class="ndb"/>
  <text x="840" y="218" class="lbl">7. Заверение</text>
  <text x="840" y="232" class="lbl">справки</text>
  <text x="840" y="246" class="lbl">(подпись, печать)</text>
  <text x="840" y="270" class="tm">1 мин · НДБ</text>

  <!-- 8. Выдача -->
  <line x1="890" y1="225" x2="915" y2="225" class="ar" marker-end="url(#arr318)"/>
  <rect x="915" y="200" width="105" height="50" rx="8" class="dc"/>
  <text x="967" y="218" class="lbl">8. Выдача</text>
  <text x="967" y="232" class="lbl">справки</text>
  <text x="967" y="246" class="lbl">заявителю/почтой</text>
  <text x="967" y="270" class="tm">1 мин 45 сек · ДЦ</text>

  <!-- End -->
  <line x1="1020" y1="225" x2="1050" y2="225" class="ar" marker-end="url(#arr318)"/>
  <circle cx="1065" cy="225" r="14" fill="white" stroke="#C00000" stroke-width="3.5"/>
  <text x="1065" y="255" class="lbl">Запрос</text>
  <text x="1065" y="268" class="lbl">исполнен</text>

  <!-- Сводные показатели -->
  <rect x="40" y="430" width="1430" height="120" fill="#fff7e6" stroke="#888"/>
  <text x="755" y="450" class="lblb">Сводные характеристики процесса AS IS</text>
  <text x="60" y="472" class="lbl" text-anchor="start">• Один пул, одна дорожка. Среднее время выдачи справки: 22 мин (1305 сек). Время такта: 30 мин (целевое).</text>
  <text x="60" y="490" class="lbl" text-anchor="start">• Критическое узкое место — физический поиск дела в архивохранилище: 15 мин = 68 % общего времени цикла; ручной поиск среди 170 000+ единиц хранения.</text>
  <text x="60" y="508" class="lbl" text-anchor="start">• Уровень оцифровки: 12 % (за 2014–2025 гг.); 0 % (за 1960–2014 гг.). Только 4 сотрудника в отделе. Системный риск утраты документов из-за отсутствия резервных копий.</text>
  <text x="60" y="526" class="lbl" text-anchor="start">• Шлюз XOR при отсутствии дела на ожидаемом месте: время поиска увеличивается до 25–30 мин; петля возврата к шагу 4 (физический поиск).</text>

  <text x="750" y="588" class="src">Источник: составлено автором.</text>
</svg>
