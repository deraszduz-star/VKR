<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600">
  <defs>
    <marker id="arr325" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  <style>
    .ttl{font-family:'Times New Roman',serif;font-size:15px;font-weight:bold;text-anchor:middle}
    .lbl{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle}
    .lblb{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle;font-weight:bold}
    .tm{font-family:'Times New Roman',serif;font-size:10px;text-anchor:middle;font-style:italic;fill:#444}
    .src{font-family:'Times New Roman',serif;font-size:13px;text-anchor:middle;font-style:italic}
    .pool{fill:none;stroke:#000;stroke-width:1.5}
    .lane{fill:#fafafa;stroke:#888;stroke-width:1}
    .laneTitle{font-family:'Times New Roman',serif;font-size:12px;font-weight:bold;text-anchor:middle}
    .ar{stroke:#000;stroke-width:1.5;fill:none}
    .ardash{stroke:#000;stroke-width:1.3;fill:none;stroke-dasharray:5,4}
    .dc{fill:#d4edda;stroke:#000;stroke-width:1.3}
    .ndb{fill:#e2e3e5;stroke:#000;stroke-width:1.3}
    .ndc{fill:#f8d7da;stroke:#000;stroke-width:1.3}
    .ev{fill:white;stroke-width:2}
    .gw{fill:white;stroke:#000;stroke-width:1.5}
  </style>

  <rect width="1500" height="600" fill="white"/>
  <text x="750" y="28" class="ttl">Рис. 3.2.5. BPMN-модель «Исполнение запросов граждан (оцифрованный архив)» (TO BE)</text>

  <!-- Pool -->
  <rect x="40" y="60" width="1430" height="350" class="pool"/>
  <rect x="40" y="60" width="30" height="350" fill="#4472C4"/>
  <text x="55" y="235" class="laneTitle" fill="white" transform="rotate(-90 55 235)">Отдел по работе с архивными документами</text>
  <rect x="70" y="60" width="1400" height="350" class="lane"/>
  <rect x="70" y="60" width="30" height="350" fill="#D9E2F3"/>
  <text x="85" y="235" class="laneTitle" transform="rotate(-90 85 235)">Ведущий документовед</text>

  <!-- Легенда -->
  <rect x="1170" y="72" width="290" height="55" fill="white" stroke="#888"/>
  <text x="1315" y="88" class="lblb">Тип операции</text>
  <rect x="1180" y="95" width="14" height="10" class="dc"/><text x="1200" y="104" class="lbl" text-anchor="start">ДЦ — добавляет ценность</text>
  <rect x="1180" y="110" width="14" height="10" class="ndb"/><text x="1200" y="119" class="lbl" text-anchor="start">НДБ — необходимо для бизнеса</text>
  <rect x="1330" y="95" width="14" height="10" class="ndc"/><text x="1350" y="104" class="lbl" text-anchor="start">НДЦ — потери</text>

  <!-- 1. Start -->
  <circle cx="125" cy="225" r="14" class="ev" stroke="#548235"/>
  <text x="125" y="255" class="lbl">Поступление заявки</text>
  <text x="125" y="268" class="lbl">(почта/визит)</text>

  <!-- 2. Регистрация в эл. журнале -->
  <line x1="139" y1="225" x2="170" y2="225" class="ar" marker-end="url(#arr325)"/>
  <rect x="170" y="200" width="105" height="50" rx="8" class="ndb"/>
  <rect x="175" y="204" width="9" height="7" fill="#4472C4"/>
  <text x="222" y="218" class="lbl">2. Регистрация</text>
  <text x="222" y="232" class="lbl">в электронном</text>
  <text x="222" y="246" class="lbl">журнале</text>
  <text x="222" y="270" class="tm">30 сек · НДБ</text>

  <!-- 3. Электронный поиск -->
  <line x1="275" y1="225" x2="300" y2="225" class="ar" marker-end="url(#arr325)"/>
  <rect x="300" y="200" width="115" height="50" rx="8" class="ndb"/>
  <rect x="305" y="204" width="9" height="7" fill="#4472C4"/>
  <text x="357" y="218" class="lbl">3. Электронный</text>
  <text x="357" y="232" class="lbl">поиск (по ФИО,</text>
  <text x="357" y="246" class="lbl">году, № дела)</text>
  <text x="357" y="270" class="tm" fill="#0a7d2a" font-weight="bold">2 мин · вместо 15 мин</text>

  <!-- 4. XOR — найден в эл. базе? -->
  <line x1="415" y1="225" x2="440" y2="225" class="ar" marker-end="url(#arr325)"/>
  <polygon points="465,225 485,205 505,225 485,245" class="gw"/>
  <text x="485" y="230" class="lblb">×</text>
  <text x="485" y="270" class="lbl">Найден в эл. базе?</text>

  <!-- 4а. при отсутствии — физический поиск (для не-оцифрованных) -->
  <line x1="485" y1="245" x2="485" y2="320" class="ardash"/>
  <text x="495" y="285" class="tm">нет</text>
  <rect x="375" y="320" width="220" height="40" rx="8" class="ndc"/>
  <text x="485" y="338" class="lbl">4а. Физический поиск</text>
  <text x="485" y="352" class="lbl">(для не вошедших в оцифровку)</text>
  <text x="485" y="375" class="tm">10 мин · НДЦ</text>
  <line x1="595" y1="340" x2="660" y2="340" class="ardash"/>
  <line x1="660" y1="340" x2="660" y2="225" class="ardash" marker-end="url(#arr325)"/>

  <!-- 5. Просмотр электронной копии -->
  <line x1="505" y1="225" x2="525" y2="225" class="ar" marker-end="url(#arr325)"/>
  <text x="513" y="217" class="tm">да</text>
  <rect x="525" y="200" width="115" height="50" rx="8" class="dc"/>
  <rect x="530" y="204" width="9" height="7" fill="#4472C4"/>
  <text x="582" y="218" class="lbl">5. Просмотр</text>
  <text x="582" y="232" class="lbl">электронной копии,</text>
  <text x="582" y="246" class="lbl">выписка данных</text>
  <text x="582" y="270" class="tm">2 мин · ДЦ</text>

  <!-- 6. Формирование справки -->
  <line x1="640" y1="225" x2="665" y2="225" class="ar" marker-end="url(#arr325)"/>
  <rect x="665" y="200" width="115" height="50" rx="8" class="dc"/>
  <text x="722" y="218" class="lbl">6. Формирование</text>
  <text x="722" y="232" class="lbl">архивной справки</text>
  <text x="722" y="246" class="lbl">(автозаполнение)</text>
  <text x="722" y="270" class="tm">2 мин · ДЦ</text>

  <!-- 7. Заверение -->
  <line x1="780" y1="225" x2="805" y2="225" class="ar" marker-end="url(#arr325)"/>
  <rect x="805" y="200" width="100" height="50" rx="8" class="ndb"/>
  <text x="855" y="218" class="lbl">7. Заверение</text>
  <text x="855" y="232" class="lbl">справки (подпись,</text>
  <text x="855" y="246" class="lbl">печать)</text>
  <text x="855" y="270" class="tm">1 мин · НДБ</text>

  <!-- 8. Выдача -->
  <line x1="905" y1="225" x2="930" y2="225" class="ar" marker-end="url(#arr325)"/>
  <rect x="930" y="200" width="115" height="50" rx="8" class="dc"/>
  <text x="987" y="218" class="lbl">8. Выдача справки</text>
  <text x="987" y="232" class="lbl">заявителю/почтой/</text>
  <text x="987" y="246" class="lbl">СДЭК</text>
  <text x="987" y="270" class="tm">1 мин 30 сек · ДЦ</text>

  <!-- End -->
  <line x1="1045" y1="225" x2="1075" y2="225" class="ar" marker-end="url(#arr325)"/>
  <circle cx="1090" cy="225" r="14" fill="white" stroke="#C00000" stroke-width="3.5"/>
  <text x="1090" y="255" class="lbl">Запрос</text>
  <text x="1090" y="268" class="lbl">исполнен</text>

  <!-- Сводные показатели -->
  <rect x="40" y="430" width="1430" height="120" fill="#e6f4e6" stroke="#888"/>
  <text x="755" y="450" class="lblb">Эффект целевого процесса (TO BE)</text>
  <text x="60" y="472" class="lbl" text-anchor="start">• Среднее время выдачи справки: 14 мин (850 сек) — вместо 22 мин в AS IS (−36 %).</text>
  <text x="60" y="490" class="lbl" text-anchor="start">• Время поиска документа: 2 мин (электронный) — вместо 15 мин (физический), −87 %; время доступа к файлу на SSD ≤ 2 сек.</text>
  <text x="60" y="508" class="lbl" text-anchor="start">• Уровень оцифровки целевого массива: 100 % (30 000 ед. пилотного проекта); точность OCR ≥ 98 %; резервное копирование с зеркалированием SSD.</text>
  <text x="60" y="526" class="lbl" text-anchor="start">• Доля НДЦ: 68 % → ~15 %. Шлюз XOR сохраняется для документов, не вошедших в пилотный проект (с уменьшенным временем поиска: 10 мин вместо 15).</text>

  <text x="750" y="588" class="src">Источник: составлено автором.</text>
</svg>
