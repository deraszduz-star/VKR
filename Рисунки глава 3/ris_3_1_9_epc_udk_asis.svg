<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <defs>
    <marker id="arr319" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  <style>
    .ttl{font-family:'Times New Roman',serif;font-size:15px;font-weight:bold;text-anchor:middle}
    .lbl{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle}
    .lblb{font-family:'Times New Roman',serif;font-size:12px;text-anchor:middle;font-weight:bold}
    .src{font-family:'Times New Roman',serif;font-size:13px;text-anchor:middle;font-style:italic}
    .ar{stroke:#000;stroke-width:1.5;fill:none}
    .ardash{stroke:#000;stroke-width:1.3;fill:none;stroke-dasharray:5,4}
    .evt{fill:#FCE4D6;stroke:#000;stroke-width:1.3}
    .fn{fill:#E2EFDA;stroke:#000;stroke-width:1.3}
    .gw{fill:white;stroke:#000;stroke-width:1.3}
    .bot{fill:#FFEDED;stroke:#C00000;stroke-width:1.3;stroke-dasharray:5,3}
    .botCrit{fill:#FFD6D6;stroke:#C00000;stroke-width:2}
    .botT{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle;fill:#8B0000}
  </style>

  <rect width="1400" height="720" fill="white"/>
  <text x="700" y="28" class="ttl">Рис. 3.1.9. EPC-модель «Исполнение запросов граждан в архиве» (AS IS): проблемные зоны</text>

  <text x="200" y="62" class="lblb">События (E)</text>
  <text x="600" y="62" class="lblb">Функции (F)</text>
  <text x="1100" y="62" class="lblb">Узкие места и потери</text>

  <!-- ROW 1 -->
  <polygon points="100,90 280,90 300,115 280,140 100,140 80,115" class="evt"/>
  <text x="190" y="110" class="lbl">Заявка</text>
  <text x="190" y="124" class="lbl">зарегистрирована</text>

  <line x1="300" y1="115" x2="430" y2="115" class="ar" marker-end="url(#arr319)"/>

  <rect x="430" y="90" width="220" height="50" rx="10" class="fn"/>
  <text x="540" y="110" class="lbl">F1. Определение</text>
  <text x="540" y="124" class="lbl">местонахождения дела</text>

  <line x1="650" y1="115" x2="780" y2="115" class="ar" marker-end="url(#arr319)"/>

  <rect x="780" y="80" width="380" height="70" class="bot"/>
  <text x="970" y="100" class="botT" font-weight="bold">⚠ Только 12 % документов (с 2014 г.) в цифре;</text>
  <text x="970" y="115" class="botT">за 1960–2014 гг. — исключительно бумажный поиск</text>
  <text x="970" y="138" class="botT" font-weight="bold">Системная проблема: 88 % фонда не оцифровано</text>

  <line x1="540" y1="140" x2="540" y2="170" class="ar" marker-end="url(#arr319)"/>

  <!-- ROW 2 — КРИТИЧЕСКОЕ -->
  <polygon points="100,180 280,180 300,205 280,230 100,230 80,205" class="evt"/>
  <text x="190" y="200" class="lbl">Местонахождение</text>
  <text x="190" y="214" class="lbl">определено</text>

  <line x1="300" y1="205" x2="430" y2="205" class="ar" marker-end="url(#arr319)"/>

  <rect x="430" y="180" width="220" height="50" rx="10" class="fn"/>
  <text x="540" y="200" class="lbl">F2. Физический поиск дела</text>
  <text x="540" y="214" class="lbl">в архивохранилище</text>

  <line x1="650" y1="205" x2="780" y2="205" class="ar" marker-end="url(#arr319)"/>

  <rect x="780" y="170" width="380" height="85" class="botCrit"/>
  <text x="970" y="190" class="botT" font-weight="bold">⚠⚠ КРИТИЧЕСКОЕ УЗКОЕ МЕСТО</text>
  <text x="970" y="207" class="botT">Ручной поиск среди 170 000+ единиц хранения;</text>
  <text x="970" y="222" class="botT">перемещения между стеллажами; риск утери</text>
  <text x="970" y="244" class="botT" font-weight="bold">Потери: 15 мин/запрос (68 % цикла)</text>

  <!-- XOR после F2 -->
  <line x1="540" y1="230" x2="540" y2="265" class="ar"/>
  <polygon points="520,265 540,245 560,265 540,285" class="gw"/>
  <text x="540" y="271" class="lblb">×</text>
  <text x="615" y="270" class="lbl" text-anchor="start">XOR — дело найдено?</text>

  <!-- Ветвь нет -->
  <line x1="540" y1="285" x2="350" y2="285" class="ar"/>
  <line x1="350" y1="285" x2="350" y2="320" class="ar" marker-end="url(#arr319)"/>
  <text x="445" y="280" class="lbl">нет</text>

  <rect x="220" y="320" width="260" height="50" rx="10" class="fn"/>
  <text x="350" y="340" class="lbl">F-ext. Расширенный поиск,</text>
  <text x="350" y="354" class="lbl">обращение к коллегам</text>
  <line x1="220" y1="345" x2="180" y2="345" class="ardash"/>
  <line x1="180" y1="345" x2="180" y2="205" class="ardash"/>
  <line x1="180" y1="205" x2="80" y2="205" class="ardash" marker-end="url(#arr319)"/>
  <text x="170" y="360" class="lbl">возврат к «Местонахождение»</text>

  <!-- Ветвь да -->
  <line x1="540" y1="285" x2="730" y2="285" class="ar"/>
  <line x1="730" y1="285" x2="730" y2="315" class="ar" marker-end="url(#arr319)"/>
  <text x="640" y="280" class="lbl">да</text>

  <!-- ROW 3 -->
  <polygon points="640,315 820,315 840,340 820,365 640,365 620,340" class="evt"/>
  <text x="730" y="335" class="lbl">Дело</text>
  <text x="730" y="349" class="lbl">найдено</text>

  <line x1="730" y1="365" x2="730" y2="395" class="ar" marker-end="url(#arr319)"/>

  <rect x="620" y="395" width="220" height="50" rx="10" class="fn"/>
  <text x="730" y="415" class="lbl">F3. Формирование</text>
  <text x="730" y="429" class="lbl">архивной справки</text>

  <line x1="840" y1="420" x2="900" y2="420" class="ar" marker-end="url(#arr319)"/>

  <rect x="900" y="385" width="380" height="70" class="bot"/>
  <text x="1090" y="405" class="botT" font-weight="bold">⚠ Ручная выписка данных из бумажного дела;</text>
  <text x="1090" y="420" class="botT">отсутствие OCR и электронного поиска</text>
  <text x="1090" y="443" class="botT" font-weight="bold">Потери: 2,5 мин · НДБ</text>

  <line x1="730" y1="445" x2="730" y2="475" class="ar" marker-end="url(#arr319)"/>

  <!-- ROW 4 -->
  <polygon points="640,475 820,475 840,500 820,525 640,525 620,500" class="evt"/>
  <text x="730" y="495" class="lbl">Справка</text>
  <text x="730" y="509" class="lbl">сформирована</text>

  <line x1="730" y1="525" x2="730" y2="555" class="ar" marker-end="url(#arr319)"/>

  <rect x="620" y="555" width="220" height="50" rx="10" class="fn"/>
  <text x="730" y="575" class="lbl">F4. Заверение</text>
  <text x="730" y="589" class="lbl">и выдача справки</text>

  <line x1="840" y1="580" x2="900" y2="580" class="ar" marker-end="url(#arr319)"/>

  <rect x="900" y="545" width="380" height="65" class="bot"/>
  <text x="1090" y="565" class="botT" font-weight="bold">⚠ Необходимость физического присутствия</text>
  <text x="1090" y="580" class="botT">для заверения печатью; передача почтой</text>
  <text x="1090" y="603" class="botT" font-weight="bold">Потери: 2,5 мин/справка</text>

  <line x1="730" y1="605" x2="730" y2="635" class="ar" marker-end="url(#arr319)"/>

  <!-- Конечное событие -->
  <polygon points="640,635 820,635 840,660 820,685 640,685 620,660" fill="#FCE4D6" stroke="#C00000" stroke-width="2"/>
  <text x="730" y="660" class="lbl" font-weight="bold">Запрос</text>
  <text x="730" y="674" class="lbl">исполнен</text>

  <text x="700" y="708" class="src">Источник: составлено автором.</text>
</svg>
