<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1380" viewBox="0 0 1100 1380">
  <defs>
    <marker id="ar319" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    .ttl{font-family:'Times New Roman',serif;font-size:16px;font-weight:bold;text-anchor:middle}
    .lb{font-family:'Times New Roman',serif;font-size:12px;text-anchor:middle}
    .lbb{font-family:'Times New Roman',serif;font-size:14px;text-anchor:middle;font-weight:bold}
    .src{font-family:'Times New Roman',serif;font-size:13px;text-anchor:middle;font-style:italic}
    .ar{stroke:#000;stroke-width:1.3;fill:none}
    .evt{fill:#FCE4D6;stroke:#000;stroke-width:1.3}
    .fn{fill:#E2EFDA;stroke:#000;stroke-width:1.3}
    .gw{fill:#FFFFFF;stroke:#000;stroke-width:1.3}
    .bn{fill:#FFEDED;stroke:#C00000;stroke-width:1.2;stroke-dasharray:5,3}
    .bnT{font-family:'Times New Roman',serif;font-size:11px;text-anchor:start;fill:#8B0000}
    .bnTc{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle;fill:#8B0000;font-weight:bold}
  </style>
  <rect width="1100" height="1380" fill="white"/>
  <text x="550" y="26" class="ttl">Рис. 3.1.9. EPC-модель «Исполнение запросов граждан в архиве» (AS IS): проблемные зоны</text>

  <!-- E1 -->
  <polygon points="245,55 455,55 475,80 455,105 245,105 225,80" class="evt"/>
  <text x="350" y="78" class="lb">Заявка от гражданина</text>
  <text x="350" y="92" class="lb">поступила</text>
  <line x1="350" y1="105" x2="350" y2="135" class="ar" marker-end="url(#ar319)"/>

  <!-- F1: Регистрация -->
  <rect x="245" y="135" width="210" height="55" rx="10" class="fn"/>
  <text x="350" y="160" class="lb">Регистрация заявки</text>
  <text x="350" y="174" class="lb">в журнале</text>
  <line x1="350" y1="190" x2="350" y2="220" class="ar" marker-end="url(#ar319)"/>

  <!-- E2 -->
  <polygon points="245,220 455,220 475,245 455,270 245,270 225,245" class="evt"/>
  <text x="350" y="252" class="lb">Заявка зарегистрирована</text>
  <line x1="350" y1="270" x2="350" y2="300" class="ar" marker-end="url(#ar319)"/>

  <!-- F2: Определение местонахождения -->
  <rect x="245" y="300" width="210" height="55" rx="10" class="fn"/>
  <text x="350" y="325" class="lb">Определение место-</text>
  <text x="350" y="339" class="lb">нахождения дела</text>
  <line x1="350" y1="355" x2="350" y2="385" class="ar" marker-end="url(#ar319)"/>
  <line x1="455" y1="327" x2="510" y2="327" class="ar"/>
  <rect x="510" y="300" width="320" height="55" class="bn"/>
  <text x="520" y="318" class="bnT">Только 12 % фонда (с 2014 г.) оцифровано;</text>
  <text x="520" y="333" class="bnT">за 1960–2014 гг. — 0 %.</text>
  <text x="520" y="348" class="bnTc" text-anchor="start">Системная проблема</text>

  <!-- E3 -->
  <polygon points="245,385 455,385 475,410 455,435 245,435 225,410" class="evt"/>
  <text x="350" y="417" class="lb">Местонахождение определено</text>
  <line x1="350" y1="435" x2="350" y2="465" class="ar" marker-end="url(#ar319)"/>

  <!-- F3: Физический поиск -->
  <rect x="245" y="465" width="210" height="55" rx="10" class="fn"/>
  <text x="350" y="490" class="lb">Физический поиск</text>
  <text x="350" y="504" class="lb">в архивохранилище</text>
  <line x1="350" y1="520" x2="350" y2="555" class="ar"/>
  <line x1="455" y1="492" x2="510" y2="492" class="ar"/>
  <rect x="510" y="455" width="320" height="65" fill="#FFD6D6" stroke="#C00000" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="670" y="473" class="bnTc">КРИТИЧЕСКОЕ УЗКОЕ МЕСТО</text>
  <text x="520" y="490" class="bnT">Ручной поиск среди 170 000+ ед. хранения;</text>
  <text x="520" y="505" class="bnT">перемещения между стеллажами.</text>
  <text x="520" y="518" class="bnTc" text-anchor="start">Потери: 15 мин/запрос (68 % цикла)</text>

  <!-- XOR after function -->
  <circle cx="350" cy="580" r="22" class="gw"/>
  <text x="350" y="588" class="lbb">×</text>
  <text x="395" y="585" class="lb" text-anchor="start">XOR</text>

  <line x1="350" y1="602" x2="350" y2="615" class="ar"/>
  <line x1="180" y1="615" x2="520" y2="615" class="ar"/>
  <line x1="180" y1="615" x2="180" y2="645" class="ar" marker-end="url(#ar319)"/>
  <line x1="520" y1="615" x2="520" y2="645" class="ar" marker-end="url(#ar319)"/>
  <text x="240" y="610" class="lb">не найдено</text>
  <text x="585" y="610" class="lb">найдено</text>

  <!-- Left branch: расширенный поиск -->
  <polygon points="95,645 265,645 285,670 265,695 95,695 75,670" class="evt"/>
  <text x="180" y="677" class="lb">Дело не на месте</text>
  <line x1="180" y1="695" x2="180" y2="725" class="ar" marker-end="url(#ar319)"/>
  <rect x="80" y="725" width="200" height="55" rx="10" class="fn"/>
  <text x="180" y="750" class="lb">Расширенный поиск,</text>
  <text x="180" y="764" class="lb">обращение к коллегам</text>
  <line x1="180" y1="780" x2="180" y2="810" class="ar" marker-end="url(#ar319)"/>
  <polygon points="95,810 265,810 285,835 265,860 95,860 75,835" class="evt"/>
  <text x="180" y="842" class="lb">Дело найдено</text>
  <!-- merge back: arrow to E "Дело найдено" main path -->
  <line x1="180" y1="860" x2="180" y2="890" class="ar"/>
  <line x1="180" y1="890" x2="520" y2="890" class="ar" marker-end="url(#ar319)"/>
  <text x="60" y="700" class="lb" text-anchor="start">+5–10 мин</text>

  <!-- Right branch: дело найдено -->
  <polygon points="435,645 605,645 625,670 605,695 435,695 415,670" class="evt"/>
  <text x="520" y="677" class="lb">Дело найдено</text>
  <line x1="520" y1="695" x2="520" y2="890" class="ar"/>

  <!-- After merge — F4: Формирование справки. Need the merge XOR -->
  <circle cx="520" cy="915" r="22" class="gw"/>
  <text x="520" y="923" class="lbb">×</text>
  <text x="565" y="920" class="lb" text-anchor="start">XOR</text>

  <line x1="520" y1="937" x2="520" y2="960" class="ar" marker-end="url(#ar319)"/>

  <!-- E: Дело доступно -->
  <polygon points="435,960 605,960 625,985 605,1010 435,1010 415,985" class="evt"/>
  <text x="520" y="992" class="lb">Дело доступно</text>
  <line x1="520" y1="1010" x2="520" y2="1040" class="ar" marker-end="url(#ar319)"/>

  <!-- F4: Формирование справки -->
  <rect x="415" y="1040" width="210" height="55" rx="10" class="fn"/>
  <text x="520" y="1065" class="lb">Формирование</text>
  <text x="520" y="1079" class="lb">архивной справки</text>
  <line x1="520" y1="1095" x2="520" y2="1125" class="ar" marker-end="url(#ar319)"/>
  <line x1="625" y1="1067" x2="680" y2="1067" class="ar"/>
  <rect x="680" y="1040" width="320" height="55" class="bn"/>
  <text x="690" y="1058" class="bnT">Ручная выписка из бумажного дела;</text>
  <text x="690" y="1073" class="bnT">нет OCR и электронного поиска.</text>
  <text x="690" y="1088" class="bnTc" text-anchor="start">Потери: 2,5 мин</text>

  <!-- E -->
  <polygon points="435,1125 605,1125 625,1150 605,1175 435,1175 415,1150" class="evt"/>
  <text x="520" y="1157" class="lb">Справка сформирована</text>
  <line x1="520" y1="1175" x2="520" y2="1205" class="ar" marker-end="url(#ar319)"/>

  <!-- F5: Заверение и выдача -->
  <rect x="415" y="1205" width="210" height="55" rx="10" class="fn"/>
  <text x="520" y="1230" class="lb">Заверение печатью</text>
  <text x="520" y="1244" class="lb">и выдача справки</text>
  <line x1="520" y1="1260" x2="520" y2="1290" class="ar" marker-end="url(#ar319)"/>
  <line x1="625" y1="1232" x2="680" y2="1232" class="ar"/>
  <rect x="680" y="1205" width="320" height="55" class="bn"/>
  <text x="690" y="1223" class="bnT">Необходимость физического присутствия</text>
  <text x="690" y="1238" class="bnT">для заверения печатью.</text>
  <text x="690" y="1253" class="bnTc" text-anchor="start">Потери: 2,5 мин</text>

  <!-- Final E -->
  <polygon points="435,1290 605,1290 625,1315 605,1340 435,1340 415,1315" class="evt" stroke-width="2"/>
  <text x="520" y="1317" class="lb" font-weight="bold">Запрос исполнен</text>

  <text x="550" y="1370" class="src">Источник: составлено автором.</text>
</svg>
