<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1480" viewBox="0 0 1100 1480">
  <defs>
    <marker id="ar313" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    .ttl{font-family:'Times New Roman',serif;font-size:16px;font-weight:bold;text-anchor:middle}
    .lb{font-family:'Times New Roman',serif;font-size:12px;text-anchor:middle}
    .lbb{font-family:'Times New Roman',serif;font-size:14px;text-anchor:middle;font-weight:bold}
    .src{font-family:'Times New Roman',serif;font-size:13px;text-anchor:middle;font-style:italic}
    .ar{stroke:#000;stroke-width:1.3;fill:none}
    .evt{fill:#FCE4D6;stroke:#000;stroke-width:1.3}
    .fn{fill:#E2EFDA;stroke:#000;stroke-width:1.3}
    .gw{fill:#FFFFFF;stroke:#000;stroke-width:1.3}
    .bn{fill:#FFEDED;stroke:#C00000;stroke-width:1.2;stroke-dasharray:5,3}
    .bnT{font-family:'Times New Roman',serif;font-size:11px;text-anchor:start;fill:#8B0000}
    .bnTc{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle;fill:#8B0000;font-weight:bold}
  </style>
  <rect width="1100" height="1480" fill="white"/>
  <text x="550" y="26" class="ttl">Рис. 3.1.3. EPC-модель «Регистрация экспонатов в КАМИС» (AS IS): проблемные зоны</text>

  <!-- Vertical chain on x = 350 (left of bottleneck column at x = 700+) -->

  <!-- E1: Экспонат поступил -->
  <polygon points="265,55 435,55 455,80 435,105 265,105 245,80" class="evt"/>
  <text x="350" y="78" class="lb">Экспонат поступил</text>
  <text x="350" y="92" class="lb">для регистрации</text>
  <line x1="350" y1="105" x2="350" y2="135" class="ar" marker-end="url(#ar313)"/>

  <!-- F1 -->
  <rect x="245" y="135" width="210" height="55" rx="10" class="fn"/>
  <text x="350" y="160" class="lb">Подготовка фотозоны</text>
  <text x="350" y="174" class="lb">(настройка фона, освещения)</text>
  <line x1="350" y1="190" x2="350" y2="220" class="ar" marker-end="url(#ar313)"/>
  <!-- bottleneck 1 -->
  <line x1="455" y1="162" x2="510" y2="162" class="ar"/>
  <rect x="510" y="135" width="320" height="55" class="bn"/>
  <text x="520" y="153" class="bnT">Ежедневная настройка фотоаппарата и фона;</text>
  <text x="520" y="168" class="bnT">отсутствие стационарной фотозоны (нет 5С).</text>
  <text x="520" y="183" class="bnTc" text-anchor="start">Потери: 5 мин/день</text>

  <!-- E2 -->
  <polygon points="265,220 435,220 455,245 435,270 265,270 245,245" class="evt"/>
  <text x="350" y="252" class="lb">Фотозона готова</text>
  <line x1="350" y1="270" x2="350" y2="300" class="ar" marker-end="url(#ar313)"/>

  <!-- F2 -->
  <rect x="245" y="300" width="210" height="55" rx="10" class="fn"/>
  <text x="350" y="325" class="lb">Фотосъёмка экспоната</text>
  <text x="350" y="339" class="lb">и измерение параметров</text>
  <line x1="350" y1="355" x2="350" y2="385" class="ar" marker-end="url(#ar313)"/>
  <line x1="455" y1="327" x2="510" y2="327" class="ar"/>
  <rect x="510" y="300" width="320" height="55" class="bn"/>
  <text x="520" y="318" class="bnT">Перемещение тяжёлых образцов между</text>
  <text x="520" y="333" class="bnT">хранилищем и рабочим местом.</text>
  <text x="520" y="348" class="bnTc" text-anchor="start">Потери: 1,5 мин/экспонат</text>

  <!-- E3 -->
  <polygon points="265,385 435,385 455,410 435,435 265,435 245,410" class="evt"/>
  <text x="350" y="417" class="lb">Фотография сделана</text>
  <line x1="350" y1="435" x2="350" y2="465" class="ar" marker-end="url(#ar313)"/>

  <!-- F3 -->
  <rect x="245" y="465" width="210" height="55" rx="10" class="fn"/>
  <text x="350" y="490" class="lb">Заполнение карточки</text>
  <text x="350" y="504" class="lb">в КАМИС</text>
  <line x1="350" y1="520" x2="350" y2="550" class="ar" marker-end="url(#ar313)"/>
  <line x1="455" y1="492" x2="510" y2="492" class="ar"/>
  <rect x="510" y="465" width="320" height="55" class="bn"/>
  <text x="520" y="483" class="bnT">Описание «с нуля» — нет шаблонов;</text>
  <text x="520" y="498" class="bnT">ошибки ручного ввода.</text>
  <text x="520" y="513" class="bnTc" text-anchor="start">Потери: 3–5 мин (периодически)</text>

  <!-- E4 -->
  <polygon points="265,550 435,550 455,575 435,600 265,600 245,575" class="evt"/>
  <text x="350" y="582" class="lb">Карточка заполнена</text>
  <line x1="350" y1="600" x2="350" y2="630" class="ar" marker-end="url(#ar313)"/>

  <!-- F4 -->
  <rect x="245" y="630" width="210" height="55" rx="10" class="fn"/>
  <text x="350" y="655" class="lb">Выгрузка в</text>
  <text x="350" y="669" class="lb">Государственный каталог</text>
  <line x1="350" y1="685" x2="350" y2="715" class="ar" marker-end="url(#ar313)"/>
  <line x1="455" y1="657" x2="510" y2="657" class="ar"/>
  <rect x="510" y="625" width="320" height="65" fill="#FFD6D6" stroke="#C00000" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="670" y="643" class="bnTc">КРИТИЧЕСКОЕ УЗКОЕ МЕСТО</text>
  <text x="520" y="660" class="bnT">Ожидание прогрузки 10 мин (22 % цикла);</text>
  <text x="520" y="675" class="bnT">зависание ПО, медленный интернет.</text>
  <text x="520" y="688" class="bnTc" text-anchor="start">Потери: 10 мин/экспонат</text>

  <!-- E5 -->
  <polygon points="265,715 435,715 455,740 435,765 265,765 245,740" class="evt"/>
  <text x="350" y="747" class="lb">Запись передана в каталог</text>
  <line x1="350" y1="765" x2="350" y2="795" class="ar" marker-end="url(#ar313)"/>

  <!-- F5: Проверка корректности -->
  <rect x="245" y="795" width="210" height="55" rx="10" class="fn"/>
  <text x="350" y="820" class="lb">Проверка корректности</text>
  <text x="350" y="834" class="lb">записи</text>
  <line x1="350" y1="850" x2="350" y2="880" class="ar" marker-end="url(#ar313)"/>

  <!-- E6: Проверка выполнена -->
  <polygon points="265,880 435,880 455,905 435,930 265,930 245,905" class="evt"/>
  <text x="350" y="912" class="lb">Корректность проверена</text>
  <line x1="350" y1="930" x2="350" y2="960" class="ar"/>

  <!-- XOR (после события — допустимо: за событием XOR-ветвление функций) -->
  <circle cx="350" cy="985" r="22" class="gw"/>
  <text x="350" y="993" class="lbb">×</text>
  <text x="395" y="990" class="lb" text-anchor="start">XOR</text>

  <!-- Two branches from XOR: left = ошибка, right = успех -->
  <line x1="350" y1="1007" x2="350" y2="1020" class="ar"/>
  <line x1="200" y1="1020" x2="500" y2="1020" class="ar"/>
  <line x1="200" y1="1020" x2="200" y2="1050" class="ar" marker-end="url(#ar313)"/>
  <line x1="500" y1="1020" x2="500" y2="1050" class="ar" marker-end="url(#ar313)"/>
  <text x="265" y="1015" class="lb">ошибка</text>
  <text x="565" y="1015" class="lb">успех</text>

  <!-- Left branch: F-err Исправление ошибок -->
  <rect x="100" y="1050" width="200" height="55" rx="10" class="fn"/>
  <text x="200" y="1075" class="lb">Исправление ошибок,</text>
  <text x="200" y="1089" class="lb">повторный ввод</text>
  <!-- E-err -->
  <line x1="200" y1="1105" x2="200" y2="1135" class="ar" marker-end="url(#ar313)"/>
  <polygon points="115,1135 285,1135 305,1160 285,1185 115,1185 95,1160" class="evt"/>
  <text x="200" y="1167" class="lb">Ошибка исправлена</text>
  <!-- loop back to E "Карточка заполнена" -->
  <line x1="200" y1="1185" x2="200" y2="1215" class="ar"/>
  <line x1="200" y1="1215" x2="60" y2="1215" class="ar"/>
  <line x1="60" y1="1215" x2="60" y2="575" class="ar"/>
  <line x1="60" y1="575" x2="245" y2="575" class="ar" marker-end="url(#ar313)"/>
  <text x="80" y="900" class="lb" text-anchor="start">возврат к «Карточка заполнена»</text>

  <!-- Right branch: E final + F5 (перенос) -->
  <polygon points="415,1050 585,1050 605,1075 585,1100 415,1100 395,1075" class="evt"/>
  <text x="500" y="1082" class="lb">Запись подтверждена</text>
  <line x1="500" y1="1100" x2="500" y2="1130" class="ar" marker-end="url(#ar313)"/>

  <rect x="395" y="1130" width="210" height="55" rx="10" class="fn"/>
  <text x="500" y="1155" class="lb">Перенос подтверждения</text>
  <text x="500" y="1169" class="lb">из Госкаталога в КАМИС</text>
  <line x1="500" y1="1185" x2="500" y2="1215" class="ar" marker-end="url(#ar313)"/>
  <line x1="605" y1="1157" x2="660" y2="1157" class="ar"/>
  <rect x="660" y="1130" width="320" height="55" class="bn"/>
  <text x="670" y="1148" class="bnT">Дублирование действий между двумя</text>
  <text x="670" y="1163" class="bnT">системами; ручной перенос данных.</text>
  <text x="670" y="1178" class="bnTc" text-anchor="start">Потери: 55 с/экспонат</text>

  <!-- Final E -->
  <polygon points="395,1215 605,1215 625,1240 605,1265 395,1265 375,1240" class="evt" stroke-width="2"/>
  <text x="500" y="1242" class="lb" font-weight="bold">Экспонат зарегистрирован</text>
  <text x="500" y="1257" class="lb">в КАМИС и Госкаталоге</text>

  <!-- Legend -->
  <rect x="80" y="1320" width="940" height="100" fill="none" stroke="#888" stroke-width="0.8"/>
  <text x="100" y="1340" class="lb" text-anchor="start" font-weight="bold">Легенда:</text>
  <polygon points="180,1352 240,1352 250,1365 240,1378 180,1378 170,1365" class="evt"/>
  <text x="270" y="1370" class="lb" text-anchor="start">— событие</text>
  <rect x="370" y="1352" width="60" height="26" rx="6" class="fn"/>
  <text x="450" y="1370" class="lb" text-anchor="start">— функция</text>
  <circle cx="565" cy="1365" r="13" class="gw"/>
  <text x="565" y="1370" class="lbb">×</text>
  <text x="590" y="1370" class="lb" text-anchor="start">— XOR (исключающее ИЛИ)</text>
  <rect x="780" y="1352" width="60" height="26" class="bn"/>
  <text x="855" y="1370" class="lb" text-anchor="start">— узкое место (потери)</text>
  <text x="100" y="1402" class="lb" text-anchor="start">Правило EPC: чередование «событие → функция → событие». Каждый элемент — одна входящая и одна исходящая связь.</text>

  <text x="550" y="1460" class="src">Источник: составлено автором.</text>
</svg>
