<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <defs>
    <marker id="arr313" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  <style>
    .ttl{font-family:'Times New Roman',serif;font-size:15px;font-weight:bold;text-anchor:middle}
    .lbl{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle}
    .lblb{font-family:'Times New Roman',serif;font-size:12px;text-anchor:middle;font-weight:bold}
    .lblL{font-family:'Times New Roman',serif;font-size:11px}
    .src{font-family:'Times New Roman',serif;font-size:13px;text-anchor:middle;font-style:italic}
    .ar{stroke:#000;stroke-width:1.5;fill:none}
    /* Событие — шестиугольник, розовый */
    .evt{fill:#FCE4D6;stroke:#000;stroke-width:1.3}
    /* Функция — закругл. прямоугольник, зелёный */
    .fn{fill:#E2EFDA;stroke:#000;stroke-width:1.3}
    /* Логический оператор */
    .gw{fill:white;stroke:#000;stroke-width:1.3}
    /* Узкое место — красный пунктирный блок */
    .bot{fill:#FFEDED;stroke:#C00000;stroke-width:1.3;stroke-dasharray:5,3}
    .botT{font-family:'Times New Roman',serif;font-size:11px;text-anchor:middle;fill:#8B0000}
  </style>

  <rect width="1400" height="780" fill="white"/>
  <text x="700" y="28" class="ttl">Рис. 3.1.3. EPC-модель «Регистрация экспонатов в КАМИС» (AS IS): проблемные зоны</text>

  <!-- Колонки -->
  <text x="200" y="62" class="lblb">События (E)</text>
  <text x="600" y="62" class="lblb">Функции (F)</text>
  <text x="1100" y="62" class="lblb">Узкие места и потери</text>

  <!-- ============= ROW 1 ============= -->
  <!-- Событие 1: Экспонат поступил -->
  <polygon points="100,90 280,90 300,115 280,140 100,140 80,115" class="evt"/>
  <text x="190" y="110" class="lbl">Экспонат поступил</text>
  <text x="190" y="124" class="lbl">для регистрации</text>

  <line x1="300" y1="115" x2="430" y2="115" class="ar" marker-end="url(#arr313)"/>

  <rect x="430" y="90" width="220" height="50" rx="10" class="fn"/>
  <text x="540" y="110" class="lbl">F1. Подготовка фотозоны</text>
  <text x="540" y="124" class="lbl">(настройка фона, освещения)</text>

  <line x1="650" y1="115" x2="780" y2="115" class="ar" marker-end="url(#arr313)"/>

  <rect x="780" y="80" width="380" height="70" class="bot"/>
  <text x="970" y="100" class="botT" font-weight="bold">⚠ Ежедневная настройка фотоаппарата и фона;</text>
  <text x="970" y="115" class="botT">отсутствие стационарной фотозоны (не применяется 5С)</text>
  <text x="970" y="138" class="botT" font-weight="bold">Потери: 5 мин/день</text>

  <!-- Связь между F1 и следующим E -->
  <line x1="540" y1="140" x2="540" y2="170" class="ar" marker-end="url(#arr313)"/>

  <!-- ============= ROW 2 ============= -->
  <polygon points="100,180 280,180 300,205 280,230 100,230 80,205" class="evt"/>
  <text x="190" y="200" class="lbl">Фотозона</text>
  <text x="190" y="214" class="lbl">готова</text>

  <line x1="300" y1="205" x2="430" y2="205" class="ar" marker-end="url(#arr313)"/>

  <rect x="430" y="180" width="220" height="50" rx="10" class="fn"/>
  <text x="540" y="200" class="lbl">F2. Фотосъемка</text>
  <text x="540" y="214" class="lbl">экспоната</text>

  <line x1="650" y1="205" x2="780" y2="205" class="ar" marker-end="url(#arr313)"/>

  <rect x="780" y="170" width="380" height="70" class="bot"/>
  <text x="970" y="190" class="botT" font-weight="bold">⚠ Перемещение тяжелых образцов между</text>
  <text x="970" y="205" class="botT">хранилищем и рабочим местом; физическая нагрузка</text>
  <text x="970" y="228" class="botT" font-weight="bold">Потери: 1,5 мин/экспонат</text>

  <line x1="540" y1="230" x2="540" y2="260" class="ar" marker-end="url(#arr313)"/>

  <!-- ============= ROW 3 ============= -->
  <polygon points="100,270 280,270 300,295 280,320 100,320 80,295" class="evt"/>
  <text x="190" y="290" class="lbl">Фотография</text>
  <text x="190" y="304" class="lbl">сделана</text>

  <line x1="300" y1="295" x2="430" y2="295" class="ar" marker-end="url(#arr313)"/>

  <rect x="430" y="270" width="220" height="50" rx="10" class="fn"/>
  <text x="540" y="290" class="lbl">F3. Заполнение карточки</text>
  <text x="540" y="304" class="lbl">в КАМИС</text>

  <line x1="650" y1="295" x2="780" y2="295" class="ar" marker-end="url(#arr313)"/>

  <rect x="780" y="260" width="380" height="70" class="bot"/>
  <text x="970" y="280" class="botT" font-weight="bold">⚠ Отсутствие шаблонов — описание «с нуля»;</text>
  <text x="970" y="295" class="botT">ошибки из-за ручного ввода</text>
  <text x="970" y="318" class="botT" font-weight="bold">Потери: 3–5 мин (периодически)</text>

  <line x1="540" y1="320" x2="540" y2="350" class="ar" marker-end="url(#arr313)"/>

  <!-- ============= ROW 4 (КРИТИЧЕСКОЕ) ============= -->
  <polygon points="100,360 280,360 300,385 280,410 100,410 80,385" class="evt"/>
  <text x="190" y="380" class="lbl">Карточка</text>
  <text x="190" y="394" class="lbl">заполнена</text>

  <line x1="300" y1="385" x2="430" y2="385" class="ar" marker-end="url(#arr313)"/>

  <rect x="430" y="360" width="220" height="50" rx="10" class="fn"/>
  <text x="540" y="380" class="lbl">F4. Выгрузка в</text>
  <text x="540" y="394" class="lbl">Государственный каталог</text>

  <line x1="650" y1="385" x2="780" y2="385" class="ar" marker-end="url(#arr313)"/>

  <rect x="780" y="345" width="380" height="85" fill="#FFD6D6" stroke="#C00000" stroke-width="2"/>
  <text x="970" y="365" class="botT" font-weight="bold">⚠⚠ КРИТИЧЕСКОЕ УЗКОЕ МЕСТО</text>
  <text x="970" y="382" class="botT">Ожидание прогрузки 10 мин (22 % цикла);</text>
  <text x="970" y="397" class="botT">зависание ПО; медленный интернет</text>
  <text x="970" y="420" class="botT" font-weight="bold">Потери: 10 мин/экспонат</text>

  <!-- XOR после F4 -->
  <line x1="540" y1="410" x2="540" y2="440" class="ar"/>
  <polygon points="520,440 540,420 560,440 540,460" class="gw"/>
  <text x="540" y="446" class="lblb">×</text>
  <text x="615" y="445" class="lbl" text-anchor="start">XOR — проверка корректности</text>

  <!-- Ветвь "ошибка" -->
  <line x1="540" y1="460" x2="350" y2="460" class="ar"/>
  <line x1="350" y1="460" x2="350" y2="500" class="ar" marker-end="url(#arr313)"/>
  <text x="445" y="455" class="lbl">ошибка</text>

  <rect x="220" y="500" width="260" height="50" rx="10" class="fn"/>
  <text x="350" y="520" class="lbl">F-err. Исправление ошибок,</text>
  <text x="350" y="534" class="lbl">повторный ввод</text>
  <!-- возврат -->
  <line x1="220" y1="525" x2="180" y2="525" class="ar"/>
  <line x1="180" y1="525" x2="180" y2="385" class="ar"/>
  <line x1="180" y1="385" x2="80" y2="385" class="ar" marker-end="url(#arr313)"/>
  <text x="160" y="540" class="lbl">возврат к «Карточка заполнена»</text>

  <!-- Ветвь "успех" -->
  <line x1="540" y1="460" x2="730" y2="460" class="ar"/>
  <line x1="730" y1="460" x2="730" y2="490" class="ar" marker-end="url(#arr313)"/>
  <text x="640" y="455" class="lbl">успех</text>

  <!-- ============= ROW 5 ============= -->
  <polygon points="640,490 820,490 840,515 820,540 640,540 620,515" class="evt"/>
  <text x="730" y="510" class="lbl">Запись в каталоге</text>
  <text x="730" y="524" class="lbl">подтверждена</text>

  <line x1="730" y1="540" x2="730" y2="570" class="ar" marker-end="url(#arr313)"/>

  <rect x="620" y="570" width="220" height="50" rx="10" class="fn"/>
  <text x="730" y="590" class="lbl">F5. Перенос подтверждения</text>
  <text x="730" y="604" class="lbl">из каталога в КАМИС</text>

  <line x1="840" y1="595" x2="900" y2="595" class="ar" marker-end="url(#arr313)"/>

  <rect x="900" y="565" width="380" height="65" class="bot"/>
  <text x="1090" y="585" class="botT" font-weight="bold">⚠ Дублирование между двумя системами;</text>
  <text x="1090" y="600" class="botT">ручной перенос данных</text>
  <text x="1090" y="620" class="botT" font-weight="bold">Потери: 55 сек/экспонат</text>

  <!-- Конечное событие -->
  <line x1="730" y1="620" x2="730" y2="660" class="ar" marker-end="url(#arr313)"/>
  <polygon points="640,660 820,660 840,685 820,710 640,710 620,685" fill="#FCE4D6" stroke="#C00000" stroke-width="2"/>
  <text x="730" y="680" class="lbl" font-weight="bold">Экспонат зарегистрирован</text>
  <text x="730" y="694" class="lbl">в КАМИС и Госкаталоге</text>

  <text x="700" y="755" class="src">Источник: составлено автором.</text>
</svg>
