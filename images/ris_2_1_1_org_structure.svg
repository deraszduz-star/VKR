<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750">
  <defs>
    <marker id="arrowOrg" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="750" fill="white"/>
  
  <!-- Level 1: Учёный совет -->
  <rect x="370" y="20" width="260" height="50" rx="5" ry="5" fill="#D9E2F3" stroke="#4472C4" stroke-width="2"/>
  <text x="500" y="40" font-family="Times New Roman, Liberation Serif, serif" font-size="13" text-anchor="middle" font-weight="bold">УЧЁНЫЙ СОВЕТ</text>
  <text x="500" y="58" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">(стратегическое руководство)</text>
  
  <!-- Arrow to Rector -->
  <line x1="500" y1="70" x2="500" y2="95" stroke="#000" stroke-width="1.5" marker-end="url(#arrowOrg)"/>
  
  <!-- Level 2: Ректор -->
  <rect x="410" y="100" width="180" height="40" rx="5" ry="5" fill="#4472C4" stroke="#2F5496" stroke-width="2"/>
  <text x="500" y="125" font-family="Times New Roman, Liberation Serif, serif" font-size="14" text-anchor="middle" font-weight="bold" fill="white">РЕКТОР</text>
  
  <!-- Arrows from Rector to 3 branches -->
  <line x1="500" y1="140" x2="500" y2="160" stroke="#000" stroke-width="1.5"/>
  <line x1="200" y1="160" x2="800" y2="160" stroke="#000" stroke-width="1.5"/>
  <line x1="200" y1="160" x2="200" y2="185" stroke="#000" stroke-width="1.5" marker-end="url(#arrowOrg)"/>
  <line x1="500" y1="160" x2="500" y2="185" stroke="#000" stroke-width="1.5" marker-end="url(#arrowOrg)"/>
  <line x1="800" y1="160" x2="800" y2="185" stroke="#000" stroke-width="1.5" marker-end="url(#arrowOrg)"/>
  
  <!-- Branch 1: Проректоры -->
  <rect x="100" y="190" width="200" height="155" rx="5" ry="5" fill="#E2EFDA" stroke="#70AD47" stroke-width="1.5"/>
  <text x="200" y="210" font-family="Times New Roman, Liberation Serif, serif" font-size="12" text-anchor="middle" font-weight="bold">ПРОРЕКТОРЫ</text>
  <text x="200" y="226" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">по направлениям:</text>
  <text x="120" y="245" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• образование</text>
  <text x="120" y="261" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• наука</text>
  <text x="120" y="277" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• международная деят.</text>
  <text x="120" y="293" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• экономика</text>
  <text x="120" y="309" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• воспитание</text>
  <text x="120" y="325" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• инфраструктура</text>
  
  <!-- Branch 2: Аппарат ректора -->
  <rect x="350" y="190" width="300" height="155" rx="5" ry="5" fill="#FBE5D6" stroke="#ED7D31" stroke-width="1.5"/>
  <text x="500" y="210" font-family="Times New Roman, Liberation Serif, serif" font-size="12" text-anchor="middle" font-weight="bold">АППАРАТ РЕКТОРА И</text>
  <text x="500" y="226" font-family="Times New Roman, Liberation Serif, serif" font-size="12" text-anchor="middle" font-weight="bold">УПРАВЛЕНЧЕСКИЕ ПОДРАЗДЕЛЕНИЯ</text>
  <text x="370" y="247" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• Учебно-методическое управление</text>
  <text x="370" y="263" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• Научное управление</text>
  <text x="370" y="279" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• Управление кадров</text>
  <text x="370" y="295" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• Планово-финансовое управление</text>
  <text x="370" y="311" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• Управление закупок</text>
  <text x="370" y="327" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• Департамент ИТ, Канцелярия</text>
  
  <!-- Branch 3: Попечительский совет -->
  <rect x="700" y="190" width="200" height="50" rx="5" ry="5" fill="#F2E6FF" stroke="#7030A0" stroke-width="1.5"/>
  <text x="800" y="212" font-family="Times New Roman, Liberation Serif, serif" font-size="12" text-anchor="middle" font-weight="bold">ПОПЕЧИТЕЛЬСКИЙ</text>
  <text x="800" y="228" font-family="Times New Roman, Liberation Serif, serif" font-size="12" text-anchor="middle" font-weight="bold">СОВЕТ</text>
  
  <!-- Connecting line from Проректоры and Аппарат to lower level -->
  <line x1="200" y1="345" x2="200" y2="375" stroke="#000" stroke-width="1.5"/>
  <line x1="500" y1="345" x2="500" y2="375" stroke="#000" stroke-width="1.5"/>
  <line x1="200" y1="375" x2="500" y2="375" stroke="#000" stroke-width="1.5"/>
  <line x1="350" y1="375" x2="350" y2="395" stroke="#000" stroke-width="1.5"/>
  
  <!-- Horizontal line for 4 bottom blocks -->
  <line x1="130" y1="395" x2="870" y2="395" stroke="#000" stroke-width="1.5"/>
  <line x1="130" y1="395" x2="130" y2="415" stroke="#000" stroke-width="1.5" marker-end="url(#arrowOrg)"/>
  <line x1="380" y1="395" x2="380" y2="415" stroke="#000" stroke-width="1.5" marker-end="url(#arrowOrg)"/>
  <line x1="620" y1="395" x2="620" y2="415" stroke="#000" stroke-width="1.5" marker-end="url(#arrowOrg)"/>
  <line x1="870" y1="395" x2="870" y2="415" stroke="#000" stroke-width="1.5" marker-end="url(#arrowOrg)"/>
  
  <!-- Block 1: Учебно-научные подразделения -->
  <rect x="30" y="420" width="210" height="280" rx="5" ry="5" fill="#D9E2F3" stroke="#4472C4" stroke-width="1.5"/>
  <text x="135" y="440" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" font-weight="bold">УЧЕБНО-НАУЧНЫЕ</text>
  <text x="135" y="455" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" font-weight="bold">ПОДРАЗДЕЛЕНИЯ</text>
  <text x="135" y="470" font-family="Times New Roman, Liberation Serif, serif" font-size="10" text-anchor="middle">(институты, высшие школы):</text>
  <text x="48" y="488" font-family="Times New Roman, Liberation Serif, serif" font-size="10">• ИУЭФ</text>
  <text x="48" y="502" font-family="Times New Roman, Liberation Serif, serif" font-size="10">• ИФМиБ</text>
  <text x="48" y="516" font-family="Times New Roman, Liberation Serif, serif" font-size="10">• ИММ</text>
  <text x="48" y="530" font-family="Times New Roman, Liberation Serif, serif" font-size="10">• ИВМиИТ</text>
  <text x="48" y="544" font-family="Times New Roman, Liberation Serif, serif" font-size="10">• Институт физики</text>
  <text x="48" y="558" font-family="Times New Roman, Liberation Serif, serif" font-size="10">• Институт химии</text>
  <text x="48" y="572" font-family="Times New Roman, Liberation Serif, serif" font-size="10">• ИГиНГТ</text>
  <text x="48" y="586" font-family="Times New Roman, Liberation Serif, serif" font-size="10">• ИЭиП</text>
  <text x="48" y="600" font-family="Times New Roman, Liberation Serif, serif" font-size="10">• ИФиМК</text>
  <text x="48" y="614" font-family="Times New Roman, Liberation Serif, serif" font-size="10">• ИМО, ИПиО, ИСФНиМК</text>
  <text x="48" y="628" font-family="Times New Roman, Liberation Serif, serif" font-size="10">• Юр. факультет</text>
  <text x="48" y="642" font-family="Times New Roman, Liberation Serif, serif" font-size="10">• ВШ ИТИС</text>
  <text x="48" y="656" font-family="Times New Roman, Liberation Serif, serif" font-size="10">• Инженерный институт</text>
  
  <!-- Block 2: Научно-исследовательские центры -->
  <rect x="260" y="420" width="230" height="200" rx="5" ry="5" fill="#E2EFDA" stroke="#70AD47" stroke-width="1.5"/>
  <text x="375" y="440" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" font-weight="bold">НАУЧНО-</text>
  <text x="375" y="455" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" font-weight="bold">ИССЛЕДОВАТЕЛЬСКИЕ</text>
  <text x="375" y="470" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" font-weight="bold">ЦЕНТРЫ И ЛАБОРАТОРИИ:</text>
  <text x="278" y="495" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• Приоритет-2030</text>
  <text x="278" y="515" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• НОЦ</text>
  <text x="278" y="535" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• Ведущие лаборатории</text>
  <text x="278" y="555" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• Технопарк</text>
  <text x="278" y="575" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• Бизнес-инкубатор</text>
  
  <!-- Block 3: Филиалы -->
  <rect x="510" y="420" width="210" height="120" rx="5" ry="5" fill="#FBE5D6" stroke="#ED7D31" stroke-width="1.5"/>
  <text x="615" y="440" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" font-weight="bold">ФИЛИАЛЫ</text>
  <text x="528" y="470" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• Набережночелнинский</text>
  <text x="528" y="495" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• Елабужский</text>
  
  <!-- Block 4: Вспомогательные службы -->
  <rect x="740" y="420" width="230" height="200" rx="5" ry="5" fill="#F2E6FF" stroke="#7030A0" stroke-width="1.5"/>
  <text x="855" y="440" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" font-weight="bold">ВСПОМОГАТЕЛЬНЫЕ</text>
  <text x="855" y="455" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" font-weight="bold">СЛУЖБЫ</text>
  <text x="758" y="480" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• Библиотека</text>
  <text x="758" y="500" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• Издательство</text>
  <text x="758" y="520" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• АХЧ</text>
  <text x="758" y="540" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• Студгородок</text>
  <text x="758" y="560" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• Музеи, планетарий</text>
  <text x="758" y="580" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• Спортивный комплекс</text>
  <text x="758" y="600" font-family="Times New Roman, Liberation Serif, serif" font-size="11">• Медцентр</text>
  
  <!-- Source text -->
  <text x="500" y="730" font-family="Times New Roman, Liberation Serif, serif" font-size="12" text-anchor="middle" font-style="italic">Источник: составлено автором на основе [47]</text>
</svg>
