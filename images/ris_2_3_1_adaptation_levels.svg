<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="580" viewBox="0 0 780 580">
  <defs>
    <marker id="arrowAdapt" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4472C4"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="780" height="580" fill="white"/>
  
  <!-- Title box -->
  <rect x="100" y="15" width="580" height="35" rx="5" ry="5" fill="#4472C4" stroke="#2F5496" stroke-width="2"/>
  <text x="390" y="38" font-family="Times New Roman, Liberation Serif, serif" font-size="13" text-anchor="middle" font-weight="bold" fill="white">УРОВНИ АДАПТАЦИИ ПРОЦЕССНОГО ПОДХОДА К ВУЗУ</text>
  
  <!-- Outer frame -->
  <rect x="40" y="60" width="700" height="470" rx="5" ry="5" fill="none" stroke="#000" stroke-width="1.5"/>
  
  <!-- Level 1 -->
  <rect x="70" y="80" width="640" height="120" rx="8" ry="8" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
  <text x="390" y="102" font-family="Times New Roman, Liberation Serif, serif" font-size="13" text-anchor="middle" font-weight="bold">УРОВЕНЬ 1: ВСПОМОГАТЕЛЬНЫЕ И АДМИНИСТРАТИВНЫЕ ПРОЦЕССЫ</text>
  <line x1="90" y1="110" x2="690" y2="110" stroke="#70AD47" stroke-width="1"/>
  <text x="90" y="132" font-family="Times New Roman, Liberation Serif, serif" font-size="12">• Полное применение Lean, Six Sigma, автоматизация</text>
  <text x="90" y="152" font-family="Times New Roman, Liberation Serif, serif" font-size="12">• Закупки, документооборот, кадровое делопроизводство</text>
  <text x="90" y="172" font-family="Times New Roman, Liberation Serif, serif" font-size="12" font-weight="bold">Критерий: снижение времени и стоимости</text>
  
  <!-- Arrow 1→2 -->
  <line x1="390" y1="200" x2="390" y2="225" stroke="#4472C4" stroke-width="2" marker-end="url(#arrowAdapt)"/>
  
  <!-- Level 2 -->
  <rect x="70" y="230" width="640" height="130" rx="8" ry="8" fill="#FBE5D6" stroke="#ED7D31" stroke-width="2"/>
  <text x="390" y="252" font-family="Times New Roman, Liberation Serif, serif" font-size="13" text-anchor="middle" font-weight="bold">УРОВЕНЬ 2: УПРАВЛЕНЧЕСКИЕ ПРОЦЕССЫ</text>
  <line x1="90" y1="260" x2="690" y2="260" stroke="#ED7D31" stroke-width="1"/>
  <text x="90" y="282" font-family="Times New Roman, Liberation Serif, serif" font-size="12">• Адаптированное применение (с учётом нормативных ограничений</text>
  <text x="90" y="300" font-family="Times New Roman, Liberation Serif, serif" font-size="12">  и множественности стейкхолдеров)</text>
  <text x="90" y="320" font-family="Times New Roman, Liberation Serif, serif" font-size="12">• Стратегическое планирование, мониторинг, управление качеством</text>
  <text x="90" y="340" font-family="Times New Roman, Liberation Serif, serif" font-size="12" font-weight="bold">Критерий: баланс эффективности и соответствия</text>
  
  <!-- Arrow 2→3 -->
  <line x1="390" y1="360" x2="390" y2="385" stroke="#4472C4" stroke-width="2" marker-end="url(#arrowAdapt)"/>
  
  <!-- Level 3 -->
  <rect x="70" y="390" width="640" height="125" rx="8" ry="8" fill="#D9E2F3" stroke="#4472C4" stroke-width="2"/>
  <text x="390" y="412" font-family="Times New Roman, Liberation Serif, serif" font-size="13" text-anchor="middle" font-weight="bold">УРОВЕНЬ 3: ОСНОВНЫЕ ОБРАЗОВАТЕЛЬНЫЕ И НАУЧНЫЕ ПРОЦЕССЫ</text>
  <line x1="90" y1="420" x2="690" y2="420" stroke="#4472C4" stroke-width="1"/>
  <text x="90" y="442" font-family="Times New Roman, Liberation Serif, serif" font-size="12">• Ограниченное применение (приоритет качества и академических свобод)</text>
  <text x="90" y="462" font-family="Times New Roman, Liberation Serif, serif" font-size="12">• Реализация ООП, научная деятельность, взаимодействие преподавателя</text>
  <text x="90" y="480" font-family="Times New Roman, Liberation Serif, serif" font-size="12">  и студента</text>
  <text x="90" y="500" font-family="Times New Roman, Liberation Serif, serif" font-size="12" font-weight="bold">Критерий: качество образовательных результатов</text>
  
  <!-- Side annotation: degree of applicability -->
  <text x="30" y="80" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" transform="rotate(-90, 30, 310)" fill="#666">Степень применимости процессного подхода ▼</text>
  
  <!-- Source text -->
  <text x="390" y="558" font-family="Times New Roman, Liberation Serif, serif" font-size="12" text-anchor="middle" font-style="italic">Источник: составлено автором на основе [9, с. 132; 22; 29; 46]</text>
</svg>
