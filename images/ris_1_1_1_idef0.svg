<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="white"/>
  
  <!-- Title area - Management controls (top) -->
  <rect x="200" y="20" width="400" height="60" rx="0" ry="0" fill="#f0f0f0" stroke="#000" stroke-width="1.5"/>
  <text x="400" y="40" font-family="Times New Roman, Liberation Serif, serif" font-size="12" text-anchor="middle" font-weight="bold">УПРАВЛЯЮЩИЕ ВОЗДЕЙСТВИЯ</text>
  <text x="400" y="58" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">(регламенты, стандарты, нормативные акты,</text>
  <text x="400" y="72" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">ФГОС, приказы)</text>
  
  <!-- Arrow from top to center -->
  <line x1="400" y1="80" x2="400" y2="180" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Central process box -->
  <rect x="250" y="185" width="300" height="120" rx="0" ry="0" fill="#e8f4e8" stroke="#000" stroke-width="2"/>
  <text x="400" y="225" font-family="Times New Roman, Liberation Serif, serif" font-size="14" text-anchor="middle" font-weight="bold">БИЗНЕС-ПРОЦЕСС</text>
  <text x="400" y="250" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">(преобразование входов</text>
  <text x="400" y="267" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">в выходы, создающие</text>
  <text x="400" y="284" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">ценность для потребителя)</text>
  
  <!-- Inputs (left) -->
  <rect x="30" y="195" width="150" height="100" rx="0" ry="0" fill="#f0f0f0" stroke="#000" stroke-width="1.5"/>
  <text x="105" y="218" font-family="Times New Roman, Liberation Serif, serif" font-size="13" text-anchor="middle" font-weight="bold">ВХОДЫ</text>
  <text x="105" y="238" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">• Информация</text>
  <text x="105" y="255" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">• Документы</text>
  <text x="105" y="272" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">• Ресурсы</text>
  <text x="105" y="289" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">• Заявки</text>
  
  <!-- Arrow from inputs to center -->
  <line x1="180" y1="245" x2="245" y2="245" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Outputs (right) -->
  <rect x="620" y="195" width="150" height="100" rx="0" ry="0" fill="#f0f0f0" stroke="#000" stroke-width="1.5"/>
  <text x="695" y="218" font-family="Times New Roman, Liberation Serif, serif" font-size="13" text-anchor="middle" font-weight="bold">ВЫХОДЫ</text>
  <text x="695" y="238" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">• Продукт</text>
  <text x="695" y="255" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">• Услуга</text>
  <text x="695" y="272" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">• Документ</text>
  <text x="695" y="289" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">• Результат</text>
  
  <!-- Arrow from center to outputs -->
  <line x1="555" y1="245" x2="615" y2="245" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Mechanisms (bottom) -->
  <rect x="200" y="380" width="400" height="60" rx="0" ry="0" fill="#f0f0f0" stroke="#000" stroke-width="1.5"/>
  <text x="400" y="400" font-family="Times New Roman, Liberation Serif, serif" font-size="12" text-anchor="middle" font-weight="bold">МЕХАНИЗМЫ (РЕСУРСЫ)</text>
  <text x="400" y="420" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">(персонал, оборудование, ПО, финансы,</text>
  <text x="400" y="436" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">помещения)</text>
  
  <!-- Arrow from bottom to center -->
  <line x1="400" y1="375" x2="400" y2="310" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Source text -->
  <text x="400" y="475" font-family="Times New Roman, Liberation Serif, serif" font-size="12" text-anchor="middle" font-style="italic">Источник: составлено автором на основе [8, с. 32; 24]</text>
</svg>
