<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="650" height="620" viewBox="0 0 650 620">
  <defs>
    <marker id="arrowLC" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="650" height="620" fill="white"/>
  
  <!-- Step 1: Проектирование -->
  <rect x="200" y="30" width="220" height="55" rx="8" ry="8" fill="#D9E2F3" stroke="#4472C4" stroke-width="2"/>
  <text x="310" y="53" font-family="Times New Roman, Liberation Serif, serif" font-size="13" text-anchor="middle" font-weight="bold">1. ПРОЕКТИРОВАНИЕ</text>
  <text x="310" y="72" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">(определение целей и задач)</text>
  
  <!-- Arrow 1→2 -->
  <line x1="310" y1="85" x2="310" y2="110" stroke="#000" stroke-width="1.5" marker-end="url(#arrowLC)"/>
  
  <!-- Step 2: Моделирование -->
  <rect x="200" y="115" width="220" height="55" rx="8" ry="8" fill="#D9E2F3" stroke="#4472C4" stroke-width="2"/>
  <text x="310" y="138" font-family="Times New Roman, Liberation Serif, serif" font-size="13" text-anchor="middle" font-weight="bold">2. МОДЕЛИРОВАНИЕ</text>
  <text x="310" y="157" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">(построение модели AS-IS / TO-BE)</text>
  
  <!-- Arrow 2→3 -->
  <line x1="310" y1="170" x2="310" y2="195" stroke="#000" stroke-width="1.5" marker-end="url(#arrowLC)"/>
  
  <!-- Step 3: Внедрение -->
  <rect x="200" y="200" width="220" height="55" rx="8" ry="8" fill="#D9E2F3" stroke="#4472C4" stroke-width="2"/>
  <text x="310" y="223" font-family="Times New Roman, Liberation Serif, serif" font-size="13" text-anchor="middle" font-weight="bold">3. ВНЕДРЕНИЕ</text>
  <text x="310" y="242" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">(реализация изменений)</text>
  
  <!-- Arrow 3→4 -->
  <line x1="310" y1="255" x2="310" y2="280" stroke="#000" stroke-width="1.5" marker-end="url(#arrowLC)"/>
  
  <!-- Step 4: Выполнение -->
  <rect x="200" y="285" width="220" height="55" rx="8" ry="8" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
  <text x="310" y="308" font-family="Times New Roman, Liberation Serif, serif" font-size="13" text-anchor="middle" font-weight="bold">4. ВЫПОЛНЕНИЕ</text>
  <text x="310" y="327" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">(операционная деятельность)</text>
  
  <!-- Arrow 4→5 -->
  <line x1="310" y1="340" x2="310" y2="365" stroke="#000" stroke-width="1.5" marker-end="url(#arrowLC)"/>
  
  <!-- Step 5: Мониторинг -->
  <rect x="200" y="370" width="220" height="55" rx="8" ry="8" fill="#FBE5D6" stroke="#ED7D31" stroke-width="2"/>
  <text x="310" y="393" font-family="Times New Roman, Liberation Serif, serif" font-size="13" text-anchor="middle" font-weight="bold">5. МОНИТОРИНГ</text>
  <text x="310" y="412" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">(сбор данных и контроль KPI)</text>
  
  <!-- Arrow 5→6 -->
  <line x1="310" y1="425" x2="310" y2="450" stroke="#000" stroke-width="1.5" marker-end="url(#arrowLC)"/>
  
  <!-- Step 6: Анализ -->
  <rect x="200" y="455" width="220" height="55" rx="8" ry="8" fill="#FBE5D6" stroke="#ED7D31" stroke-width="2"/>
  <text x="310" y="478" font-family="Times New Roman, Liberation Serif, serif" font-size="13" text-anchor="middle" font-weight="bold">6. АНАЛИЗ</text>
  <text x="310" y="497" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">(выявление узких мест)</text>
  
  <!-- Feedback loop arrow: from step 6 right side, going up to step 1 -->
  <!-- Right side vertical line -->
  <line x1="420" y1="483" x2="500" y2="483" stroke="#C00000" stroke-width="2"/>
  <line x1="500" y1="483" x2="500" y2="57" stroke="#C00000" stroke-width="2"/>
  <line x1="500" y1="57" x2="425" y2="57" stroke="#C00000" stroke-width="2" marker-end="url(#arrowLC)"/>
  
  <!-- Label for optimization loop -->
  <rect x="510" y="250" width="120" height="40" rx="5" ry="5" fill="#FCE4EC" stroke="#C00000" stroke-width="1.5"/>
  <text x="570" y="267" font-family="Times New Roman, Liberation Serif, serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#C00000">7. ОПТИМИ-</text>
  <text x="570" y="283" font-family="Times New Roman, Liberation Serif, serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#C00000">ЗАЦИЯ</text>
  
  <!-- Connecting line from label to loop -->
  <line x1="510" y1="270" x2="505" y2="270" stroke="#C00000" stroke-width="1" stroke-dasharray="3,2"/>
  
  <!-- Source text -->
  <text x="325" y="560" font-family="Times New Roman, Liberation Serif, serif" font-size="12" text-anchor="middle" font-style="italic">Источник: составлено автором на основе [36; 9, с. 113; 20]</text>
</svg>
