<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="850" height="520" viewBox="0 0 850 520">
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="850" height="520" fill="white"/>
  
  <!-- Main outer frame -->
  <rect x="30" y="20" width="790" height="440" rx="5" ry="5" fill="none" stroke="#000" stroke-width="2"/>
  
  <!-- Section 1: ОСНОВНЫЕ ПРОЦЕССЫ header -->
  <rect x="30" y="20" width="790" height="30" fill="#4472C4" stroke="#000" stroke-width="1.5"/>
  <text x="425" y="41" font-family="Times New Roman, Liberation Serif, serif" font-size="13" text-anchor="middle" font-weight="bold" fill="white">ОСНОВНЫЕ ПРОЦЕССЫ</text>
  
  <!-- 5 main process boxes -->
  <rect x="50" y="60" width="145" height="90" rx="3" ry="3" fill="#D9E2F3" stroke="#4472C4" stroke-width="1.5"/>
  <text x="122" y="80" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" font-weight="bold">Приём</text>
  <text x="122" y="95" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" font-weight="bold">абитуриентов</text>
  
  <rect x="205" y="60" width="145" height="90" rx="3" ry="3" fill="#D9E2F3" stroke="#4472C4" stroke-width="1.5"/>
  <text x="277" y="80" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" font-weight="bold">Учебный процесс</text>
  <text x="277" y="95" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">(реализация ООП)</text>
  
  <rect x="360" y="60" width="145" height="90" rx="3" ry="3" fill="#D9E2F3" stroke="#4472C4" stroke-width="1.5"/>
  <text x="432" y="80" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" font-weight="bold">Научная</text>
  <text x="432" y="95" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" font-weight="bold">деятельность</text>
  
  <rect x="515" y="60" width="145" height="90" rx="3" ry="3" fill="#D9E2F3" stroke="#4472C4" stroke-width="1.5"/>
  <text x="587" y="80" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" font-weight="bold">Воспитательная</text>
  <text x="587" y="95" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" font-weight="bold">работа</text>
  
  <rect x="670" y="60" width="135" height="90" rx="3" ry="3" fill="#D9E2F3" stroke="#4472C4" stroke-width="1.5"/>
  <text x="737" y="75" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" font-weight="bold">Трудоустройство</text>
  <text x="737" y="90" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" font-weight="bold">и сопровождение</text>
  <text x="737" y="105" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" font-weight="bold">выпускников</text>
  
  <!-- Arrows between main processes -->
  <line x1="195" y1="105" x2="200" y2="105" stroke="#000" stroke-width="1" marker-end="url(#arrowhead2)"/>
  <line x1="350" y1="105" x2="355" y2="105" stroke="#000" stroke-width="1" marker-end="url(#arrowhead2)"/>
  <line x1="505" y1="105" x2="510" y2="105" stroke="#000" stroke-width="1" marker-end="url(#arrowhead2)"/>
  <line x1="660" y1="105" x2="665" y2="105" stroke="#000" stroke-width="1" marker-end="url(#arrowhead2)"/>
  
  <!-- Value arrow -->
  <rect x="250" y="165" width="350" height="35" rx="3" ry="3" fill="#E2EFDA" stroke="#548235" stroke-width="2"/>
  <text x="425" y="177" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle">▼ ЦЕННОСТЬ ▼</text>
  <text x="425" y="193" font-family="Times New Roman, Liberation Serif, serif" font-size="12" text-anchor="middle" font-weight="bold">Компетентный выпускник / Научный результат</text>
  
  <!-- Section 2: ВСПОМОГАТЕЛЬНЫЕ ПРОЦЕССЫ -->
  <rect x="30" y="215" width="790" height="30" fill="#70AD47" stroke="#000" stroke-width="1.5"/>
  <text x="425" y="236" font-family="Times New Roman, Liberation Serif, serif" font-size="13" text-anchor="middle" font-weight="bold" fill="white">ВСПОМОГАТЕЛЬНЫЕ ПРОЦЕССЫ</text>
  
  <rect x="50" y="250" width="380" height="80" rx="3" ry="3" fill="#E2EFDA" stroke="#70AD47" stroke-width="1"/>
  <text x="60" y="270" font-family="Times New Roman, Liberation Serif, serif" font-size="12">• Управление персоналом (ППС)</text>
  <text x="60" y="288" font-family="Times New Roman, Liberation Serif, serif" font-size="12">• Финансовое управление</text>
  <text x="60" y="306" font-family="Times New Roman, Liberation Serif, serif" font-size="12">• Материально-техническое обеспечение</text>
  
  <rect x="440" y="250" width="365" height="80" rx="3" ry="3" fill="#E2EFDA" stroke="#70AD47" stroke-width="1"/>
  <text x="450" y="270" font-family="Times New Roman, Liberation Serif, serif" font-size="12">• ИТ-инфраструктура</text>
  <text x="450" y="288" font-family="Times New Roman, Liberation Serif, serif" font-size="12">• Библиотечное обеспечение</text>
  <text x="450" y="306" font-family="Times New Roman, Liberation Serif, serif" font-size="12">• Юридическое сопровождение</text>
  <text x="450" y="324" font-family="Times New Roman, Liberation Serif, serif" font-size="12">• Международное сотрудничество</text>
  
  <!-- Section 3: УПРАВЛЕНЧЕСКИЕ ПРОЦЕССЫ -->
  <rect x="30" y="345" width="790" height="30" fill="#ED7D31" stroke="#000" stroke-width="1.5"/>
  <text x="425" y="366" font-family="Times New Roman, Liberation Serif, serif" font-size="13" text-anchor="middle" font-weight="bold" fill="white">УПРАВЛЕНЧЕСКИЕ ПРОЦЕССЫ</text>
  
  <rect x="50" y="380" width="380" height="60" rx="3" ry="3" fill="#FBE5D6" stroke="#ED7D31" stroke-width="1"/>
  <text x="60" y="400" font-family="Times New Roman, Liberation Serif, serif" font-size="12">• Стратегическое планирование</text>
  <text x="60" y="418" font-family="Times New Roman, Liberation Serif, serif" font-size="12">• Мониторинг и оценка</text>
  
  <rect x="440" y="380" width="365" height="60" rx="3" ry="3" fill="#FBE5D6" stroke="#ED7D31" stroke-width="1"/>
  <text x="450" y="400" font-family="Times New Roman, Liberation Serif, serif" font-size="12">• Управление качеством</text>
  <text x="450" y="418" font-family="Times New Roman, Liberation Serif, serif" font-size="12">• Документооборот</text>
  
  <!-- Source text -->
  <text x="425" y="495" font-family="Times New Roman, Liberation Serif, serif" font-size="12" text-anchor="middle" font-style="italic">Источник: составлено автором на основе [13, с. 71; 33; 27, с. 113]</text>
</svg>
